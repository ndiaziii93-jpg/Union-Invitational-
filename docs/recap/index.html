.xm-tk{display:grid;gap:10px;background:var(--page);border-radius:14px;padding:12px;box-shadow:0 0 0 .5px var(--shadow)}
.xm-sibs{gap:0;padding:4px 12px}
.xm-sibs .xm-mo{cursor:pointer;padding:9px 0}
.xm-sibs .xm-mo:first-child{border-top:0}

.xm-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:10px;padding:3px}
.xm-seg button{font:inherit;font-weight:700;font-size:15px;color:var(--turf);background:none;border:0;border-radius:8px;padding:8px;min-height:42px;cursor:pointer}
.xm-seg button.on{background:var(--page);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.xm-seg button.y.on{background:#2F7A4A;color:#fff} .xm-seg button.n.on{background:var(--flag);color:#fff}
.xm-stp{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.xm-stp .ctl{display:flex;align-items:center;gap:8px}
.xm-stp .ctl button{width:42px;height:42px;border-radius:10px;border:0;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font:inherit;font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}
.xm-stp .ctl b{min-width:56px;text-align:center;font-size:19px}
.xm-q{display:flex;gap:6px;flex-wrap:wrap}
.xm-q button{flex:1 1 auto;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:9px;padding:9px 8px;min-height:42px;background:var(--paper);
  box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);cursor:pointer}
.xm-q button.on{background:var(--pine);color:var(--onpine);box-shadow:none}
.xm-kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;color:var(--turf)}
.xm-kv b{color:var(--ink);text-align:right}
.xm-kv b.up{color:#2F7A4A} .xm-kv b.dn{color:var(--flag)}
.xm-go{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:999px;min-height:54px;padding:13px 22px;font-size:16.5px;font-weight:700;border-bottom:2px solid #C9A253;-webkit-appearance:none;appearance:none}
.xm-page .btn,.xm-tk .btn{border-radius:999px}
.xm-note{margin:0;font-size:13px;color:var(--turf);line-height:1.4}
.xm-err{margin:0;font-size:14px;color:var(--flag);font-weight:600}
.xm-ob{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px}
.xm-ob .col{display:grid;gap:3px;align-content:start}
.xm-ob .hd{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--turf)}
.xm-ob .lvl{position:relative;display:flex;justify-content:space-between;padding:4px 7px;border-radius:6px;overflow:hidden}
.xm-ob .lvl i{position:absolute;inset:0 auto 0 0;opacity:.18}
.xm-ob .y .lvl i{background:#2F7A4A} .xm-ob .n .lvl i{background:var(--flag)}
.xm-ob .lvl span{position:relative}
.xm-none{font-size:13px;color:var(--turf);font-style:italic}
.xm-trades{gap:6px}
.xm-trades .xm-kv{font-size:13.5px}
.xm-rules{font-size:14px;color:var(--turf);background:var(--page);border-radius:12px;padding:11px 13px;line-height:1.45}
.xm-settle{display:grid;gap:8px;border-top:2px solid var(--ink);padding-top:10px}
.xm-link{justify-self:start;background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:var(--green);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.xm-pos{gap:0;padding:0 12px}
.xm-p{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:11px 0;border-top:1px solid var(--hair)}

.xm-p b{font-size:15px;line-height:1.3}
.xm-pl{font-weight:700;text-align:right}
.xm-p button{grid-column:2;grid-row:2;justify-self:end;font:inherit;font-size:13.5px;font-weight:700;background:var(--pine);color:var(--onpine);border:0;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.xm-x{background:none;border:0;font:inherit;font-weight:700;color:var(--flag);cursor:pointer;padding:6px}
.xm-f{display:grid;gap:6px;font-size:14px;font-weight:600}
.xm-f small{font-weight:400;color:var(--turf)}
.xm-f input{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--page);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:10px;padding:11px 12px;min-height:46px}
.xm-f input:focus{outline:2px solid var(--ink);outline-offset:0}
.xm-flash{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--pine);color:var(--onpine);border-radius:12px;
  padding:12px 15px;font-size:15px;border-left:4px solid #E2C277;box-shadow:0 8px 22px rgba(16,22,17,.35);animation:fadeIn .2s ease both;max-width:560px;margin:0 auto}
@media (min-width:700px){ .xm-flash{bottom:28px} }
@media (min-width:700px) and (max-width:1400px){ html.tablet .xm-flash{bottom:calc(var(--barh) + 22px)} }
.soc-c .soc-l b{color:var(--ink)}
.xm-seg button,.xm-q button,.xm-yn button,.xm-stp .ctl button,.xm-new,.ch-rx button{text-align:center}
.xm-stp .ctl button{padding:0}
.xm-page,.xm-c,.xm-how,.xm-new,.xm-sec,.ch-post,.ch-feed,.ch-plate,.xm-plate,.xm-subh{max-width:720px}
.xm-yn button small{font-size:13.5px;font-weight:600;opacity:.85;margin-left:3px}
.xm-anchor{display:block;height:0}

/* ---------------- the chat bubble ----------------
   One tap to the chat from every screen but Score Entry: a round button in
   the corner, a red count of what this phone has not read, and the newest
   line sliding out beside it when it lands. */
.chatfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:36;
  width:60px;height:60px;border-radius:50%;border:0;padding:0;background:var(--pine);color:#E2C277;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 0 2px var(--gold-up),0 10px 24px rgba(16,22,17,.4)}
.chatfab svg{width:28px;height:28px}
.chatfab .badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--flag);color:#fff;
  font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2px var(--paper);line-height:1}
.chatfab.pulse{animation:chatPulse 1.2s ease 2}
@keyframes chatPulse{50%{box-shadow:0 0 0 9px rgba(226,194,119,.45),0 10px 24px rgba(16,22,17,.4)}}
.chatpeek{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 70px);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:36;
  max-width:min(260px,calc(100vw - 110px));text-align:left;font:inherit;font-size:14px;line-height:1.3;color:var(--ink);cursor:pointer;
  background:var(--page);border:0;border-radius:16px 16px 4px 16px;padding:9px 12px;box-shadow:0 10px 24px rgba(16,22,17,.25),0 0 0 .5px rgba(29,46,33,.2);
  animation:chatPeek .35s cubic-bezier(.2,.9,.3,1.2) both}
.chatpeek b{display:block;font-size:12.5px;color:var(--gold)}
@keyframes chatPeek{from{opacity:0;transform:translateX(16px) scale(.9)}to{opacity:1;transform:none}}
/* over the Photos page's own button, not on top of it */
.chatfab.up{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.chatpeek.up{bottom:calc(166px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){ .chatfab{bottom:28px} .chatpeek{bottom:34px} .chatfab.up{bottom:96px} .chatpeek.up{bottom:102px} }
@media (min-width:700px) and (max-width:1400px){
  html.tablet .chatfab{bottom:calc(var(--barh) + 22px)} html.tablet .chatpeek{bottom:calc(var(--barh) + 28px)}
  html.tablet .chatfab.up{bottom:calc(var(--barh) + 90px)} html.tablet .chatpeek.up{bottom:calc(var(--barh) + 96px)}
}
@media (prefers-reduced-motion:reduce){ .chatfab.pulse,.chatpeek{animation:none} }
/* the chat as a sheet */
.chatsheet .ps-body{padding:6px 14px 30px}
.chatsheet .ch-rooms{margin-top:6px}
.chatsheet .mbanner{margin:0}
/* the invitation to be buzzed */
.ch-push{display:flex;align-items:center;gap:10px;margin-top:10px;background:#F3E6CF;border:1.5px solid var(--gold-up);border-radius:14px;padding:10px 10px 10px 12px;font-size:14px;line-height:1.35}
.ch-push b{color:var(--ink)}
.ch-pi{font-size:22px;flex:0 0 auto}
.ch-push > span:nth-child(2){flex:1;min-width:0;color:var(--turf)}
.ch-push .btn{flex:0 0 auto}
.ch-perr{display:block;font-style:normal;color:var(--flag);font-weight:600;margin-top:3px}
.ch-pushnote{margin:8px 0 0;font-size:13px;color:var(--turf)}
.ch-pushnote button{background:none;border:0;font:inherit;color:var(--green);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
/* the chat with the keyboard up: fitted to what is left of the screen */
html.kbd .scrim.chatscrim{top:var(--vvt,0px);bottom:auto;height:var(--vvh,100%)}
html.kbd .modal.psheet.chatsheet{height:calc(var(--vvh,75dvh) - 10px);max-height:none;border-radius:18px 18px 0 0}
html.kbd .chatsheet .mbanner{padding-top:9px;padding-bottom:9px}
html.kbd .chatsheet .mbanner .mb-s,html.kbd .chatsheet .mb-c{display:none}
html.kbd .chatsheet .ps-grab{display:none}
/* while typing, the conversation gets the room: the chat to post in is
   already chosen, and reactions wait for the keyboard to go */
html.kbd .chatsheet .ch-rooms,html.kbd .chatsheet .ch-as,html.kbd .chatsheet .ch-push,
html.kbd .chatsheet .ch-pushnote,html.kbd .chatsheet .ch-plate,html.kbd .chatsheet .ch-rx,html.kbd .chatsheet .ch-hb{display:none}
html.kbd .chatsheet .ps-body{padding-top:8px}
html.kbd .chatsheet .ch-post{margin-top:0}
html.kbd .chatsheet .ch-feed{gap:7px;margin-top:8px}
html.kbd .chatsheet .ch-bub{padding:6px 11px 7px}

/* guests and PINs */
.gtag{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;line-height:1.5;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
  background:#F3E6CF;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px;font-family:inherit}
.whomodal .who-guest{display:grid;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.who-gn{margin:0;font-size:14px;color:var(--turf)}
.who-gr{display:flex;gap:8px;align-items:center}
.who-gr input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--page);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:10px;padding:10px 12px;min-height:46px}
.who-gr input:focus{outline:2px solid var(--ink);outline-offset:0}
.who-pin{display:grid;gap:5px;font-size:14px;font-weight:600;margin-top:10px}
.who-pin input{font:inherit;font-size:26px;letter-spacing:.4em;text-align:center;color:var(--ink);background:var(--page);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:12px;padding:10px;min-height:56px;max-width:220px}
.who-pin input:focus{outline:2px solid var(--ink);outline-offset:0}
.mg-row.mg-who{border-left:4px solid var(--gold-up);margin-bottom:8px}
.pinlist{display:grid;gap:0;background:var(--page);border-radius:12px;box-shadow:0 0 0 .5px var(--shadow);margin-top:10px;max-width:560px}
.pinrow{display:grid;grid-template-columns:1fr auto 90px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--hair);font-size:15px}
.pinrow:first-child{border-top:0}
.pinrow .pv{font-size:17px;letter-spacing:.12em;text-align:right}
.pinrow .pv i{font-size:13px;letter-spacing:0;color:var(--turf);font-weight:400}
.pinrow span.pv{font-size:13px;letter-spacing:0;color:var(--turf)}
.pinrow.gone .pn{color:var(--turf);text-decoration:line-through}
.pinrow .rm{justify-self:end}
.pinh{margin:20px 0 0;font-size:18px}
.pinh span{font-size:13px;color:var(--turf);font-weight:400;margin-left:6px}
/* the name box must not hold the window open wider than the phone */
.modal.whomodal{grid-template-columns:minmax(0,1fr)}
.whomodal > *,.who-guest,.who-gr{min-width:0}
.who-gr input{width:100%}

/* ---- betting on people ---- */
.xm-about{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:2px}
.xm-about::-webkit-scrollbar{display:none}
.xm-about .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--turf);font-weight:700;flex:0 0 auto;margin-right:2px}
.xm-about button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--page);
  box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);min-height:36px;cursor:pointer;text-align:center}
.xm-about button.on{background:#E2C277;box-shadow:none}
.xm-tags{display:flex;gap:6px;flex-wrap:wrap}
.xm-tag{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px 3px 8px;background:#F3E6CF;color:var(--gold)}
.xm-tag::before{content:"@";opacity:.6;margin-right:1px}
.xm-mo.any span{font-style:italic}
.xm-mo.hit{background:#F3E6CF;margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px;border-radius:8px}
.xm-mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#F2DDD6;color:var(--flag);font-size:13px;margin-right:7px;vertical-align:2px}
.xm-pick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.xm-pick::-webkit-scrollbar{display:none}
.xm-pick button{flex:0 0 auto;display:grid;gap:1px;text-align:center;font:inherit;border:0;border-radius:12px;padding:7px 12px;min-width:78px;
  background:var(--page);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);cursor:pointer}
.xm-pick button b{font-size:14.5px}
.xm-pick button small{font-size:12.5px;font-weight:700;color:var(--turf)}
.xm-pick button.on{background:var(--pine);color:var(--onpine);box-shadow:none}
.xm-pick button.on small{color:#E2C277}
.xm-pick button.done.yes small{color:#2F7A4A} .xm-pick button.done.no small{color:var(--flag)}
.xm-ppl{display:flex;flex-wrap:wrap;gap:6px}
.xm-ppl button{font:inherit;font-size:14px;border:0;border-radius:999px;padding:6px 12px;background:var(--page);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);min-height:36px;cursor:pointer}
.xm-ppl button.on{background:var(--pine);color:var(--onpine);box-shadow:none}
.xm-ppl button.on::before{content:"✓ ";color:#E2C277}
/* room under a bet for the chat bubble, so it never sits on the Bet button */
.xm-page{padding-bottom:96px}
.who-ref{margin:14px 0 0;font-size:14px;color:var(--turf);text-align:center}
.who-ref button{background:none;border:0;font:inherit;font-weight:700;color:var(--green);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px}
/* who's who: a tag for each kind of person */
.gtag.t-player{background:var(--pine);color:#E2C277}
.gtag.t-ref{background:#F2DDD6;color:var(--flag)}
.gtag.t-gallery{background:#DDEBDD;color:#2F7A4A}
.gtag.t-bleach{background:#E4E1F0;color:#4B3F7A}

/* ---- @ someone in the chat ---- */
.ch-atb{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--page);color:var(--gold);
  font:inherit;font-size:19px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.ch-at{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.ch-at[hidden]{display:none}
.ch-at button{font:inherit;font-size:14.5px;font-weight:600;border:0;border-radius:999px;padding:8px 13px;min-height:38px;
  background:var(--pine);color:var(--onpine);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ch-atn{color:var(--gold);font-weight:700}
.ch-atn.me{background:#E2C277;color:var(--ink);border-radius:6px;padding:0 4px}
.ch-msg.ment .ch-bub{box-shadow:inset 3px 0 0 #E2C277,0 0 0 1px rgba(201,162,83,.45);background:color-mix(in srgb,#E2C277 20%,var(--page))}
/* a post still on this phone, and the line under the box when there is no signal to send it */
.ch-n .ch-wait{color:#8C6B2F;font-weight:600}
.ch-off{margin:2px 0 0;font-size:12.5px;line-height:1.4;color:#8C6B2F}
.ch-callout{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8C6B2F;margin:2px 0 1px}

/* ---- Bets in tabs: the week, each round, off the course, ours ---- */
.xm-tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 0;
  padding:8px 0 9px;background:var(--paper);border-bottom:1px solid var(--rule);box-shadow:0 8px 14px -12px rgba(16,22,17,.35)}
.xm-tabs::-webkit-scrollbar{display:none}
.xm-tabs button{flex:0 0 auto;display:grid;justify-items:center;gap:1px;border:0;border-radius:12px;padding:6px 12px 7px;min-width:74px;min-height:46px;
  background:var(--page);box-shadow:inset 0 0 0 1px var(--rule);font:inherit;color:var(--ink);cursor:pointer}
.xm-tabs button b{font-size:14.5px;line-height:1.1;white-space:nowrap}
.xm-tabs button small{font-size:10.5px;color:var(--turf);font-weight:600;white-space:nowrap}
.xm-tabs button.on{background:var(--pine);color:var(--onpine);box-shadow:inset 0 -3px 0 #C9A253}
.xm-tabs button.on small{color:#E2C277}
.xm-tabs .live,.xm-plate .lv{color:#E25A44!important;font-weight:800}
.xm-tabs .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#E25A44;margin-right:4px;vertical-align:1px}
/* tucked a little under the strip, with paper above it, so no card shows between the two */
@media (max-width:699px){ html.up .xm-tabs{top:calc(46px + env(safe-area-inset-top,0px));box-shadow:0 -10px 0 var(--paper),0 8px 14px -12px rgba(16,22,17,.35)} }
.xm-plate{margin-top:12px;background:var(--pine);color:var(--onpine);border-radius:14px;padding:12px 14px;border-bottom:3px solid #C9A253;display:grid;gap:3px}
.xm-plate .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#E2C277;font-weight:800}
.xm-plate b{font-size:20px;line-height:1.15}
.xm-plate span{font-size:12.5px;color:#C9D2C3}
.xm-clear{font:inherit;font-size:12.5px;font-weight:700;color:#E2C277;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.xm-subh{margin:18px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800;border-bottom:1px solid var(--rule);padding-bottom:5px}

/* ---- your shuttle, on Today; the plan, on Roster ---- */
.shuttle{position:relative;margin:14px 0 0;background:var(--page);border-radius:16px;box-shadow:0 0 0 .5px var(--shadow),0 10px 22px -16px rgba(16,22,17,.5);overflow:hidden}
.sh-stub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.sh-ic{width:42px;height:42px;border-radius:12px;background:var(--pine);color:#E2C277;display:grid;place-items:center;font-size:20px}
.sh-rt{display:grid;gap:1px;min-width:0}
.sh-rt small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-rt b{font-size:18px;line-height:1.15;white-space:nowrap}
.sh-rt b span{font-size:13px;color:var(--turf);margin:0 2px}
.sh-rt i{font-style:normal;font-size:13.5px;color:var(--turf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-tm{display:grid;text-align:right}
.sh-tm b{font-size:23px;line-height:1}
.sh-tm small{font-size:11px;color:var(--turf);font-weight:700}
.sh-perf{position:relative;height:0;border-top:2px dashed var(--rule);margin:0 14px}
.sh-perf::before,.sh-perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.sh-perf::before{left:-24px} .sh-perf::after{right:-24px}
.sh-body{display:grid;gap:4px;padding:12px 16px 12px;animation:fadeIn .25s ease both}
.sh-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:8px 14px 9px;background:var(--sunk,#DBD2BA);border:0;
  font:inherit;font-size:13px;font-weight:700;color:var(--turf);cursor:pointer;min-height:44px}
.sh-who{display:flex;align-items:center}
.sh-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--pine);color:#E2C277;
  box-shadow:0 0 0 2px var(--sunk,#DBD2BA);margin-left:-5px}
.sh-av:first-child{margin-left:0}
.sh-av:nth-child(2){background:#3E5C43} .sh-av:nth-child(3){background:#6B5530} .sh-av:nth-child(4){background:#2A3D2E}
.sh-av.more{background:var(--page);color:var(--ink)}
.sh-chev{display:inline-block;transition:transform .25s ease}
.shuttle.open .sh-chev{transform:rotate(180deg)}
.sh-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.sh-t{font-size:20px;line-height:1.2}
.sh-m,.sh-you{font-size:15px;color:var(--turf)}
.sh-you{color:var(--ink)}
.sh-w{font-size:14px;font-weight:700;color:#8C6B2F;background:#F3E6CF;border-radius:8px;padding:5px 9px;justify-self:start}
.sh-l{margin-top:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--turf);font-weight:700}
.sh-fs{display:grid}
.sh-f{padding:8px 0;border-top:1px solid var(--hair);display:grid;gap:2px}
.sh-f:first-child{border-top:0}
.sh-f.me{background:color-mix(in srgb,#E2C277 16%,transparent);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.sh-fh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sh-fh b{font-size:15.5px}
.sh-fh span{font-size:14px;color:var(--turf)}
.sh-fh em{font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;background:#F3E6CF;color:#8C6B2F}
.sh-fn{font-size:15px;line-height:1.4}
.sh-fn i{font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--pine);color:#E2C277;vertical-align:1px}
.sh-rs{display:grid}
.sh-r{display:grid;grid-template-columns:minmax(0,1fr) auto 72px;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--hair);font-size:15px}
.sh-r:first-child{border-top:0}
.sh-r span:first-child{font-weight:600}
.sh-r span.num{font-size:13px;color:var(--turf)}
.sh-r b{text-align:right}
.sh-r i,.sh-r em{font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;margin-left:4px;vertical-align:1px}
.sh-r i{background:var(--pine);color:#E2C277}
.sh-r em{background:#F3E6CF;color:#8C6B2F}
.sh-r.me{background:color-mix(in srgb,#E2C277 16%,transparent);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.trv-in{display:block;width:100%;margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;
  background:var(--page);color:var(--ink);border:1px solid var(--rule);border-radius:12px;padding:12px;resize:vertical}
.trv-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.trv-acts .btn{border-radius:999px}
.trv-chk{margin-top:8px}
.trv-warn{margin:6px 0 0;font-size:14px;color:#8C6B2F}
.trv-ok{margin:12px 0 6px;font-weight:700;color:#2F7A4A}
.trv-sh{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--hair);font-size:14px}
.trv-sh span{color:var(--turf)}

/* ---- replies ---- */
.ch-acts{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.ch-acts .ch-rx{flex:1;min-width:0}
.ch-rp{flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;color:var(--green);background:none;border:0;border-radius:999px;padding:6px 6px;min-height:36px;cursor:pointer;white-space:nowrap}
.ch-q{display:grid;gap:1px;width:100%;text-align:left;font:inherit;margin:5px 0 2px;padding:6px 10px;border:0;border-radius:8px;cursor:pointer;
  background:color-mix(in srgb,var(--ink) 6%,var(--paper));box-shadow:inset 3px 0 0 #C9A253;color:var(--ink)}
.ch-q b{font-size:12.5px;color:#8C6B2F}
.ch-q span{font-size:13.5px;color:var(--turf);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch-reply{background:color-mix(in srgb,#3E5C43 12%,var(--page));color:var(--green)}
.ch-msg.jumped .ch-bub{animation:jumped 1.6s ease}
@keyframes jumped{0%,35%{box-shadow:0 0 0 3px #E2C277,0 0 0 .5px var(--shadow)}100%{box-shadow:0 0 0 .5px var(--shadow)}}

/* ---- rulings: the button on the row, the sheet, the round's log ---- */
.rl-btn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font:inherit;font-size:12.5px;font-weight:700;color:#8C6B2F;background:#F3E6CF;
  border:0;box-shadow:inset 0 0 0 1px #C9A253;border-radius:999px;padding:5px 11px;min-height:32px;cursor:pointer;white-space:nowrap}
.rlsheet .rl-body{display:grid;gap:10px}
.rl-chips{display:flex;gap:6px;flex-wrap:wrap}
.rl-chips button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:7px 11px;min-height:36px;background:var(--page);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);cursor:pointer;white-space:nowrap}
.rl-chips button.on{background:var(--pine);color:#E2C277;box-shadow:none}
.rl-q{display:flex;gap:8px;align-items:flex-end;background:var(--page);border-radius:14px;padding:8px 8px 8px 12px;box-shadow:inset 0 0 0 1px var(--rule)}
.rl-q textarea{flex:1;min-width:0;width:0;border:0;background:none;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);resize:none;outline:none;padding:4px 0}
.rl-q .btn{border-radius:999px;flex:0 0 auto}
.rl-ans{background:var(--page);border-radius:14px;box-shadow:0 0 0 .5px var(--shadow);overflow:hidden}
.rl-ah{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--pine);color:var(--onpine)}
.rl-ic{width:32px;height:32px;border-radius:50%;background:#E2C277;color:var(--ink);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.rl-ah b{display:block;font-size:15px;line-height:1.2}
.rl-ah small{font-size:11.5px;color:#9FB3A3}
.rl-ab{padding:10px 12px 12px;display:grid;gap:8px;font-size:15px;line-height:1.45}
.rl-ab p{margin:0;white-space:pre-wrap}
.rl-v{font-size:16.5px;font-weight:700}
.rl-v em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:2px 8px;background:#F2DDD6;color:var(--flag);margin-left:6px;vertical-align:2px;white-space:nowrap}
.rl-ab ol{margin:0;padding-left:20px;display:grid;gap:3px}
.rl-house{background:#F3E6CF;border-radius:10px;padding:8px 10px;font-size:14.5px}
.rl-house b{color:#8C6B2F}
.rl-card{background:color-mix(in srgb,#3E5C43 10%,var(--page));border-radius:10px;padding:8px 10px;font-size:14.5px}
.rl-fine{font-size:12px;color:var(--turf)}
.rl-think{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--turf);padding:12px}
.rl-think i{width:8px;height:8px;border-radius:50%;background:#C9A253;animation:rlbob 1s infinite}
.rl-think i:nth-child(2){animation-delay:.15s} .rl-think i:nth-child(3){animation-delay:.3s}
@keyframes rlbob{50%{transform:translateY(-4px);opacity:.4}}
.rl-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rl-acts .btn{border-radius:999px}
.rl-saved{font-size:12.5px;font-weight:700;color:#2F7A4A}
.rl-lh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800;display:flex;gap:8px;align-items:center}
.rl-lh span{background:var(--pine);color:#E2C277;border-radius:999px;padding:1px 7px;letter-spacing:0}
.rl-prev{font-size:14px;color:var(--turf);padding:6px 0;border-top:1px solid var(--hair)}
.rl-prev b{color:var(--ink)}
.rl-ok{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:#DDEBDD;color:#2F7A4A;justify-self:start;white-space:nowrap}
.rl-ok.wait{background:#F3E6CF;color:#8C6B2F}
.rl-log{margin-top:18px;display:grid;gap:8px}
.rl-item{background:var(--page);border-radius:12px;box-shadow:0 0 0 .5px var(--shadow);overflow:hidden}
.rl-row{display:grid;gap:3px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;padding:10px 12px;cursor:pointer}
.rl-row b{font-size:15px;line-height:1.3}
.rl-t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--turf)}
.rl-more{padding:0 12px 12px;display:grid;gap:8px}
.rl-asked{margin:0;font-size:14px;color:var(--turf);font-style:italic}

/* ---- pin & drive, from another hole ---- */
.pinline{display:flex;align-items:center;gap:10px;background:var(--page);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 .5px var(--shadow);margin:6px 0}
.pl-ic{font-size:20px;flex:0 0 auto}
.pl-w{flex:1;min-width:0;display:grid;gap:1px}
.pl-w b{font-size:15.5px}
.pl-w small{font-size:13px;color:var(--turf)}
.pl-go{flex:0 0 auto;font:inherit;font-size:13.5px;font-weight:700;border:0;border-radius:999px;padding:8px 13px;min-height:40px;background:var(--pine);color:#E2C277;cursor:pointer;white-space:nowrap}

/* ---- moving people between groups, one round at a time ---- */
.gmove{margin-top:10px;background:var(--page);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 .5px var(--shadow)}
.gm-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--turf)}
.gm-own{font-weight:700;color:#8C6B2F}
.gm-list{display:grid;margin-top:6px}
.gm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--hair)}
.gm-n{font-weight:600;white-space:nowrap}
.gm-b{display:flex;gap:6px}
.gm-b button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;min-width:40px;min-height:40px;padding:0 8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);cursor:pointer}
.gm-b button.on{background:var(--pine);color:#E2C277;box-shadow:none}
.gm-b button.out{font-size:13px}
.gm-b button.out.on{background:var(--flag);color:#fff}

/* ---- raw beside net ---- */
.rawv{display:block;font-size:11.5px;font-weight:600;color:var(--turf);line-height:1.2;letter-spacing:0;white-space:nowrap}
.rawh{display:block;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--turf);opacity:.85;white-space:nowrap}
.tn-h .rawh{display:inline;margin-left:6px}

/* ---- the recap, made for a phone ----
   The front is the round's photos, sliding by under the headline; three
   tiles that say their number whole; a sentence of status, not a shout; and
   the tables with raw beside net. */
.rh-track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
  overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.rh-track::-webkit-scrollbar{display:none}
.rh-slide{flex:0 0 100%;height:100%;margin:0;scroll-snap-align:start;scroll-snap-stop:always}
.rh-slide img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.rhero::after{pointer-events:none;z-index:1}
.rh-in{pointer-events:none}
.rh-count{position:absolute;top:12px;right:12px;z-index:2;font-size:12px;color:#fff;background:rgba(16,22,17,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:4px 10px;pointer-events:none;white-space:nowrap}
.rh-dots{position:absolute;left:0;right:0;bottom:8px;z-index:2;display:flex;justify-content:center;gap:5px;pointer-events:none}
.rh-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:width .25s,background .25s}
.rh-dots i.on{width:18px;border-radius:3px;background:#E2C277}
.rh-in{bottom:26px}
.rtile{display:grid;align-content:start;gap:3px;padding:11px 12px 12px}
.rtile .rt-l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-up);font-weight:700;white-space:normal;overflow:visible;margin:0}
.rtile b{font-size:26px}
.rtile b small{font-size:12px;font-weight:600;letter-spacing:0;margin-left:4px;color:var(--sage-up)}
.rtile em{font-style:normal;font-size:12.5px;color:#E2C277;opacity:.85}
.rtile .rt-n{font-size:13px;letter-spacing:0;text-transform:none;color:var(--onpine);font-weight:600;white-space:normal;overflow:visible;line-height:1.25;margin:0}
.recapbar{font-size:13.5px;letter-spacing:0;text-transform:none;font-weight:500;line-height:1.4}
.recapbar .rb-s{flex:1 1 220px}
.metarail{font-size:12.5px;letter-spacing:0;text-transform:none}
.metarail span:first-child{font-weight:700}
.rinline{margin:18px 0;break-inside:avoid}
.rinline img{width:100%;max-height:420px;object-fit:cover;border-radius:14px;display:block;box-shadow:0 0 0 .5px var(--shadow)}
.rinline figcaption{margin-top:6px;font-size:13px;color:var(--turf)}
.rectable .rowhead .rawh{display:block}
.rectable .rt-n .rawv,.rectable .rt-t .rawv{display:block}
.recfield .rt-c{flex:0 0 64px;text-align:center}
.recfield .rt-who small{display:block;font-size:12px;color:var(--turf);font-weight:500}
@media (max-width:700px){
  .recaptop{margin:0 -15px;padding:11px 15px 9px}
  .recaptop b{font-size:16px;letter-spacing:.06em}
  .recaptop .rm{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px}
  .rhero{margin:0 -15px;height:min(78vw,380px)}
  .rh-in{left:15px;right:15px}
  .rhero .rechead{font-size:30px;max-width:none}
  .rtiles{gap:8px}
  .rtile{padding:10px 10px 11px}
  .rtile b{font-size:23px}
  .recfield .rt-c{flex-basis:50px;font-size:15px}
  .metarail{font-size:12px;line-height:1.7}
  .metarail span{padding:0 10px}
}
.metaline{margin:14px 0 0;padding:9px 0 8px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-size:13px;color:var(--turf);line-height:1.5}
.metaline b{color:var(--ink)}

/* ---- a handicap of their own, beside the quick picks ---- */
.bandown{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding-left:10px;border-left:1px solid var(--rule)}
.bstep{width:30px;height:34px;border-radius:9px;border:0;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;padding:0}
.bstep:disabled{opacity:.4;cursor:default}
.bandcrest.own{opacity:.75}
.bandcrest.own .bn{letter-spacing:-.02em}
.bandown.on .bandcrest{opacity:1}

/* ---- a name on a board opens the card ---- */
.namebtn{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.namebtn::after{content:" ›";color:var(--turf);font-weight:400;opacity:.7}
.namebtn:active{opacity:.6}
.cardsheet{max-width:600px;overflow-x:hidden}
.cardsheet.two{max-width:720px}
.cs-body{display:grid;gap:12px;padding-bottom:4px}
.cs-rounds{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cs-rounds::-webkit-scrollbar{display:none}
.cs-rounds button{flex:0 0 auto;font:inherit;font-size:13.5px;font-weight:700;border:0;border-radius:999px;padding:7px 13px;min-height:36px;background:var(--page);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);cursor:pointer}
.cs-rounds button.on{background:var(--pine);color:#E2C277;box-shadow:none}
.cs-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cs-tile{background:var(--pine);color:var(--onpine);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.cs-tile span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9FB3A3;font-weight:700}
.cs-tile b{font-size:26px;line-height:1;color:#E2C277}
.cs-tile small{font-size:12.5px;color:#C9D2C3}
.sc-card{display:grid;gap:10px}
.sc-nine{display:grid;background:var(--page);border-radius:12px;box-shadow:0 0 0 .5px var(--shadow);overflow:hidden}
.sc-r{display:grid;grid-template-columns:44px repeat(9,minmax(0,1fr)) 40px;align-items:center;gap:1px;padding:0 6px;min-height:26px;border-top:1px solid var(--hair);font-size:13px}
.sc-r:first-child{border-top:0}
.sc-r > span{text-align:center;min-width:0}
.sc-l{text-align:left!important;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--turf);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-t{font-weight:800;border-left:1px solid var(--rule);min-height:26px;display:inline-grid;place-items:center}
.sc-hole{background:var(--pine);color:var(--onpine)} .sc-hole .sc-l,.sc-hole .sc-t{color:#E2C277} .sc-hole .sc-t{border-left-color:rgba(255,255,255,.2)}
.sc-par{font-weight:700} .sc-si,.sc-yds{color:var(--turf);font-size:11.5px} .sc-yds{font-size:10.5px}
.sc-gross{min-height:38px;background:color-mix(in srgb,var(--paper) 50%,var(--page))}
.sc-gross .sc-l{color:var(--ink)}
.sc-net{color:var(--turf);font-size:12.5px;border-top:0}
.sc-net .sc-t{font-weight:700;color:var(--turf)}
.sc-c{position:relative;display:inline-grid;place-items:center;height:32px}
.sc-c b{display:inline-grid;place-items:center;width:24px;height:24px;font-size:14.5px;font-weight:700;border-radius:3px;box-sizing:border-box}
.sc-c.g1 b{border:1.6px solid #2F7A4A;border-radius:50%}
.sc-c.g2 b{border:1.6px solid #8C6B2F;border-radius:50%;box-shadow:0 0 0 2px var(--page),0 0 0 3.4px #8C6B2F;color:#8C6B2F}
.sc-c.b1 b{border:1.6px solid var(--flag)}
.sc-c.b2 b{border:1.6px solid var(--flag);box-shadow:0 0 0 2px var(--page),0 0 0 3.4px var(--flag)}
.sc-c.capped b{text-decoration:underline dotted}
.sc-dots{position:absolute;top:1px;left:2px;font-style:normal;font-size:9px;line-height:1;letter-spacing:-1px;color:var(--turf)}
.sc-c i{position:absolute;bottom:0;right:1px;font-style:normal;font-size:8.5px;font-weight:800;color:#2F5D7A;line-height:1}
.sc-nc b{width:auto;height:auto;font-weight:600;font-size:12.5px;color:var(--turf)}
.sc-best{background:#DDEBDD;color:#2F7A4A} .sc-best .sc-l{color:#2F7A4A}
.sc-bc b{width:auto;height:auto;font-weight:800;font-size:13.5px;color:#2F7A4A}
/* the team game's points, a row under each golfer's net: three or more is a good hole, one or none a lost one */
.sc-pts{background:#F3EFE4}
.sc-pc b{width:auto;height:auto;font-weight:700;font-size:12.5px;color:var(--turf)}
.sc-pc.up b{color:#2F7A4A} .sc-pc.dn b{color:#A33A2A}
.sc-tv.team b{color:#2F7A4A}
.sc-tot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 10px;background:var(--pine);color:var(--onpine);border-radius:12px;border:0}
.sc-tot .sc-l{color:#E2C277;flex:0 0 auto}
.sc-tv{display:grid;text-align:left!important}
.sc-tv b{font-size:18px;line-height:1.1} .sc-tv small{font-size:11.5px;color:#C9D2C3}
.sc-k{display:inline-grid;place-items:center;width:20px;height:20px;font-size:11.5px;font-weight:700;border-radius:3px;margin:0 2px 0 4px;vertical-align:-5px;box-sizing:border-box}
.sc-k.g1{border:1.4px solid #2F7A4A;border-radius:50%} .sc-k.g2{border:1.4px solid #8C6B2F;border-radius:50%;box-shadow:0 0 0 1.5px var(--paper),0 0 0 2.6px #8C6B2F;color:#8C6B2F}
.sc-k.b1{border:1.4px solid var(--flag)} .sc-k.b2{border:1.4px solid var(--flag);box-shadow:0 0 0 1.5px var(--paper),0 0 0 2.6px var(--flag)}
.cs-key{margin:0;font-size:12.5px;color:var(--turf);line-height:1.7}
@media (max-width:420px){ .sc-r{grid-template-columns:36px repeat(9,minmax(0,1fr)) 34px;padding:0 4px;font-size:12px} .sc-c b{width:22px;height:22px;font-size:13.5px} .sc-l{font-size:9.5px} .sc-yds{display:none} }
