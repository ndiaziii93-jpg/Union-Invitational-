<style>
/* The Union Invitational — yardage book.
   Palette taken from the crest: cover stock, pine printing ink, the red flag.

   There is one palette, and it is the printed book. There was a night
   version too, picked up from whatever the phone happened to be set to, and
   it is gone: a yardage book is a printed thing and it should look the same
   in everybody's hand. `color-scheme: light` is the other half of saying so
   — without it the phone still draws its OWN parts dark, so the menus, the
   text fields, the scrollbars and the keyboard come up in night colours on
   top of a cream page. */

:root {
  color-scheme: light;
  --paper:#E3DBCB; --page:#EEE8D5; --sunk:#DBD2BA;
  --ink:#1D2E21;   --turf:#5C6B55;  --green:#3E5C43;
  --rule:#C4B896;  --hair:#DCD1B4;
  --flag:#9E3B2E;  --gold:#8C6B2F;
  --under:#B4892B; --over:#9E3B2E; --level:#1D2E21;
  /* The gold on a cream page goes muddy on the ink, so the bar has its own:
     light enough to read at eleven pixels against the dark. And a sage for
     the tabs that are not live, which must be legible without competing. */
  --gold-up:#C9A253; --sage-up:#9FB3A3;
  --uk:#1D3E8F;    --usa:#9E3B2E;
  /* a hole still to score sits heavier than the paper; a hole already in
     recedes towards it. The point is to find the gaps at a glance. */
  --hole-todo:#CDBF9E; --hole-done:#F4EFE2;
  --overtint:#EFDCD7; --leadtint:#E4ECE2;
  --shadow:rgba(29,46,33,.16);
  /* the pine: every dark surface the book draws, and the cream written on it */
  --pine:#1D2E21;  --onpine:#EEE8D5;
  --serif:'Source Serif 4','Iowan Old Style',Georgia,'Times New Roman',serif;
  --mono:var(--serif);
}

/* ---- NIGHT, AND LOW POWER ----
   The moon in the masthead turns the page to a pine night: every colour the
   book uses is a token above, so the page, its rules and its ink swap here,
   and the pine surfaces go a shade darker still so they stay surfaces. Low
   power is night with the pictures dimmed and nothing moving. */
html.night{color-scheme:dark;
  --paper:#121A14; --page:#1A2420; --sunk:#0E1511;
  --ink:#ECE5D4;   --turf:#A7B5A2;  --green:#A9CBAE;
  --rule:#3B4C3E;  --hair:#2A3A2E;
  --flag:#E39385;  --gold:#D9B45C;
  --under:#D9B45C; --over:#E39385; --level:#ECE5D4;
  --uk:#8FAAE8;    --usa:#E39385;
  --hole-todo:#2B3B2E; --hole-done:#233026;
  --overtint:#3B2B28; --leadtint:#25382B;
  --shadow:rgba(0,0,0,.55);
  --pine:#0B110D;  --onpine:#ECE5D4;}
html.night body{background:var(--paper)}
html.night .crestbtn img,html.night .ts-c{filter:invert(1) brightness(1.3)}
html.night .wrap.cover .crestbtn img{filter:invert(1) brightness(1.3)}
html.low img,html.low canvas,html.low .h3sky{filter:grayscale(1) brightness(.45)}
html.low .crestbtn img,html.low .ts-c{filter:invert(1) brightness(1.1)}
html.low *,html.low *::before,html.low *::after{animation:none!important;transition:none!important}
/* the moon: day, night, or low power with a gold dot */
.moonbtn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--rule);background:var(--page);color:var(--turf);
  display:grid;place-items:center;padding:0;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.moonbtn svg{width:20px;height:20px;display:block}
.moonbtn .dot{display:none;position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--gold-up);border:2px solid var(--paper)}
html.night .moonbtn{border-color:#C9A253;color:#E2C277;background:#0B110D}
html.low .moonbtn .dot{display:block}
.wrap.cover .moonbtn{background:rgba(11,17,13,.55);border-color:rgba(226,194,119,.7);color:#E2C277}
.moonbtn.ts-m{width:32px;height:32px;margin-left:9px;background:none;border-color:var(--sage-up);color:var(--onpine)}
.moonbtn.ts-m svg{width:16px;height:16px}
html.night .moonbtn.ts-m{border-color:#C9A253;color:#E2C277}
.lowline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:7px 12px;border-radius:10px;
  background:#2B3B2E;color:#E9E2D2;border-left:4px solid #C9A253;font-size:13.5px}
.lowline button{background:none;border:0;font:inherit;font-weight:700;color:#E2C277;padding:4px 2px;white-space:nowrap;cursor:pointer}
.phq .sendnow{background:none;border:0;font:inherit;font-weight:700;color:var(--gold);text-decoration:underline;text-underline-offset:3px;padding:0 2px;cursor:pointer}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5}
/* A PAGE GOES UP AND DOWN. Only the strips that hold more than fits — chip
   rows, the board tabs, the photos across a recap — move sideways, and they
   say so themselves. Nothing else may be wider than the phone (the root is
   clipped sideways, the body without becoming a scroller of its own), and
   nothing zooms: a quick double tap on a score, or two thumbs on the glass,
   used to zoom the whole page, which is what left the bar floating in the
   middle of the screen and the page sliding left and right. The site plan
   and the hole still pinch, with their own handlers. */
html{overflow-x:hidden}
body{overflow-x:clip;touch-action:pan-x pan-y}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:inherit}
a{color:var(--green);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.eyebrow{font-size:15px;color:var(--turf)}
.nos{scrollbar-width:none;-ms-overflow-style:none}
.nos::-webkit-scrollbar{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,26px) 40px;position:relative;z-index:1}

/* ---- a screen arriving ----
   A tap used to swap one screen for another between two frames, with nothing
   in between — which on a phone, under a fixed bar, reads as the page having
   been there all along and the bar having been laid over it. A fifth of a
   second of rise and resolve is enough to say a page was turned. It is on
   the body of the screen only: the nameplate and the bar are the furniture
   the pages are turned inside, and furniture that moves is a glitch. */
.page{display:block}
@keyframes pageTurn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page[data-turn]{animation:pageTurn 200ms cubic-bezier(.22,.61,.36,1) both}
@media (prefers-reduced-motion:reduce){.page[data-turn]{animation:none}}

/* ---- watermark & masthead ---- */
/* The crest behind every page — and, for the first two seconds of it, in
   front of the page instead. This is the resting state, which is also where
   the opening below ends.

   The movement is a TRANSFORM, not a change of background-size. Animating
   background-size repaints the image on every frame and is where the
   choppiness came from; a transform is handed to the compositor and simply
   runs. */
.watermark{position:fixed;inset:0;pointer-events:none;z-index:0;background-repeat:no-repeat;
  background-position:center 58%;background-size:min(52vh,86vw,470px);
  opacity:.045;
  transform:none;transform-origin:center 58%}
/* BATTERY. `will-change` here kept a full-screen compositor layer alive for
   the whole week, recomposited on every scroll. It is wanted for the few
   seconds of the opening and never after. */
.watermark.opening{will-change:transform,opacity}
/* The crest art carries its own transparency, so it needs no blend mode to
   sit on the paper. It used to multiply, which is very nearly invisible at
   four and a half percent and a needless second opinion about the colour at
   full strength — the crest should simply be the colours it is. */

/* THE OPENING.
   The crest is put up by src/opening.js the moment the page has its own
   data, which is well before the book itself exists — so this cannot be a
   transition, because there is nothing to transition FROM. It is an
   animation, and the animation starts the instant the element is created.
   That is what makes the opening the same length every time: it is timed
   from the first paint, not from how the loading happened to go.

   It does not fade in. The first frame is the whole crest at full strength;
   a pale crest was only ever an animation caught half way up.

   Two animations rather than one, because the way out is two movements with
   different minds: the crest eases OPEN over 1.6s and dissolves over 1.5s,
   and they should not have to share an easing curve to do it. Both hold
   first — 1800ms, which is 52.9% of 3400 and 54.5% of 3300.

   The resting style above is where both animations end, so when the class is
   taken off at the finish nothing moves.

   The 86vw in the resting size is what allows the leading scale to be .8 —
   the travel that makes this read as a zoom rather than a dissolve. Left at
   min(52vh,470px) the mark is WIDER than a phone, and the wordmark ran off
   both edges for most of the journey. Four fifths of 86vw is 69vw, and every
   moment after it is wider still and fainter. */
.watermark.opening{z-index:60;
  animation:crestZoom 3400ms cubic-bezier(.22,.61,.24,1) both,
            crestFade 3300ms cubic-bezier(.45,0,.55,1) both}
@keyframes crestZoom{0%,52.9%{transform:scale(.8) translateY(-2%)}100%{transform:none}}
@keyframes crestFade{0%,54.5%{opacity:1}100%{opacity:.045}}

.masthead{display:flex;align-items:center;gap:14px;padding:16px 0 10px;flex-wrap:wrap}
.masthead img{width:62px;height:auto;flex:0 0 auto}
.masthead h1{font-size:clamp(21px,3.4vw,29px);font-weight:700;line-height:1.02;margin:0;letter-spacing:-.01em}
.masthead .sub{font-size:14px;font-style:italic;color:var(--turf);margin-top:1px}
.mast-mid{flex:1 1 220px;min-width:0}
.mast-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.mast-right .lbl{font-size:15px;color:var(--turf)}
.mast-right .val{font-size:18px;font-weight:700}
.rule-heavy{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);height:3px}

/* ---- index tabs ---- */
.tabs{display:flex;gap:6px;align-items:flex-end;border-bottom:2px solid var(--ink);padding:10px 2px 0}
.tab{padding:11px 21px;font-size:17px;color:var(--turf);background:var(--page);border:1px solid var(--rule);
  border-bottom:none;white-space:nowrap;min-height:44px;border-radius:9px 9px 0 0}
@media (hover:hover) and (pointer:fine) { .tab:hover{color:var(--ink);background:var(--sunk)} }
.tab[aria-current="page"]{background:var(--pine);border-color:var(--pine);color:var(--onpine);font-weight:700}

/* Nine of the tabs name a job. One names a place, and typography has always
   set a name apart from a label — so this is a fact about the word before it
   is a decoration. Tracked capitals, which is the register the hotel's own
   display face works in, and the gold this tab already uses for anything
   that costs money. Set with uppercase rather than small caps: the book
   carries a subset of its serif that has no true small capitals in it, and a
   browser asked to fake them does not fake them the same way twice. */
.tab.named{letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  font-size:13.5px;color:var(--gold)}
/* On the ink the gold goes muddy, so the selected state keeps the paper and
   lets the letterforms do the distinguishing. */
.tab.named[aria-current="page"]{color:var(--onpine)}
@media (hover:hover) and (pointer:fine) { .tab.named:hover{color:var(--ink)} }

/* ---- generic blocks ---- */
.lede{font-size:16px;color:var(--turf);margin:6px 0 0;max-width:64ch}
h2.head{font-size:clamp(25px,3.8vw,38px);font-weight:700;margin:20px 0 0;line-height:1.05;text-wrap:balance}
h3.sub{font-size:19px;font-weight:600;margin:26px 0 0}
.spread{display:grid;grid-template-columns:1fr;gap:0;margin-top:18px;border-top:2px solid var(--ink)}
@media (min-width:900px){.spread{grid-template-columns:minmax(300px,360px) 1fr}
  .leaf-l{border-right:1px solid var(--rule);padding:20px 26px 26px 0}
  .leaf-r{padding:20px 0 26px 26px}}
@media (max-width:899px){.leaf-l{padding:18px 0 22px}.leaf-r{padding:4px 0 22px;border-top:1px solid var(--rule)}}

.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 11px;border:1px solid var(--rule);background:var(--page);font-size:14px;min-height:36px;
  display:inline-flex;align-items:center;gap:6px;border-radius:2px;color:var(--turf)}
.chip[aria-pressed="true"],.chip.on{background:var(--pine);color:var(--onpine);border-color:var(--pine);font-weight:600}
.btn{min-height:44px;padding:10px 17px;border:1px solid var(--ink);background:var(--pine);color:var(--onpine);
  font-size:15px;font-weight:600;border-radius:2px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule)}
.btn.danger{background:var(--flag);border-color:var(--flag);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{min-height:44px;padding:8px 10px;border:1px solid var(--rule);background:var(--page);color:var(--ink);border-radius:2px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;
  letter-spacing:.02em;border:1px solid currentColor}
.pill.live{color:var(--flag);font-weight:600}
.pill.final{color:var(--turf)}
.pill.open{color:var(--under)}

/* ---- data rows ---- */
.rows{border-top:2px solid var(--ink)}
.rowhead{display:flex;align-items:baseline;gap:12px;padding:9px 0 6px;border-bottom:1px solid var(--rule)}
.rowhead span{font-size:14px;color:var(--turf)}
.row{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}
.row .pos{width:24px;color:var(--turf);font-size:15px}
.row .who{flex:1 1 140px;min-width:0;font-size:18px;font-weight:600}
.row .who small{display:block;font-size:13px;font-weight:400;color:var(--turf);font-family:var(--serif)}
.row .n{min-width:46px;text-align:right;font-size:17px}
.row .big{min-width:74px;text-align:right;font-size:23px;font-weight:700}
.under{color:var(--under)}.over{color:var(--over)}.level{color:var(--level)}
.empty{padding:26px 0;color:var(--turf);font-style:italic;max-width:56ch}

/* ---- hole leaf ---- */
.holeno{display:flex;align-items:baseline;gap:12px;margin-top:2px}
.holeno b{font-size:clamp(42px,8vw,64px);font-weight:700;line-height:.86}
.facts{border-collapse:collapse;width:100%;max-width:330px;margin-top:14px}
.facts td{border-bottom:1px solid var(--hair);padding:6px 0;font-size:15px}
.facts td:first-child{color:var(--turf)}
.facts td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.facts tr.cap td:last-child{color:var(--flag);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:18px;max-width:340px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;
  border:1px solid var(--rule);background:var(--page);color:var(--turf);border-radius:2px;min-height:34px}
.cell.played{color:var(--ink);font-weight:600}
.cell.u{background:var(--under);border-color:var(--under);color:#fff}
.cell.o{background:var(--over);border-color:var(--over);color:#fff}
.cell.e{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.cell.here{background:var(--pine);border-color:var(--pine);color:var(--onpine);font-weight:700}
.diagram{margin:18px 0 0;max-width:330px}
.diagram img{display:block;width:100%;height:auto}
.diagram figcaption{font-size:14px;color:var(--turf);font-style:italic;margin-top:6px}

/* ---- score entry ---- */
.rcards{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rcard{padding:11px 20px;border:1px solid var(--rule);background:var(--page);color:var(--ink);
  border-radius:2px;min-height:60px;text-align:left}
.rcard b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.rcard span{display:block;font-size:14px;font-weight:400;color:var(--turf);margin-top:1px}
.rcard.practice{border-style:dashed}
.rcard:hover{border-color:var(--pine)}
.rcard.on{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.rcard.on span{color:var(--rule)}
.note-it{font-size:17px;font-style:italic;color:var(--turf);margin:12px 0 0}
.note-red{font-size:17px;font-style:italic;color:var(--flag);margin:12px 0 0}

.grouprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.grouprow .gl{font-size:15px;color:var(--turf)}
.gchip{padding:9px 16px;border:1px solid var(--rule);background:var(--page);color:var(--ink);
  font-size:16px;border-radius:2px;min-height:44px}
.gchip:hover{border-color:var(--pine)}
.gchip.on{background:var(--pine);border-color:var(--pine);color:var(--onpine);font-weight:600}
.grouprow .gnote{font-size:14px;color:var(--turf)}

.hstrip{display:grid;grid-template-columns:repeat(18,minmax(46px,1fr));gap:2px;min-width:860px}
.hcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 2px;
  border:1px solid var(--rule);background:var(--hole-todo);color:var(--ink);border-radius:9px;min-height:52px}
.hcell .n{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.hcell .p{font-size:11px;color:var(--turf);font-variant-numeric:tabular-nums}
.hcell:hover{border-color:var(--pine)}
/* scored: pale, quiet, done with */
.hcell.saved{background:var(--hole-done);border-color:var(--hair)}
.hcell.saved .n{font-weight:400}
.hcell.on{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.hcell.on .p{color:var(--rule)}
.hcell.on .n{font-weight:700}

.holehead{display:flex;align-items:baseline;gap:22px;margin-top:16px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:8px}
.holehead h3{font-size:clamp(26px,4vw,34px);font-weight:900;margin:0;font-variant-numeric:tabular-nums}
.holehead span{font-size:17px;font-variant-numeric:tabular-nums}
.holehead .m{color:var(--turf)}
.holehead .r{color:var(--flag);font-size:16px}

.entrygrid{display:grid;grid-template-columns:1fr;gap:32px;margin-top:8px;align-items:start}
@media (min-width:1000px){.entrygrid{grid-template-columns:1fr 340px}}

.prow{padding:14px 0;border-bottom:1px solid var(--rule)}
.prow.pending{box-shadow:inset 3px 0 0 var(--flag);padding-left:12px}
.pmain{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pwho{flex:1 1 130px;min-width:120px}
.pwho .nm{font-size:19px;font-weight:600}
.pwho .tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;
  background:var(--flag);color:#FBFAF7;vertical-align:2px;font-weight:400}
.pwho .bd{font-size:14px;color:var(--turf);font-variant-numeric:tabular-nums}
.pwho .bd span{color:var(--green)}
/* THE TILE. The score is the only big thing on the row; everything else
   is a line of small type under the name. */
.prow.sel{background:var(--sunk);margin:0 -16px;padding-left:16px;padding-right:16px}
.ptile{width:64px;height:54px;flex:0 0 auto;margin-left:auto;border:1px solid var(--rule);border-radius:12px;
  background:var(--paper);display:grid;place-items:center;font-family:inherit;color:var(--ink);
  -webkit-tap-highlight-color:transparent;transition:border-color .15s ease,background .15s ease}
.ptile[aria-expanded="true"]{border:2px solid var(--ink);background:var(--page)}
.ptile.u{color:var(--gold-up)}.ptile.cap{color:var(--flag)}
.ptile.still{background:none;border-color:transparent}
.ptile .fig.raw .v{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pwho .bd .capped{font-style:normal;color:var(--flag);font-weight:600}
/* THE KEYPAD: a sheet of pine from the foot of a phone, a card in the
   corner of anything wider. Par is outlined in gold, the pick-up reads red. */
.keypad{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--pine);color:var(--onpine);
  border-radius:22px;margin:0 8px;padding:14px 16px 12px;
  box-shadow:0 -12px 40px rgba(16,22,17,.4);animation:feelin .22s ease-out}
.keypad .kh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.keypad .kh b{font-size:18px}
.keypad .kh span{flex:1;min-width:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-up)}
.keypad .kh .xx{background:none;border:0;color:#E2C277;font-family:inherit;font-size:14px;font-weight:700;padding:8px 0 8px 8px}
.keypad .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keypad .key{height:58px;border-radius:14px;border:1px solid rgba(238,232,213,.22);background:rgba(238,232,213,.08);
  color:var(--onpine);font-size:24px;font-weight:700;font-family:inherit;position:relative;-webkit-tap-highlight-color:transparent;
  text-align:center;padding:0 0 4px;display:grid;place-items:center}
.keypad .key i{position:absolute;left:0;right:0;bottom:5px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--sage-up);font-weight:700;text-align:center}
.keypad .key.par,.keypad .key.cap{padding-bottom:12px}
.keypad .key.par{border:2px solid #E2C277}
.keypad .key.cap{color:#E99A8C}
.keypad .key.on{background:var(--page);color:var(--ink)}
.keypad .key.on i{color:var(--turf)}
.keypad .key.wide{font-size:14px;font-weight:600;color:var(--sage-up)}
.keypad .krow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.keypad .mchip{flex:1 1 auto;border-radius:999px;border-color:rgba(238,232,213,.3);background:none;color:var(--onpine);font-size:12.5px;padding:7px 10px;min-height:38px;text-align:center}
.keypad .mchip:disabled{opacity:.55}
.keypad .mchip.on{background:var(--green);border-color:var(--green);color:#FBFAF7;opacity:1}
.keypad .relq{color:var(--sage-up)}
.keypad .knext{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--sage-up);font-family:inherit;font-size:13.5px;padding:8px}
/* the page under the pad can still be scrolled up past it */
html:has(.keypad) .page.scoring{padding-bottom:470px}
@media (min-width:700px){
  .keypad{left:auto;right:22px;bottom:118px;width:400px;margin:0;padding-bottom:14px}
  html:has(.keypad) .page.scoring{padding-bottom:96px}
}
.capchip{font-size:14px;color:#FBFAF7;background:var(--flag);padding:5px 11px;border-radius:2px}
.mchip{padding:6px 12px;border:1px solid var(--rule);background:var(--page);color:var(--ink);
  font-size:14px;border-radius:2px;min-height:36px}
.mchip.on{background:var(--green);border-color:var(--green);color:#FBFAF7;font-weight:600}
/* Spent, and disabled because it is spent — it must not read as unavailable
   the way a chip greyed out by a closed round does. */
.mchip:disabled{opacity:.6;cursor:not-allowed}
.mchip.on:disabled{opacity:1}

/* The word on arriving at a nominated hole. */
/* The master's way out of a mis-tap: deliberately plain, deliberately not
   another green chip to jab at. */
.relq{font-size:13px;color:var(--turf);text-decoration:underline;padding:4px 6px;min-height:32px}
.relq:hover{color:var(--flag)}

.holemodal{}
.holemodal .hm-eye{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--turf)}
.holemodal h3{color:var(--green)}
.clearh{min-height:36px;padding:6px 10px;color:var(--turf);font-size:14px;text-decoration:underline}
.clearh:hover{color:var(--ink)}

.side-b{border-top:2px solid var(--ink);padding-top:12px}
.bbb3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bbb3 label{min-width:0}
.bbb3 .field{width:100%;min-width:0}
.side-g{border-top:2px solid var(--gold);padding-top:12px;margin-top:26px}
.side-b h3,.side-g h3{font-size:19px;font-weight:700;margin:0}
.side-g h3{color:var(--gold)}
.sublede{font-size:14px;color:var(--turf);margin:4px 0 12px}
.fieldset{display:grid;gap:12px;margin-top:12px}
.fieldset label{display:grid;gap:4px;font-size:15px}
.fieldset .field{width:100%;font-size:16px}
.fieldset .field.unset{border-color:var(--flag)}

/* ---- gate / lock bar ---- */
/* a gate that is waiting on something you must choose, not just confirm */
.gate.want{border-left-color:var(--gold)}
.gate{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:13px 15px;margin-top:16px;
  border:1px solid var(--rule);border-left:3px solid var(--flag);background:var(--page);border-radius:3px}
.gate .msg{flex:1 1 260px;min-width:0;font-size:15px}
.gate .msg b{display:block;font-size:16px}
.gate .msg span{color:var(--turf);font-size:14px}

/* ---- flags ---- */
.grid-people{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));margin-top:14px}
.sqrow{display:flex;align-items:center;gap:14px;padding:8px 12px 8px 9px;border:1px solid var(--rule);
  background:var(--page);border-radius:3px;min-height:60px}
.sqrow.uk{border-left:3px solid var(--uk)}
.sqrow.usa{border-left:3px solid var(--usa)}
.sqrow.none{border-left:3px dashed var(--rule)}
.sqbox{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:64px;height:44px;
  border:1px solid var(--rule);background:var(--paper);border-radius:2px;color:var(--turf)}
.sqbox svg{display:block;border:1px solid rgba(29,46,33,.18)}
.sqbox:hover:not(:disabled){border-color:var(--pine);background:var(--sunk)}
.sqbox:disabled{opacity:.55;cursor:not-allowed}
.sqname{flex:1;font-size:17px;font-weight:600;min-width:0}
.sqlabel{font-size:14px;color:var(--turf);white-space:nowrap}

/* ---- score bar (ryder) ---- */
.cupbar{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:16px;
  border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:16px 0}
.cupbar .side{display:flex;align-items:center;gap:11px}
.cupbar .side.r{justify-content:flex-end}
.cupbar .pts{font-size:clamp(32px,7vw,52px);font-weight:700;line-height:1}
.cupbar .vs{font-size:19px;color:var(--turf)}
/* A head-to-head, with the point flown at the outer edge.
   The UK golfer is always on the left and the USA golfer always on the
   right, so the two gutters are the two squads: a column of flags down the
   left margin is the UK's points, countable without reading a word. The
   gutter is always there, flag or no flag, so the names stay in line. */
/* A fixture reads ACROSS: name, result, name. That is how every scoreboard
   ever printed has set one, and it is how a reader finds the two people in
   a match without tracking down a column.
   The row is the button — see matchRow() — so it is given the height a
   thumb needs, and the result inside it can stay the size the row wants. */
.match{display:grid;grid-template-columns:24px minmax(0,1fr) auto minmax(0,1fr) 24px;
  gap:8px;align-items:center;width:100%;text-align:left;
  padding:10px 2px;border-bottom:1px solid var(--hair);font-size:16px;
  background:none;border-radius:4px;color:inherit}
.match.why{cursor:pointer;min-height:56px}
@media (hover:hover) and (pointer:fine){ .match.why:hover{background:var(--sunk)} }
.match.why:active{background:var(--sunk)}
.match .st{font-size:15px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;
  white-space:nowrap;color:var(--turf);justify-self:center;text-align:center;line-height:1.3}
.match .st small{display:block;font-size:10.5px;letter-spacing:.04em;color:var(--turf);
  font-weight:400;margin-top:-1px}
.match .st.uk{color:var(--uk);border-color:var(--uk)}
.match .st.usa{color:var(--usa);border-color:var(--usa)}
.match .mn{min-width:0;overflow-wrap:anywhere}
.match .mn.r{text-align:right}
.match .mn.win{font-weight:700}
.match .r{text-align:right}
/* The flag is identity, so it is always there and always legible. The
   squad that took the point is said by the pill's colour and the bold name;
   the flag only steps back a little for the side that did not. */
.mp{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:14px}
.mp svg{display:block;border:1px solid rgba(29,46,33,.22);border-radius:1px;opacity:.5}
.mp.got svg{opacity:1;box-shadow:0 0 0 1px var(--gold)}
/* A half is a real point in the cup and the row has to say so. */
.mp.half svg{opacity:.85}
.mp .pt{font-size:11px;font-weight:700;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.match .mn{color:var(--turf)}
.match .mn.win{color:var(--ink)}

/* The session scoreline: two flags and the points, which is the only figure
   on the screen that decides anything. */
.sessline{display:flex;align-items:center;gap:7px;margin-top:5px}
.sessline svg{display:block;border:1px solid rgba(29,46,33,.22);border-radius:1px;flex:0 0 auto}
.sessline b{font-size:19px;font-weight:700}
.sessline b:first-of-type{color:var(--uk)}
.sessline b:last-of-type{color:var(--usa)}
.sessline .sl-v{color:var(--turf);font-size:14px}
.sessline .sl-n{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--turf)}
/* THIS USED TO STACK. Each golfer got a line of his own with the result on
   a third between them, to stop a surname breaking in half — and it turned
   a fixture into three loose lines with a hand's width of dead paper down
   the middle, four matches filling a phone screen and no two names ever
   next to each other.
   It reads across on a phone as well. The gutters and the gap come in, the
   type comes down a point, and a long name wraps inside its own half rather
   than pushing the row apart. */
@media (max-width:560px){
  .match{grid-template-columns:19px minmax(0,1fr) auto minmax(0,1fr) 19px;
    gap:5px;padding:9px 2px;font-size:15px}
  .match .mn{font-size:15px;line-height:1.2}
  .match .st{font-size:13px;padding:3px 8px}
  .match .st small{font-size:9.5px}
  .mp svg{width:19px;height:auto}
}

/* ---- calendar ---- */
.seg{display:flex;gap:2px;margin-left:auto}
.segb{padding:9px 20px;border:1px solid var(--rule);background:var(--page);color:var(--ink);
  font-size:17px;min-height:44px}
.segb.on{background:var(--pine);border-color:var(--pine);color:var(--onpine);font-weight:600}

/* An event is read first and edited second, so the line stays a line: the
   whole of it is the tap target, with a chevron to say so. */
/* The crest beside a ceremony. Small enough to be a mark on the line rather
   than a thing in its own right, and it never takes space from the name. */

.daystrip{display:flex;gap:2px;margin-top:18px;overflow-x:auto}
.dayb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border:1px solid transparent;
  background:none;color:var(--ink);min-height:52px;border-radius:2px}
.dayb .num{font-size:19px;font-weight:700}
.dayb span:last-child{font-size:13px;color:var(--turf)}
.dayb:hover{background:var(--sunk)}
.dayb.on{background:var(--pine);color:var(--onpine)}
.dayb.on span:last-child{color:var(--rule)}
.dayhead{font-size:clamp(24px,3.4vw,31px);font-weight:700;margin:22px 0 0}
.dayhead span{font-size:17px;font-weight:400;color:var(--turf)}
.drest.big{font-size:17px;font-style:italic;color:var(--gold);margin:6px 0 0}

.fixtures{max-width:820px;margin-top:14px;border-top:2px solid var(--ink)}
.fx{display:flex;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.fxtime{width:104px;flex:0 0 auto;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  background:none;border:none;color:var(--ink);padding:4px 0;border-bottom:1px dashed transparent;border-radius:0}
.fxtitle{flex:1 1 220px;min-width:0;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--green);
  background:none;border:none;padding:4px 0;border-bottom:1px dashed transparent;border-radius:0}
.fxtitle.golf{color:var(--green)}
.fxtime.live,.fxtitle.live{border-bottom-color:var(--rule)}
.fxtime.live:focus,.fxtitle.live:focus{outline:none;border-bottom-color:var(--flag)}
.fxnote{font-size:14px;color:var(--green);margin-left:auto;white-space:nowrap}
.field.small{min-height:40px;padding:6px 10px;font-size:15px}
.rm{min-height:40px;padding:4px 8px;color:var(--flag);font-size:15px}
.rm:hover{text-decoration:underline}
.dashb{margin-top:12px;padding:11px 20px;border:1px dashed var(--gold);background:none;color:var(--turf);
  font-size:16px;border-radius:2px;min-height:44px}
.dashb:hover{color:var(--ink);border-color:var(--pine)}

.teeblock{max-width:820px}
.teegroup{padding:12px 0;border-bottom:1px solid var(--rule)}
.teerow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.teerow .gl{font-size:15px;color:var(--turf)}
.pchip{padding:8px 13px;border:1px solid var(--rule);background:var(--page);color:var(--ink);
  font-size:15px;border-radius:2px;min-height:40px}
.pchip:hover:not(:disabled){border-color:var(--pine)}
.pchip.on{background:var(--green);border-color:var(--green);color:#FBFAF7;font-weight:600}
.pchip:disabled{opacity:.6}

/* ---- yardage table ---- */
.scroller{overflow-x:auto;margin-top:14px}
table.card{border-collapse:collapse;width:100%;min-width:620px;font-size:15px;font-variant-numeric:tabular-nums}
table.card th,table.card td{border-bottom:1px solid var(--hair);padding:7px 8px;text-align:right;white-space:nowrap}
table.card th:first-child,table.card td:first-child{text-align:left;font-family:var(--serif);white-space:normal}
table.card thead th{border-bottom:2px solid var(--ink);font-size:14px;color:var(--turf)}
table.card tbody tr.out td{border-bottom:2px solid var(--rule);font-weight:600}
table.card tfoot td{border-top:2px solid var(--ink);font-weight:700}

/* ---- rules ---- */
.rule-item{border-bottom:1px solid var(--rule)}
/* the points a hole, on one card, before the words */
.ptsbox{margin:14px 0 16px;max-width:520px;border:1px solid var(--rule);border-radius:14px;padding:12px 16px 10px;background:var(--page)}
.ptsbox .pb-t{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--turf);margin-bottom:6px}
.ptstab{width:100%;border-collapse:collapse}
.ptstab td{padding:7px 0;border-top:1px solid var(--rule);font-size:15px;vertical-align:baseline}
.ptstab tr:first-child td{border-top:0}
/* .pk is also the hole picker's class, which lays its box out as a block:
   a table cell by that name must stay a cell, or its rule leaves the row */
.ptstab td.pk,.ptsgrid td.pk,.calcgrid td.pk{display:table-cell;position:static}
.ptstab .pk{font-weight:600;color:var(--ink);white-space:nowrap;padding-right:12px}
.ptstab .pv{color:var(--turf);font-style:italic;width:100%}
.ptstab .pn{text-align:right;font-weight:700;font-size:20px;white-space:nowrap;padding-left:12px}
.ptstab .pn small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--turf);margin-left:3px}
.ptstab tr.pts3 .pn,.ptstab tr.pts4 .pn,.ptstab tr.pts5 .pn{color:#2F7A4A}
.ptstab tr.pts0 .pn{color:var(--flag)}
.ptsbox .pb-n{margin:8px 0 0;font-size:13px;color:var(--turf);line-height:1.45}
.ptstab tr.ptsw .pn{color:#2F7A4A}
.ptstab .pn.word{font-size:15px;font-weight:600;color:var(--turf)}
/* the grids: gross against par by strokes received; the handicaps on the roster */
.ptsgrid{width:100%;border-collapse:collapse}
.ptsgrid th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--turf);font-weight:600;text-align:center;padding:4px 0 6px;border-bottom:1px solid var(--ink)}
.ptsgrid th:first-child{text-align:left}
.ptsgrid td{padding:7px 4px;border-top:1px solid var(--rule);font-size:15px;vertical-align:baseline;text-align:center}
.ptsgrid tr:first-child td{border-top:0}
.ptsgrid .pk{text-align:left;font-weight:600;white-space:nowrap;padding-left:0}
.ptsgrid .pv{text-align:left;color:var(--turf);font-style:italic;font-size:14px}
.ptsgrid .pn{font-weight:700;font-size:18px}
.ptsgrid .pn.pts3,.ptsgrid .pn.pts4,.ptsgrid .pn.pts5{color:#2F7A4A}
.ptsgrid .pn.pts0{color:var(--flag)}
.ptsgrid.hcp .pn{font-size:17px}
/* the calculator: a handicap, a course, and what each hole wants */
.ptsbox.calc{max-width:560px}
.calc-row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:start;margin:6px 0}
.calc-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--turf);padding-top:9px}
.calc-chips{margin:0;gap:6px}
.calc-chips .chip{min-height:32px;padding:4px 11px;font-size:14px}
.calc-step{display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.calc-step b{min-width:28px;text-align:center;font-size:15px}
.calc-step .chip{min-width:32px;padding:4px 0;font-size:16px;line-height:1}
.calc-sum{margin:10px 0 6px;font-size:14px;line-height:1.45;color:var(--turf)}
.calc-sum b{color:var(--ink)}
.calcgrid td{padding:5px 2px;font-size:14.5px}
.calcgrid .st{letter-spacing:1px;color:#2F7A4A;font-weight:700}
.calcgrid .dim{color:var(--turf);font-size:12.5px}
.calcgrid .g{color:#2F7A4A;font-weight:700}
.calcgrid .b{font-weight:700}
.calcgrid th.g{color:#2F7A4A}
.calcgrid tr.has td.pk{color:#2F7A4A}
.rule-item summary{padding:15px 0;cursor:pointer;display:flex;gap:12px;align-items:baseline;list-style:none}
.rule-item summary::-webkit-details-marker{display:none}
.rule-item summary .nm{flex:1 1 auto;font-size:20px;font-weight:600}
.rule-item summary .tg2{font-size:14px;color:var(--turf);font-style:italic;flex:1 1 180px}
.rule-item summary .mk{color:var(--flag);font-size:22px}
.rule-body{padding:0 0 20px;max-width:66ch;display:grid;gap:12px}
.rule-body p{margin:0;font-size:16px}
.rule-body .meta{display:grid;gap:4px;padding:11px 13px;background:var(--sunk);border-left:3px solid var(--flag);border-radius:2px}
.rule-body .meta div{font-size:15px}
.rule-body .meta b{font-size:14px;color:var(--turf);display:block;font-weight:400}
.rule-body .eg{font-style:italic;color:var(--turf);border-top:1px solid var(--hair);padding-top:11px}

/* ---- setup / notices ---- */
.notice{border:1px solid var(--rule);border-left:3px solid var(--flag);background:var(--page);
  padding:14px 16px;margin-top:16px;border-radius:3px;display:grid;gap:7px}
.notice b{font-size:16px}
.notice li{font-size:15px;color:var(--turf);margin-left:18px}
.panel{border:1px solid var(--rule);background:var(--page);padding:16px 18px;border-radius:3px;display:grid;gap:12px;margin-top:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:none}
.kv .k{font-size:15px}
.kv .k small{display:block;color:var(--turf);font-size:13px}

/* ---- modal ---- */
/* ONE SCROLLING SURFACE, and it is this one.
   A tall window used to carry its own scrolling panel inside it, which on a
   phone means a drag can belong to the panel, to the window, or to the page
   behind — and the handover between them is what reads as choppy. The scrim
   scrolls; nothing inside it does.
   align-items:flex-start with margin:auto on the child is the pattern that
   keeps a short window centred while letting a tall one scroll from its top
   rather than being clipped there. */
/* THE GUTTER IS NOT 18px ALL ROUND. A phone keeps its clock, its signal and
   its battery in the top of the glass, and a window that opens flush to the
   top sits underneath them — the title competing with the carrier name. The
   inset is whatever the device says is safe, plus room to breathe, and the
   same at the foot. */
.scrim{position:fixed;inset:0;z-index:60;display:flex;
  align-items:flex-start;justify-content:center;
  padding:max(22px,calc(env(safe-area-inset-top,0px) + 14px)) 18px
          max(22px,calc(env(safe-area-inset-bottom,0px) + 14px));
  background:rgba(16,22,17,.46);
  backdrop-filter:blur(16px) saturate(118%);
  -webkit-backdrop-filter:blur(16px) saturate(118%);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* No backdrop filter on the device: fall back to a scrim solid enough to
   separate the window from the book behind it. */
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .scrim{background:rgba(16,22,17,.62)}
}
/* BATTERY. A backdrop blur is re-rendered on every frame anything moves
   behind or inside it. The chat sheet stays open for an hour and scrolls;
   the recap covers the whole phone. Neither needs the page blurred. */
.scrim.chatscrim,.scrim.recapscrim,.scrim.tcscrim{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(16,22,17,.62)}

/* ---- a window opening ----
   The scrim resolves, the card rises the last few pixels and settles out of
   a slight undersize. A fifth of a second, on a curve that decelerates hard
   — which is the difference between a thing that arrived and a thing that
   was always there and you had simply not noticed.

   Marked by the renderer, and only when the window is a different one from
   the last redraw: the book polls, and a window that did this every few
   seconds would be a twitch. */
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.965)}
                  to{opacity:1;transform:none}}
.scrim[data-in]{animation:scrimIn .2s ease both}
.scrim[data-in] > .modal,
.scrim[data-in] > .askbox,
.scrim[data-in] > .recapbox{animation:cardIn .26s cubic-bezier(.2,.9,.28,1) both}
@media (prefers-reduced-motion:reduce){
  .scrim[data-in],.scrim[data-in] > *{animation:none}
}

/* ---- the window itself ----
   A window is not a page of the book: it is a card lying ON the book, and a
   card is a different object. So it keeps the paper, the pine and the serif
   and takes its GEOMETRY from the thing it actually is — a generous corner,
   no drawn border, and a shadow in three layers: a hairline that separates
   it from the paper, a close shadow that gives it a millimetre of lift, and
   a long one that puts it well above the page. */
.modal{--mpad-x:24px;--mpad-y:22px;
  background:var(--page);border:0;max-width:420px;width:100%;
  margin:auto;padding:var(--mpad-y) var(--mpad-x);border-radius:20px;
  box-shadow:0 0 0 .5px rgba(29,46,33,.16),
             0 2px 8px rgba(16,22,17,.10),
             0 16px 34px rgba(16,22,17,.20),
             0 40px 80px rgba(16,22,17,.22);
  display:grid;gap:13px;overflow:hidden}

/* ---- the top of every window ----

   Pine, with the crest struck white on it, exactly as the panel that opens
   the day's recap is drawn. Every window wears it, so a reader never has to
   work out what they are looking at from the contents. It bleeds to the
   edges of the window, which is what the padding properties above are for:
   a banner cannot know what it is sitting in, so the window tells it. */
/* ONE PINE, EVERYWHERE. The banner used to be drawn in the mid green the
   book uses for TEXT — a colour that reads well as a word on cream and goes
   flat and minty across a whole band. The bar at the foot, the strip at the
   head and the recap's own nameplate were all already the deep pine. The
   banner joins them, with the same gold hairline on the edge that faces the
   page, so every frame in the book is one material. */
.mbanner{margin:calc(var(--mpad-y) * -1) calc(var(--mpad-x) * -1) 6px;
  padding:15px var(--mpad-x) 14px;background:var(--pine);color:var(--onpine);
  border-bottom:2px solid var(--gold-up);
  display:flex;align-items:center;gap:14px;text-align:left}
.mb-w{flex:1 1 auto;min-width:0}
.mb-t{display:block;font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.005em}
.mb-s{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  margin-top:4px;color:var(--sage-up)}
.mb-c{flex:0 0 auto;width:34px;height:auto;filter:invert(1);opacity:.92}
@media (max-width:560px){
  .mb-t{font-size:18px}
  .mb-c{width:29px}
}
.modal h3{margin:0;font-size:21px;font-weight:700}
.modal p{margin:0;font-size:15px;color:var(--turf)}
.pinin{font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:.32em;text-align:center;padding:14px;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink);width:100%;border-radius:12px}
.modal .err{color:var(--flag);font-size:14px;min-height:19px;margin:0}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}

/* ---- what you do about it ----
   A window's buttons are the only round things in a book of printed rules,
   and deliberately: they are the one part of it you touch. On a phone they
   stop sitting in a row at the bottom right, which is a mouse's idea of
   where a button goes, and become a stack the width of the card — with the
   thing you came to do on top, whichever order the markup happens to be in. */
.scrim .acts .btn{border-radius:999px;padding:11px 22px;min-height:46px;font-weight:600;
  letter-spacing:.005em}
.scrim .acts .btn.ghost{border-color:var(--rule);background:var(--paper)}
@media (hover:hover) and (pointer:fine){ .scrim .acts .btn.ghost:hover{background:var(--sunk)} }
/* Destructive is a red WORD on a quiet button, never a red slab. A slab that
   size reads as the main thing to do, and taking an event off the week is
   not the main thing to do on a window headed "Edit this event". */
.scrim .acts .btn.danger{background:var(--paper);border-color:rgba(158,59,46,.45);color:var(--flag)}
@media (hover:hover) and (pointer:fine){
  .scrim .acts .btn.danger:hover{background:var(--flag);border-color:var(--flag);color:#fff}
}
@media (max-width:560px){
  .scrim .acts{flex-direction:column;align-items:stretch;gap:8px}
  .scrim .acts .btn{width:100%;order:2}
  .scrim .acts .btn.danger{order:1}
  .scrim .acts .btn:not(.ghost):not(.danger){order:0}
}

/* Anything you type or choose inside a window is rounded to match it. */
.scrim .field,.scrim .timepick select{border-radius:12px;min-height:46px}
.evk{border-radius:12px}

/* ---- WHERE YOU ARE STANDING ----
   Four round cards and a row of group chips used to band the top of Score
   Entry with a hundred and eighty points of a phone, to say two things that
   change twice a week. On a phone they are one line you tap, and this is
   what it opens: the same two choices, in full, drawn in the grouped-list
   idiom every phone already reads. The tick column is always there, so
   nothing shifts sideways when the choice moves, and each row carries the
   one line that tells two rounds — or two groups — apart. */
.shmodal{gap:0;max-height:84vh;overflow:auto}
.shlist{display:grid;grid-template-columns:minmax(0,1fr);background:var(--paper);
  margin:0 calc(var(--mpad-x) * -1);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.sh-row{display:flex;align-items:center;gap:11px;width:100%;min-height:54px;
  padding:11px var(--mpad-x);border:0;background:none;font-family:inherit;
  text-align:left;color:var(--ink);cursor:pointer}
.sh-row + .sh-row{border-top:1px solid var(--hair)}
.sh-row .tick{flex:0 0 auto;width:15px;line-height:1;font-size:15px;
  font-weight:700;color:var(--green)}
.sh-row .w{flex:1 1 auto;min-width:0;font-size:16px;font-weight:600;line-height:1.25}
.sh-row .w small{display:block;margin-top:2px;font-size:12.5px;font-weight:400;
  color:var(--turf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-row.on{background:var(--sunk)}
.sh-live{flex:0 0 auto;background:var(--flag);color:#fff;border-radius:999px;
  padding:3px 9px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.sh-head{padding:15px 0 7px;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;color:var(--turf)}
.sh-none{margin:0;padding:13px var(--mpad-x);font-size:14px;color:var(--turf)}
.shmodal .acts{margin-top:16px}
@media (hover:hover) and (pointer:fine){ .sh-row:hover{background:var(--sunk)} }

/* ---- the whole hole ---- */
/* ================= THE HOLE WINDOW =================
 *
 * The ground of a hole, stood up, with the yardages over it. Full glass on
 * a phone; a tall rounded window on anything wider. The layout is the one
 * every golf app has taught a golfer to read, in the book's cloth: cream
 * pills and rails, pine cards, gold where the rest of the book is gold,
 * the flag's red for the point you tapped.
 */
.h3scrim{padding:0;align-items:center;justify-content:center}
.h3dwin{--mpad-x:0;--mpad-y:0;position:relative;display:block;max-width:none;width:100%;height:100%;
  margin:0;padding:0;border-radius:0;overflow:hidden;background:#D9E7F3;
  font-family:var(--serif);-webkit-user-select:none;user-select:none}
@media (min-width:700px){
  .h3dwin{width:min(440px,96vw);height:min(900px,94vh);border-radius:24px}
}
.h3sky{position:absolute;inset:0;background:linear-gradient(to bottom,#BBD3EC 0,#D6E5F3 40%,#E9F0F6 72%,#EEE8D5 100%)}
.h3mount{position:absolute;inset:0}
.h3live{position:absolute;inset:0;touch-action:none;cursor:grab}
.h3canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;
  filter:drop-shadow(0 30px 34px rgba(29,46,33,.38))}
.h3layer{position:absolute;inset:0;pointer-events:none}
.h3fallback{position:absolute;inset:60px 0 120px;overflow:auto;display:grid;place-items:center}
.h3fallback img{width:100%;max-width:520px;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35)) saturate(1.1)}
/* the pins and cards over the ground */
.h3pin{position:absolute;transform:translate(-50%,-100%);background:var(--page);color:var(--ink);font-weight:900;font-size:16px;line-height:1;
  padding:6px 9px 5px;border-radius:9px;box-shadow:0 3px 10px rgba(16,22,17,.3);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.h3pin::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--onpine);border-bottom:0}
.h3gcard{position:absolute;transform:translate(-50%,-100%);background:var(--pine);color:var(--onpine);border-radius:11px;padding:7px 12px 6px;text-align:center;
  box-shadow:0 5px 14px rgba(16,22,17,.4);border:2px solid var(--page);display:grid;grid-template-columns:auto auto auto;gap:0 12px}
.h3gcard small{display:block;font-size:7.5px;font-weight:700;line-height:1;color:var(--sage-up);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.h3gcard i{display:block;font-style:normal;font-size:19px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.h3gcard b{display:block;font-size:25px;font-weight:900;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:#E2C277}
.h3gcard::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--onpine);border-bottom:0}
.h3gline{position:absolute;width:2px;height:36px;background:rgba(238,232,213,.85);transform:translateX(-50%)}
.h3tcard{position:absolute;transform:translate(-50%,-100%);background:var(--flag);color:#fff;border-radius:11px;padding:7px 12px 7px;text-align:center;
  box-shadow:0 5px 14px rgba(16,22,17,.4);border:2px solid var(--page)}
.h3tcard small{display:block;font-size:10.5px;font-weight:700;line-height:1;opacity:.9;white-space:nowrap}
.h3tcard b{display:block;font-size:27px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.h3tcard::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--onpine);border-bottom:0}
.h3tgt{position:absolute;transform:translate(-50%,-50%);width:40px;height:17px;border-radius:50%;border:3px solid var(--flag);background:rgba(238,232,213,.7);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.h3tgt::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:5px;margin:-2.5px 0 0 -5.5px;border-radius:50%;background:var(--flag)}
.h3me{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#E2C277;border:3px solid var(--ink);box-shadow:0 0 0 7px rgba(226,194,119,.3),0 2px 6px rgba(0,0,0,.3)}
/* the pill, the close, the rails, the units */
.h3pill{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top,0px));z-index:3;display:flex;align-items:center;gap:6px;background:rgba(238,232,213,.96);border-radius:18px;padding:7px 10px 7px 14px;box-shadow:0 3px 12px rgba(16,22,17,.16)}
.h3pill .fl{width:20px;height:20px;color:var(--gold);display:block}
.h3pill .fl svg{width:20px;height:20px;display:block}
.h3pill .sep{width:1px;height:22px;background:var(--rule);margin:0 4px}
.h3pill .ar{background:none;border:0;color:var(--gold);font-size:24px;font-weight:600;padding:2px 8px;line-height:1;min-width:36px;min-height:36px;font-family:inherit}
.h3pill .ar:disabled{color:var(--rule)}
.h3pill .n{font-size:21px;font-weight:700;letter-spacing:-.01em;padding:0 4px;color:var(--ink);white-space:nowrap}
.h3x{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top,0px));z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:rgba(238,232,213,.96);color:var(--ink);display:grid;place-items:center;font-size:18px;box-shadow:0 3px 12px rgba(16,22,17,.16);font-family:inherit}
.h3rail{position:absolute;top:calc(max(14px,env(safe-area-inset-top,0px)) + 70px);z-index:3;background:rgba(238,232,213,.96);border-radius:22px;box-shadow:0 3px 12px rgba(16,22,17,.16);display:grid}
.h3rail.r{right:14px}
.h3rail button{width:48px;height:52px;display:grid;place-items:center;color:var(--ink);font-size:12px;font-weight:800;border:0;border-top:1px solid var(--hair);background:none;font-family:inherit}
.h3rail button:first-child{border-top:0}
.h3rail button.on{color:var(--gold)}
.h3rail button.g{color:var(--turf)}
.h3rail button.g.live{color:var(--gold)}
.h3rail button.g.dim{color:var(--rule)}
.h3rail svg{width:24px;height:24px}
.h3unit{position:absolute;left:50%;top:calc(max(14px,env(safe-area-inset-top,0px)) + 78px);transform:translateX(-50%);z-index:3;background:rgba(238,232,213,.96);border-radius:999px;padding:5px 4px;display:flex;gap:2px;box-shadow:0 3px 12px rgba(16,22,17,.16)}
.h3unit button{font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;color:var(--turf);border:0;background:none;font-family:inherit;min-height:32px}
.h3unit button.on{background:var(--pine);color:#E2C277}
.h3note{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;z-index:3;background:rgba(29,46,33,.8);color:var(--onpine);border-radius:999px;padding:6px 12px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.h3note.warn{bottom:140px;background:rgba(158,59,46,.92);letter-spacing:.04em;text-transform:none;font-size:12px;white-space:normal;text-align:center;border-radius:12px}
/* the dock: a cream bar floating over the ground — the band shield, your
   net to par, par, and How'd you feel? */
.h3dock{position:absolute;left:14px;right:14px;bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 10px));z-index:3;background:rgba(238,232,213,.97);color:var(--ink);border-radius:22px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;box-shadow:0 10px 30px rgba(16,22,17,.32)}
.h3who{background:none;border:0;padding:0;line-height:0;font-family:inherit}
.h3shield{position:relative;width:40px;height:46px;display:block}
.h3shield svg{width:100%;height:100%;display:block;overflow:visible}
.h3shield .sh{fill:var(--sunk);stroke:var(--rule);stroke-width:1.6}
.h3shield .in{fill:none;stroke:var(--rule);stroke-width:.9;opacity:.65}
.h3shield .bn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:5px;font-size:15px;font-weight:700;color:var(--turf);line-height:1}
.h3shield.on .sh{fill:var(--green);stroke:var(--ink)}
.h3shield.on .in{stroke:var(--paper);opacity:.5}
.h3shield.on .bn{color:var(--onpine)}
.h3dock .w{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px}
.h3dock .fig b{display:block;font-size:28px;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.h3dock .fig span,.h3dock .par span{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--turf);margin-top:3px;white-space:nowrap}
.h3dock .div{width:1px;height:34px;background:var(--rule);flex:0 0 auto}
.h3dock .par b{display:block;font-size:22px;font-weight:800;line-height:1;color:var(--ink)}
.h3feel{flex:0 0 auto;background:var(--gold-up);color:var(--ink);border:0;border-radius:16px;padding:13px 8px;width:104px;min-height:56px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;line-height:1.3;box-shadow:0 2px 0 rgba(0,0,0,.18);font-family:inherit}
.h3feel.still{background:var(--sunk);box-shadow:none;display:grid;place-items:center;gap:2px;color:var(--ink)}
.h3feel.still b{font-size:20px;line-height:1}
.h3feel.still small{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--turf)}
/* overlays inside the window: the drawn hole, the facts, How'd you feel? */
.h3over{position:absolute;inset:0;z-index:5;background:rgba(29,46,33,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.h3feelwin{position:absolute;left:14px;right:14px;bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));z-index:6;border-radius:20px;overflow:hidden;background:var(--page);
  box-shadow:0 0 0 .5px rgba(29,46,33,.16),0 16px 34px rgba(16,22,17,.2),0 40px 80px rgba(16,22,17,.22);max-height:calc(100% - 90px);overflow-y:auto}
.h3feelwin .mb{display:flex;align-items:center;gap:12px;padding:14px 18px 13px;background:var(--pine);color:var(--onpine);border-bottom:2px solid var(--gold-up)}
.h3feelwin .mb .w{flex:1;min-width:0}
.h3feelwin .mb .t{display:block;font-size:19px;font-weight:700;line-height:1.2}
.h3feelwin .mb .s{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-up);margin-top:3px}
.h3feelwin .mb img{width:30px;filter:invert(1);opacity:.92}
.h3feelwin .mb .xx{background:none;border:0;color:var(--sage-up);font-size:13px;font-family:inherit;padding:8px 0 8px 8px}
.h3feelwin .lede{padding:12px 18px 0;margin:0;font-size:13.5px;line-height:1.45;color:var(--turf)}
.h3feelwin .h3pick{padding:12px 18px 16px}
.h3chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 18px 0}
.h3chip{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--paper);text-align:left;font-family:inherit;min-height:56px}
.h3chip b{display:block;font-size:15px;color:var(--ink)}
.h3chip span{display:block;font-size:11.5px;color:var(--turf);margin-top:2px}
.h3chip.on{background:var(--pine);border-color:var(--pine)}
.h3chip.on b{color:var(--onpine)}.h3chip.on span{color:var(--sage-up)}
.h3chip.good.on{background:var(--green);border-color:var(--green)}
.h3word{margin:12px 18px 0;width:calc(100% - 36px);border-radius:12px}
.h3feelwin .acts{display:flex;gap:8px;padding:12px 18px 16px;margin:0}
.h3feelwin .acts .btn{flex:1}

/* ---- why a match stands where it does ---- */
.mwmodal{--mpad-x:20px;max-width:520px;gap:0;padding:22px 20px 18px}
.mwmodal .mw-eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--turf);
  font-weight:700;display:block}
.mwmodal .mw-q{font-size:22px;margin:6px 0 0;line-height:1.2}
.mwmodal .mw-q span{color:var(--turf);font-weight:400;font-size:17px;padding:0 4px}
.mw-v{margin:8px 0 0;font-size:16px;font-weight:600;color:var(--ink)}
.mw-w{margin:3px 0 0;font-size:14px;color:var(--turf)}
.mw-w b{color:var(--gold)}

.mw-tally{display:flex;gap:8px;margin-top:14px;text-align:center}
.mw-tally span{flex:1 1 0;min-width:0;border:1px solid var(--rule);background:var(--paper);
  border-radius:3px;padding:7px 4px;font-size:12px;color:var(--turf);overflow-wrap:anywhere}
.mw-tally b{display:block;font-size:21px;color:var(--ink)}

.mw-head,.mw-row{display:grid;grid-template-columns:58px 1fr 1fr 64px;gap:6px;align-items:center}
.mw-head{margin-top:16px;padding:0 4px 6px;border-bottom:2px solid var(--ink);
  font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--turf);font-weight:700;
  line-height:1.25;overflow-wrap:anywhere}
.mw-head .s,.mw-head .r{text-align:center}
.mw-head small{display:block;font-weight:400;letter-spacing:0;text-transform:none}
/* No longer a scroll region of its own — the whole window scrolls. A rule
   at its foot still closes the list off from the note under it. */
.mw-rows{border-bottom:1px solid var(--rule)}
.mw-row{padding:7px 4px;border-bottom:1px solid var(--hair)}
.mw-row:last-child{border-bottom:none}
.mw-row .h b{font-size:16px}
.mw-row .h small{display:block;font-size:10px;color:var(--turf)}
.mw-s{text-align:center;border-radius:3px;padding:2px 0}
.mw-s b{font-size:19px;color:var(--turf);font-weight:400;line-height:1.1}
.mw-s small{display:block;font-size:10px;color:var(--turf)}
/* the ball that took the hole */
.mw-s.win{background:var(--sunk)}
.mw-s.win b{color:var(--ink);font-weight:700}
.mw-row .r{text-align:right;font-size:14px;font-weight:700;color:var(--turf)}
.mw-row .r small{display:block;font-size:10px;font-weight:400}
.mw-row .r.uk{color:var(--uk)}
.mw-row .r.usa{color:var(--usa)}
.mw-row.halved .r{font-weight:400}
.mw-note{margin:12px 0 0;font-size:12.5px;color:var(--turf);line-height:1.5}
.mwmodal .acts{justify-content:center;margin-top:16px}

/* ---- the band read ----
   A verdict a man can take in without reading: what he chose, an arrow, what
   the card says. The sentence under it is the working, for whoever wants to
   argue. */
.bandread{margin-top:10px;border-top:2px solid var(--ink)}
.br-row{display:grid;grid-template-columns:minmax(0,1fr) 48px 20px 48px auto;gap:8px;
  align-items:center;padding:11px 2px 3px}
.br-who{font-size:17px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.br-who small{display:block;font-size:12.5px;font-weight:400;color:var(--turf)}
.br-now,.br-next{text-align:center}
.br-now b,.br-next b{display:block;font-size:20px;line-height:1.1}
.br-now small,.br-next small{display:block;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--turf)}
.br-now b{color:var(--turf)}
.br-arrow{text-align:center;color:var(--turf);font-size:16px}
.br-tag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
  white-space:nowrap;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.br-line{margin:0 2px 11px;padding-bottom:11px;border-bottom:1px solid var(--hair);
  font-size:14px;color:var(--turf);line-height:1.5}
.br-line b{color:var(--ink)}

/* holding is the quiet state; a move is the one worth seeing */
.br-right .br-tag{color:var(--green)}
.br-light .br-tag{color:var(--flag)}
.br-light .br-next b{color:var(--flag)}
.br-heavy .br-tag{color:var(--gold)}
.br-heavy .br-next b{color:var(--gold)}
.br-unset .br-tag{color:var(--gold)}
.br-thin .br-tag{color:var(--turf)}

/* The band read's button has two homes and one of them is always empty.
   Beside the heading there is a column of blank paper on a tablet; on a
   phone there is none, so down the page it goes, under the day's card. */
.prachead{justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brtop{display:none}
.brtop .recapwrap{margin-top:0}
.brlow{display:block}
@media (min-width:700px){
  .brtop{display:block;flex:0 1 380px;min-width:280px}
  .brlow{display:none}
}

/* ---------------- the bar ----------------

   Four destinations, the same four on every device. Only the bar moves:
   under the thumb on a phone, along the top on a tablet or a laptop, where
   there is no thumb to reach with and the eye goes to the top anyway. Both
   are in the page and this decides which one is seen — one of them is always
   display:none, so a tap can never land on the hidden one. */
.tabbar{display:none}


/* NOT .tbtn — that name was already taken by the pill buttons further down
   this file, and theirs won, which is why the bar came out as four outlined
   boxes instead of four marks on one surface. */
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:5px 2px;border:0;background:none;border-radius:10px;color:var(--turf);
  min-height:52px;font-family:inherit}
.navbtn .ic{width:23px;height:23px;flex:0 0 auto}
.navbtn .lb{font-size:11px;letter-spacing:.01em;line-height:1}
.navbtn .lg{display:none}          /* the long name, for anything that reads the page */
.navbtn[aria-current="page"]{color:var(--green)}
.navbtn[aria-current="page"] .lb{font-weight:700}
.navbtn[aria-current="page"] .ic{stroke-width:2.1}
.navbtn:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){ .navbtn:hover{color:var(--ink);background:var(--sunk)} }

/* ---- Manage: one door for everything set once ---- */
.setup-chip.manage.done{color:var(--ink)}

/* ---- the dateline ----
   Three facts in tracked capitals: where we are in the week, what is being
   played, and when you are off. The same register the day's recap sets its
   metarail in — brought forward, not invented. Phone only: a tablet and a
   laptop have room for the nameplate as it has always been. */
.dateline{display:none}
.dateline span{white-space:nowrap}
.dateline span+span::before{content:"\00B7";padding:0 7px;color:var(--rule);font-weight:400}
.dateline .hot{color:var(--green)}

/* ---- the strip that stays ----
   Laid over the page, never in it: it appears and goes without a single
   pixel of the book moving. Pine, because it is the same furniture as the
   bar at the foot, and the shield is struck white on it so the crest is
   never more than a glance away wherever you have got to. */
.topstrip{position:fixed;top:0;left:0;right:0;z-index:45;
  display:none;align-items:center;gap:9px;
  padding:7px max(14px,env(safe-area-inset-left,0px)) 7px max(14px,env(safe-area-inset-right,0px));
  padding-top:calc(7px + env(safe-area-inset-top,0px));
  background:var(--pine);color:var(--onpine);border-bottom:3px solid var(--gold-up);
  box-shadow:0 6px 18px rgba(29,46,33,.22);
  transform:translateY(-100%);transition:transform .2s cubic-bezier(.22,.61,.36,1)}
.ts-ask{flex:0 0 auto;display:grid;place-items:center;min-width:40px;min-height:40px;
  margin:-7px 0 -7px -8px;padding:0;border:0;background:none;border-radius:50%}
.ts-ask:focus-visible{outline:2px solid var(--gold-up);outline-offset:-3px}
.ts-c{width:26px;height:auto;flex:0 0 auto;filter:invert(1);opacity:.94;display:block}
.ts-n{font-size:14.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.ts-t{margin-left:auto;font-size:13px;color:var(--sage-up);white-space:nowrap;flex:0 0 auto}
.dial.ts-d{width:32px;height:32px;flex:0 0 auto;margin-left:9px}
.dial.ts-d .dial-g{width:30px;height:30px}
.dial.ts-d.free{color:var(--gold-up)}
.dial.ts-d.shut{color:var(--sage-up)}
.dial.ts-d.in{color:var(--onpine)}
.dial.ts-d .dial-ct{box-shadow:0 0 0 2px var(--ink);min-width:18px;height:18px;line-height:18px;
  font-size:11px;top:-3px;right:-4px}
/* The same fade as the bar at the foot, the other way up: the page
   dissolves into the strip rather than being cut off by it. */
.topstrip::after{content:"";position:absolute;left:0;right:0;top:100%;height:22px;
  pointer-events:none;background:linear-gradient(to bottom,var(--paper),rgba(227,219,203,0))}
@media (prefers-reduced-motion:reduce){ .topstrip{transition:none} }

/* ---- the dial ----
   One mark where the two full-width buttons used to band the page. The ring
   is the lock, the sunburst is the crest's own compass, and the count in the
   corner is what is still to settle. */
.dial{flex:0 0 auto;position:relative;width:46px;height:46px;padding:0;border:0;background:none;
  color:var(--turf);border-radius:50%;display:grid;place-items:center;align-self:center}
.dial-g{width:44px;height:44px;display:block;transition:transform .14s ease}
@media (hover:hover) and (pointer:fine){ .dial:hover{color:var(--ink)} .dial:hover .dial-g{transform:rotate(22deg)} }
.dial:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.dial:active .dial-g{transform:scale(.94)}
/* no PIN anywhere: the ring is not closed, and says so without a word */
.dial.free{color:var(--gold)}
.dial.free .dial-r{stroke-dasharray:4.5 5.5}
.dial.shut{color:var(--turf)}
.dial.in{color:var(--green)}
.dial-ct{position:absolute;top:-1px;right:-3px;min-width:21px;height:21px;padding:0 5px;
  border-radius:999px;background:var(--flag);color:#FBFAF7;font-size:12.5px;font-weight:700;
  line-height:21px;text-align:center;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 2px var(--paper)}

/* ---- who the book thinks you are, in the window that settles things ---- */
/* The footer of the group: what the book thinks you are, and the way to
   change it. Same surface as the list above it, so the window reads as two
   blocks rather than a list and a warning. */
.mg-role{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;
  padding:13px 15px;background:var(--paper);border:1px solid var(--hair);border-radius:14px}
.mg-rw{flex:1 1 180px;min-width:0}
.mg-rt{display:block;font-size:15px;font-weight:700}
.mg-rn{display:block;font-size:13px;color:var(--turf);margin-top:2px;line-height:1.45}
.mg-rb{flex:0 0 auto;min-height:38px;padding:7px 14px;font-size:14px}
.mgmodal{--mpad-x:20px;max-width:460px;gap:0;padding:22px 20px 18px}
/* An inset grouped list, which is what this is: a short set of places to go,
   gathered on a surface of their own and rounded off at both ends. The rules
   between them start where the words start rather than running into the
   corners — a separator that reaches the edge of a rounded box is the thing
   that makes a list look drawn rather than made. */
.mglist{display:grid;margin-top:14px;background:var(--paper);
  border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.mg-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;border:0;background:none;position:relative;
  font-family:inherit;cursor:pointer;color:var(--ink)}
.mg-row+.mg-row::before{content:"";position:absolute;left:15px;right:0;top:0;
  height:1px;background:var(--hair)}
.mg-row:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){ .mg-row:hover{background:var(--sunk)} }
.mg-row:active{background:var(--sunk)}
.mg-row.on .mg-t{color:var(--green)}
.mg-w{flex:1 1 auto;min-width:0}
.mg-t{display:block;font-size:17px;font-weight:600;line-height:1.25}
.mg-n{display:block;font-size:13px;color:var(--turf);margin-top:2px;line-height:1.4}
.mg-ct{flex:0 0 auto;background:var(--flag);color:#FBFAF7;font-size:13px;font-weight:700;
  min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;padding:0 7px;
  font-variant-numeric:tabular-nums}
.mg-go{flex:0 0 auto;color:var(--turf);font-size:19px;font-weight:700}

/* ---- the all inclusive package ----
   The one thing on the resort tab that is a promise rather than a reading of
   a website, so it is set as a plate: banded head, the four lines of it, and
   the one open question kept visibly apart from the four. */
.pkg{margin-top:16px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;
  background:var(--paper)}
.pkghead{background:var(--pine);color:var(--onpine);border-bottom:2px solid var(--gold-up);padding:12px 16px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pkghead h3{margin:0;font-size:17px;font-weight:700}
.pkgsrc{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.78}
.pkglist{display:grid}
.pkgrow{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:4px 18px;
  padding:11px 16px;border-bottom:1px solid var(--hair)}
.pkgt{font-size:15px;font-weight:700}
.pkgd{font-size:14.5px;line-height:1.5;color:var(--turf)}
.pkgcav{margin:0;padding:11px 16px;font-size:13.5px;line-height:1.5;color:var(--turf);
  background:var(--page);border-left:3px solid var(--gold)}
@media (max-width:560px){
  .pkgrow{grid-template-columns:1fr;padding:10px 14px}
  .pkgcav{padding:10px 14px}
}

/* ---- a round, as the week shows it ----
   Read-only on purpose: the times are set behind Manage, and this is the
   page everybody opens. */
.rdmodal{--mpad-x:20px;max-width:460px;gap:0;padding:22px 20px 18px}
.rd-fmt{margin:13px 0 0;font-size:14px;color:var(--turf);font-style:italic}
.rd-tees{display:grid;margin-top:13px;background:var(--paper);
  border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.rd-row{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 12px;
  align-items:baseline;padding:11px 14px;position:relative}
.rd-row+.rd-row::before{content:"";position:absolute;left:14px;right:0;top:0;
  height:1px;background:var(--hair)}
.rd-g{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--turf);font-weight:700}
.rd-t{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.rd-who{grid-column:1 / -1;font-size:14px;color:var(--turf);line-height:1.45}
.rd-none{margin:0;padding:14px;font-size:14.5px;color:var(--turf)}
.rd-note{margin:14px 0 0;font-size:13px;color:var(--turf)}

/* The round on a day card opens that window, so it reads as a thing you can
   press — the same chevron the events carry. */

/* ---- a rule, over the board it belongs to ---- */
.rulemodal{--mpad-x:22px;max-width:580px;gap:0;padding:22px 22px 18px}
.ru-meta{display:grid;gap:8px;margin-top:14px;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.ru-meta b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--turf);font-weight:700;margin-bottom:1px}
.ru-meta div{font-size:15px}
.ru-p{margin:12px 0 0;font-size:15px;line-height:1.6;color:var(--turf)}
.ru-eg{margin:14px 0 0;padding:11px 13px;background:var(--paper);border-left:3px solid var(--gold);
  font-size:14.5px;line-height:1.55}
.ru-eg b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--turf);margin-bottom:4px}
.rulemodal .acts{margin-top:18px}
/* Full rules is a window now, not a journey, so it is a button. It is still
   drawn as the quiet link it has always been. */
.rulelink{background:none;border:0;padding:0;font:inherit;font-size:15px;color:var(--flag);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rulelink:hover{color:var(--ink)}

/* ---- an event, in a window ----
   Written the way a calendar app writes one: a field, a time, a kind, Save. */
.evmodal{max-width:420px;gap:0}
.evmodal .ev-eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--turf);display:block}
.evmodal h3{margin:6px 0 14px}
.evmodal .ev-l{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--turf);font-weight:700;margin:14px 0 6px}
.evmodal .ev-l:first-of-type{margin-top:0}
.evmodal .field{width:100%;font-size:17px}
.evmodal .timepick{display:flex;gap:6px;align-items:center}
.evmodal .timepick .field{width:auto;flex:1 1 auto}
.evmodal .timepick .ampm{flex:0 0 auto}
.evkinds{display:flex;gap:8px}
.evk{flex:1 1 0;padding:10px 6px;border:1px solid var(--rule);background:var(--paper);
  color:var(--turf);border-radius:3px;font-size:14px;font-weight:600;cursor:pointer}
.evk:hover{border-color:var(--pine);color:var(--ink)}
.evk.on{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.evmodal .err{margin-top:12px}
.evmodal .acts{margin-top:4px}

/* ---- the day's card ----

   Seven columns, which on a phone is three too many for the name to survive:
   the fixed cells wanted 370px of a 360px row, so the name was squeezed to
   nothing and spilled sideways over the band sitting next to it. The columns
   give way instead, and the name wraps inside its own box. */
.pboard .p-pos{width:24px}
.pboard .p-who{flex:1 1 auto;min-width:0}
.pboard .p-band,.pboard .p-thru,.pboard .p-gross,.pboard .p-par{text-align:right}
.pboard .p-band{min-width:46px;color:var(--turf)}
.pboard .p-thru{min-width:46px}
.pboard .p-gross{min-width:52px}
/* To par decides the day, so it is the figure set large. */
.pboard .p-par{min-width:74px;font-size:23px;font-weight:700}
.pboard .rowhead .p-par{font-size:14px;font-weight:400}
@media (max-width:560px){
  .pboard .row,.pboard .rowhead{gap:7px}
  .pboard .p-pos{width:16px;font-size:13px}
  .pboard .row .p-who{font-size:15.5px;overflow-wrap:anywhere}
  .pboard .rowhead span{font-size:11.5px}
  .pboard .p-band,.pboard .p-thru{min-width:28px;font-size:15px}
  .pboard .p-gross{min-width:34px;font-size:15px}
  .pboard .p-par{min-width:44px;font-size:19px}
}

/* ---- the read as a window, and the verdict as the control ----

   The read is behind a button on the board, set exactly as the day's recap
   is set, and opens here. The verdict pill is the control: tap it and that
   golfer moves to the band his card asks for. Nothing navigates, nothing
   closes, and the row re-reads under your thumb. */
.brmodal{--mpad-x:20px;max-width:620px;gap:0;padding:22px 20px 18px}
.brmodal .br-eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--turf);
  display:block}
.brmodal .br-q{font-size:22px;margin:6px 0 10px;line-height:1.2}
.brmodal .br-lede{font-size:14.5px;line-height:1.55;color:var(--turf);margin:0}
.brmodal .br-lede b{color:var(--ink)}
.brmodal .br-how{font-size:14px;line-height:1.5;color:var(--ink);margin:10px 0 0;
  padding:9px 11px;background:var(--paper);border-left:3px solid var(--gold)}
.brmodal .br-foot{font-size:14px;line-height:1.55;color:var(--turf);margin:14px 0 0}
.brmodal .acts{justify-content:center;margin-top:16px}

/* A pill you can press is a pill that has to be worth pressing at: the
   reading size was eleven px of uppercase, which is a label, not a target. */
.br-tag.act{cursor:pointer;background:var(--paper);padding:7px 11px;min-height:32px;
  transition:background .15s ease,color .15s ease,border-color .15s ease}
.br-tag.act::after{content:'\00A0\203A';font-weight:700}
.br-heavy .br-tag.act:hover,.br-unset .br-tag.act:hover{background:var(--gold);color:var(--onpine);border-color:var(--gold)}
.br-light .br-tag.act:hover{background:var(--flag);color:var(--onpine);border-color:var(--flag)}
.br-tag.act:focus-visible{outline:2px solid var(--flag);outline-offset:3px}
/* Undo sits in the working line, in the sentence that says what happened. */
.br-moved{display:block;margin-bottom:3px;color:var(--ink)}
.br-undo{font:inherit;font-size:13.5px;color:var(--flag);text-decoration:underline;
  background:none;border:0;padding:0;cursor:pointer}
.br-undo:hover{color:var(--ink)}

/* On a phone the name takes a line of its own and the verdict sits under it:
   what he chose, an arrow, what the card says, and the word for it hard
   right. Every cell is placed by hand — left to flow, the numbers landed in
   the wide column meant for the name and the tag landed on top of them. */
@media (max-width:560px){
  .br-row{grid-template-columns:46px 18px 46px minmax(0,1fr);gap:6px;padding-bottom:5px}
  .br-who{grid-column:1 / -1}
  .br-now{grid-column:1}
  .br-arrow{grid-column:2}
  .br-next{grid-column:3}
  .br-tag{grid-column:4;justify-self:end}
}

/* ---- the turn ----
   A scoreboard, not a dialogue box: wider than the rest, and the field list
   scrolls inside it rather than pushing the buttons off a phone. */
.turnmodal{--mpad-x:22px;max-width:460px;gap:0;padding:22px 22px 18px}
.turnmodal .tn-eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--turf);font-weight:700;display:block}
.turnmodal .tn-q{font-size:24px;margin:6px 0 0;color:var(--ink)}
.tn-pace{margin:6px 0 0;font-size:15px;font-weight:600}
.tn-pace.good{color:var(--green)}
.tn-pace.bad{color:var(--flag)}
.tn-pace.first{color:var(--gold)}

.tn-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tn-card{border:1px solid var(--rule);background:var(--paper);border-radius:3px;
  padding:9px 11px;min-width:0}
.tn-card .l{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--turf)}
.tn-card .v{display:block;font-size:18px;font-weight:700;line-height:1.2;margin-top:3px;
  overflow-wrap:anywhere}
.tn-card .s{display:block;font-size:13px;color:var(--turf);margin-top:1px}

/* a card with nothing beside it takes the row rather than leaving a hole */
.tn-card.tn-wide{grid-column:1 / -1}

/* The cup, in the form it takes on its own tab: two flags and the score.
   Tighter here — it is a line in a window, not the head of a page. */
.turnmodal .cupbar{grid-template-columns:1fr auto 1fr;gap:12px;margin-top:16px;
