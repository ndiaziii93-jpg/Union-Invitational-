.rhero{position:relative;margin:0 calc(clamp(16px,3.4vw,40px) * -1);height:clamp(230px,34vw,360px);
  overflow:hidden;background:var(--pine)}
.rhero img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block;opacity:.92}
.rhero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(16,22,17,.96) 0,rgba(16,22,17,.5) 50%,rgba(16,22,17,.12))}
.rh-in{position:absolute;left:clamp(16px,3.4vw,40px);right:clamp(16px,3.4vw,40px);bottom:18px;z-index:2;color:var(--onpine)}
.rh-k{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#E2C277}
.rhero .rechead{color:var(--onpine);margin:6px 0 0;font-size:clamp(26px,4.2vw,46px);line-height:1.04;
  text-shadow:0 2px 12px rgba(0,0,0,.4);max-width:22ch}
/* the numbers of the day */
.rtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.rtile{background:var(--pine);color:var(--onpine);border-radius:14px;padding:12px 14px 11px;min-width:0}
.rtile b{display:block;font-size:24px;font-weight:700;line-height:1;letter-spacing:-.02em}
.rtile b.g{color:#E2C277}
.rtile span{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-up);
  font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.noscroll{overflow:hidden}
/* The crest behind the page is a large fixed layer. Under a full-screen
   window it cannot be seen and can still cost a repaint on every frame of a
   scroll, which is exactly the wrong thing to be paying for while something
   is moving over the top of it.
   NEVER THE OPENING, THOUGH. While `.opening` is on, that layer is not the
   background — it IS the page, the only thing on screen, and hiding it
   would take the opening away from anybody who happened to have a window up
   when the book loaded. */
html.noscroll .watermark:not(.opening){display:none}
.recapbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--sunk);border:0;border-radius:12px;padding:11px 14px;margin-top:14px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--turf)}
.recapbar > div:first-child b{color:var(--ink)}
.recapbar .btn{border-radius:999px;padding:9px 16px;min-height:40px;font-size:13.5px;font-weight:600;
  letter-spacing:0;text-transform:none}
.recapacts{display:flex;gap:8px;flex-wrap:wrap}
.recaparch{margin-top:12px}
/* The dateline. The same five facts, set the way a paper sets them: small,
   letterspaced, in capitals, separated by rules rather than by whitespace. */
.metarail{display:flex;gap:0;flex-wrap:wrap;align-items:baseline;padding:11px 0 9px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  margin-top:14px;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--turf)}
.metarail span{padding:0 14px;border-left:1px solid var(--rule)}
.metarail span:first-child{padding-left:0;border-left:0;color:var(--ink);font-weight:700}

.recapgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px;margin-top:20px;align-items:start}
.rechead{font-size:clamp(30px,5.2vw,52px);font-weight:700;line-height:1.02;margin:0 0 4px;
  letter-spacing:-.015em;text-wrap:balance}
/* The head block rules itself off from the body; with no byline it is the
   headline's own hairline. */
.arthead{margin-bottom:13px}
.arthead .rechead:last-child{padding-bottom:13px;border-bottom:1px solid var(--rule)}
.recpara{font-size:16.5px;line-height:1.62;margin:0 0 13px;text-align:justify;hyphens:auto}

/* The opening letter, cut into the first three lines.
   Keyed to a CLASS, not to :first-of-type: the byline is a <p> too, and the
   day a byline was added the drop cap silently went to it instead. */
.artbody .recpara.lead::first-letter{
  float:left;font-size:3.4em;line-height:.82;font-weight:700;color:var(--ink);
  padding:.04em .09em 0 0;margin-right:.02em}

/* Two columns once there is room for them, with a rule between, which is the
   single thing that most makes a block of type read as a newspaper. */
@media (min-width:900px){
  /* Only the BODY is columned, and the head is a block above it — so nothing
     here needs `column-span: all`. That declaration is the one WebKit gets
     wrong: on an iPad it painted the opening paragraph a second time, above
     the headline and clipped. A layout that never asks for the feature
     cannot meet the bug, which is a better fix than a workaround. */
  .artbody{column-count:2;column-gap:30px;column-rule:1px solid var(--rule)}
  /* Editing turns them off — a column of textareas is not a thing anybody
     wants to type into. */
  .artbody.editing{column-count:1}
  .recpara{max-width:none}
}
@media (max-width:899px){ .recpara{max-width:68ch} }

/* Declared here, after the rules it overrides: at equal specificity the
   later rule wins, and placing this beside the dateline it also touches put
   it before .recpara and quietly did nothing. */
@media (max-width:700px){
  /* Wrapped, a rule before each fact reads as a list rather than a dateline,
     and justified type in a column this narrow opens rivers of white between
     the words. Both give way on a phone. */
  /* As a flowing line, not a flex column. Wrapped, one fact a line with a
     rule in front of each reads as a bulleted list; this reads as a
     dateline, which is what it is. */
  .metarail{display:block;line-height:1.9}
  .metarail span{display:inline;border-left:0;padding:0}
  /* The separator TRAILS the fact before it rather than leading the one
     after. Led, it lands at the start of a wrapped line and the dateline
     goes back to looking like a bulleted list — which is the thing the
     block display was changed to avoid. */
  .metarail span:not(:last-child)::after{content:'\00a0\00b7';color:var(--rule);padding-right:7px}
  .recpara{text-align:left;hyphens:none}
  .artbody .recpara.lead::first-letter{font-size:3em}
}
/* Editing the words. The fields wear the type they replace, so the page does
   not jump when the commissioner turns editing on. */
.recedit{width:100%;font-family:inherit;line-height:1.5;resize:vertical;border-style:dashed}
.recedit.head{font-size:clamp(24px,3.4vw,32px);font-weight:700;line-height:1.14;margin-bottom:14px}
textarea.recedit{font-size:17px;line-height:1.62;max-width:68ch;margin-bottom:10px}
.recedit.one{min-height:38px;padding:5px 8px;font-size:14px;margin-top:4px}
.recedit.pick{min-height:38px;max-width:180px;font-size:14px}
.btn.ghost.on{border-color:var(--pine);color:var(--ink)}
.galsec{margin-top:22px;padding-top:6px;border-top:1px solid var(--rule)}
.galsec .titlerow{align-items:baseline}
.fromround.bare{margin-top:8px}
.fromround.bare .addph{margin-bottom:8px}
.rechero{margin:0}
.rechero img{display:block;width:100%;height:auto;border:1px solid var(--ink);filter:saturate(.92)}
.rechero figcaption{font-size:12px;color:var(--turf);margin-top:7px;line-height:1.45;
  padding-top:6px;border-top:1px solid var(--rule);font-style:italic}

/* The swing of the day, set as a pull quote in the margin. */
.swing{margin-top:22px;padding:16px 0 4px;border-top:3px double var(--ink);
  border-bottom:1px solid var(--rule)}
.swing .sw-l{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--turf)}
.swing .sw-v{font-size:44px;font-weight:700;color:var(--gold);line-height:1;margin:4px 0 6px;
  letter-spacing:-.02em}
.swing .sw-c{font-size:14.5px;color:var(--ink);line-height:1.5;font-style:italic;
  padding-bottom:14px}

/* Section heads, ruled off the way a paper separates its parts. */
.recapbox .sub{font-size:13px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:5px;margin-top:30px}
.recapbox .rows{border-top:0}
.recapbox .lede{font-size:14px}

.ribwrap{margin-top:26px}
.ribhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:14px;color:var(--turf)}
.riblegend{display:inline-flex;gap:10px;align-items:center}
.rl{display:inline-block;width:11px;height:11px;border:1px solid var(--rule);margin-right:4px;vertical-align:-1px}
.rl.under{background:var(--pine);border-color:var(--pine)}
.rl.level{background:var(--page)}
.rl.over{background:var(--overtint);border-color:var(--flag)}
.ribbon{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));gap:3px;margin-top:8px;scroll-snap-type:x proximity}
.ribcell{display:flex;align-items:center;justify-content:center;min-height:34px;font-size:14px;
  border:1px solid var(--rule);background:var(--page);border-radius:2px;scroll-snap-align:center}
.ribcell.under{background:var(--pine);border-color:var(--pine);color:var(--onpine);font-weight:700}
.ribcell.over{background:var(--overtint);border-color:var(--flag)}

.rectable .row.lead{background:var(--leadtint)}
.rectable .row:nth-child(odd of .row){background:var(--page)}
.recapcols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:8px}
.row.honour .who small{margin-top:2px}

.fromround{margin-top:30px}
.phnote{font-size:13px;color:var(--turf);margin:4px 0 10px}
/* A photograph whose file will not load is a visible gap with a reason in
   it, never an empty box that reads as "nothing uploaded". */
.ph.broken img{display:none}
.ph.broken a::after{content:'picture missing';display:flex;align-items:center;justify-content:center;
  min-height:96px;padding:10px;border:1px dashed var(--flag);color:var(--flag);font-size:13px;text-align:center}
.phstrip{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;min-height:96px;
  border:1px dashed var(--rule);border-radius:3px;padding:10px}
.ph{margin:0;width:150px}
.ph img{display:block;width:150px;height:104px;object-fit:cover;border:1px solid var(--rule)}
.ph figcaption{font-size:12px;color:var(--turf);margin-top:4px;display:flex;gap:6px;justify-content:space-between}
.ph.pending{width:150px;height:104px;border:1px solid var(--rule);background:var(--sunk);
  display:flex;flex-direction:column;justify-content:flex-end;padding:6px}
.phbar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:6px}
.phbar i{display:block;height:100%;background:var(--green)}
.phempty{color:var(--turf);font-style:italic;padding:22px 6px;font-size:15px}
.addph{display:inline-flex;align-items:center;cursor:pointer}

.upnext{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-top:28px;padding-top:12px;
  border-top:2px solid var(--ink);font-size:15px}
.upnext .un-l{font-size:14px;color:var(--turf)}
.upnext .un-red{color:var(--flag);font-weight:600}

@media (max-width:900px){
  /* One column on a narrow screen, in the order the report is meant to be
     read: headline, then the words, then the picture and the swing. Full
     width, the hero would run to half a page, so it is cropped instead. */
  .recapgrid{grid-template-columns:1fr;gap:18px}
  .rechero img{max-height:38vh;object-fit:cover}
  .recapcols{grid-template-columns:1fr;gap:10px}
  .ribbon{grid-template-columns:repeat(18,44px);min-width:0}
  .ribwrap .scroller{scroll-snap-type:x mandatory}
}
@media (max-width:720px){
  .ph,.ph img,.ph.pending{width:132px}
  .ph img{height:92px}
  .metarail{gap:14px;font-size:13px}
}

/* ---- the MVP board ----
   Seven columns is a table, and a table does not fit a phone. The names ran
   straight over the band column and the total hung off the right edge, both
   of which are what "Pos Player Band Thru Today Pts Total" costs at 390px.

   Wide, it stays the table it was. Narrow, each golfer becomes two lines:
   what you scan for — position, name, net to par — on the first, and the
   working out on the second, every figure under its own label. The four
   middle figures are wrapped in .mvpmeta for exactly this, and that wrapper
   is `display:contents` on a wide screen, which hands its children straight
   back to the row as if it were not there. */
.rows.mvp .n.quiet{color:var(--turf)}
.mvpmeta{display:contents}

@media (max-width:720px){
  .rows.mvp .rowhead{display:none}
  .rows.mvp .mvprow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;
    grid-template-areas:"pos who tot" "meta meta meta";
    column-gap:10px;row-gap:7px;align-items:baseline;padding:14px 0}
  .rows.mvp .mvprow .pos{grid-area:pos;width:auto;font-size:14px}
  /* the one place a long name is allowed to end in an ellipsis rather than
     push the figures off the screen */
  .rows.mvp .mvprow .who{grid-area:who;min-width:0;font-size:18px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rows.mvp .mvprow .big{grid-area:tot;min-width:0;font-size:27px;line-height:1}
  .rows.mvp .mvpmeta{grid-area:meta;display:flex;gap:8px;
    border-top:1px solid var(--hair);padding-top:8px}
  .rows.mvp .mvpmeta .n{flex:1 1 0;min-width:0;text-align:left;font-size:17px;
    display:flex;flex-direction:column;gap:2px;color:var(--ink)}
  .rows.mvp .mvpmeta .n::before{content:attr(data-l);font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--turf);font-variant-numeric:normal;font-weight:400}
  /* only the figure that means something keeps its colour */
  .rows.mvp .mvpmeta .n.under{color:var(--under)}
  .rows.mvp .mvpmeta .n.over{color:var(--over)}
}

/* ---- the marks ----
   Everything here exists so the scoring tab does NOT grow sixteen new
   controls. The tab gains one button; the rest lives in a sheet that is only
   opened on a hole where something happened. */

/* the one button, and what it says when the hole already carries marks */
.markbtn .ct{display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;padding:0 5px;margin-left:6px;border-radius:999px;
  background:var(--gold);color:#FBFAF7;font-size:13px;font-weight:700;line-height:1}
.markbtn{color:var(--turf);border-color:var(--hair);font-weight:400}
@media (hover:hover) and (pointer:fine){ .markbtn:hover{color:var(--ink);border-color:var(--rule)} }
.markbtn.has{border-color:var(--gold);color:var(--ink);font-weight:600}

/* a hole that carries a mark says so in the strip, so a ref can see at a
   glance what they have logged and spot one they meant to */
.hcell{position:relative}
.hcell.marked::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;
  border-radius:50%;background:var(--gold)}
.hcell.on.marked::after{background:var(--paper)}

.marksheet{max-width:460px}
.ms-head h3{margin:2px 0 0}
.ms-head p{margin:6px 0 0}
.msgrid{margin-top:14px;border-top:2px solid var(--ink)}
.ms-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--cols),44px);
  gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}
.ms-row.ms-hdr{padding:6px 0 7px;border-bottom:1px solid var(--rule)}
.ms-who{min-width:0;font-size:16px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* Not uppercased and not letter-spaced: "3-putt" is six characters and at
   44px wide the tracking pushed it onto two lines, broken at the hyphen. */
.ms-col{font-size:12px;text-align:center;color:var(--turf);line-height:1.15}
.mscell{height:44px;border:1px solid var(--rule);background:var(--page);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  color:transparent;-webkit-tap-highlight-color:transparent;
  transition:background .15s ease,border-color .15s ease}
@media (hover:hover) and (pointer:fine){.mscell:not(:disabled):hover{border-color:var(--pine)}}
.mscell.on{color:#FBFAF7}
.mscell.bad.on{background:var(--flag);border-color:var(--flag)}
.mscell.good.on{background:var(--green);border-color:var(--green)}
.mscell:disabled{opacity:.45}
/* the legend, because two letters at the top of a column is not a word */
.ms-key{font-size:13px;color:var(--turf);margin:12px 0 0;line-height:1.6}
.ms-key .bad{color:var(--flag);font-weight:600}
.ms-key .good{color:var(--green);font-weight:600}

/* ---- the two lanes ----
   The ref scores the group; everybody else keeps their own round. */
.lanes{display:flex;gap:2px;margin-top:16px;border:1px solid var(--rule);
  border-radius:4px;padding:3px;background:var(--page);max-width:420px}
.lane{flex:1 1 0;min-height:44px;padding:9px 12px;border-radius:2px;font-size:16px;
  color:var(--turf);text-align:center;white-space:nowrap}
.lane.on{background:var(--pine);color:var(--onpine);font-weight:700}
@media (hover:hover) and (pointer:fine){.lane:not(.on):hover{color:var(--ink)}}

/* ---- My Round ---- */
.minepick{margin-top:18px;border-top:2px solid var(--ink);padding-top:14px}
.minemarks{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.mnchip{flex:1 1 150px;min-height:52px;padding:12px 14px;border:1px solid var(--rule);
  background:var(--page);color:var(--ink);border-radius:9px;font-size:16px;text-align:left;
  -webkit-tap-highlight-color:transparent;transition:background .15s ease,border-color .15s ease}
@media (hover:hover) and (pointer:fine){.mnchip:not(.on):hover{border-color:var(--pine)}}
.mnchip.on{color:#FBFAF7;font-weight:600}
.mnchip.bad.on{background:var(--flag);border-color:var(--flag)}
.mnchip.good.on{background:var(--green);border-color:var(--green)}
/* the per-hole chips carry a line of their own, so "Robbed" and "Got away
   with it" need no explaining on a tee box */
.minemarks .mnchip{display:flex;flex-direction:column;gap:2px;min-height:60px}
.minemarks .mnchip b{font-weight:600}
.minemarks .mnchip span{font-size:13px;color:var(--turf)}
.minemarks .mnchip.on span{color:rgba(251,250,247,.82)}
.minesay{display:block;margin-top:18px;max-width:560px}
.minesay .field{width:100%;margin-top:6px}
.minerow{align-items:baseline}
.minerow .pos{color:var(--turf)}
.mntag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;
  font-weight:600;border:1px solid currentColor;margin-right:4px}
.mntag.bad{color:var(--flag)}
.mntag.good{color:var(--green)}
.minetx{font-style:italic;color:var(--turf)}

@media (max-width:560px){
  .ms-row{grid-template-columns:minmax(0,1fr) repeat(var(--cols),40px);gap:4px}
  .mscell{height:40px}
  .ms-who{font-size:15px}
  .mnchip{flex:1 1 100%}
}

.pinbox{width:120px;text-align:center;letter-spacing:.2em}
.pinstate{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--flag);align-self:center;margin-right:8px}
.pinstate.on{color:var(--green)}

.btn.wa{background:#25D366;border-color:#25D366;color:#0B2A17}
.btn.wa:hover{filter:brightness(1.05)}

/* ---- how a hole felt, in two steps ---- */
.tonepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1 / -1}
.tone{min-height:46px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--rule);text-align:center;padding:0 10px;
  background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent}
.tone.good.on{background:var(--green);border-color:var(--green);color:#FBFAF7}
.tone.bad.on{background:var(--flag);border-color:var(--flag);color:#FBFAF7}
.toneopts{display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px;grid-column:1 / -1}
@media (min-width:520px){.toneopts{grid-template-columns:repeat(3,1fr)}}
.minemarks{display:block}
.minemarks .toneopts .mnchip{width:100%}
.feelbar .tone{background:rgba(238,232,213,.07);border-color:rgba(238,232,213,.28);color:var(--onpine)}
.feelbar .tone.good.on{background:var(--gold-up);border-color:var(--gold-up);color:var(--ink)}
.feelbar .tone.bad.on{background:#B4523F;border-color:#B4523F;color:#fff}
.feelbar .fb-chips{display:block}
.feelbar .toneopts{grid-template-columns:repeat(3,1fr);gap:6px}
.feelbar .toneopts .fb-chip span{display:none}
.feelbar .toneopts .fb-chip{text-align:center;padding:8px 6px}
.h3chips{display:block}

/* ---- how'd it feel? the question put the moment a score lands ----
   A strip of pine above the nav, one tap to answer, a word if they want
   one. On the scoring page it stands above the Save bar; on anything
   wider it is a card in the corner, off the page's own column. */
.feelbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:29;
  background:var(--pine);color:var(--onpine);border-radius:18px;padding:12px 14px;
  box-shadow:0 10px 30px rgba(16,22,17,.38);border-top:2px solid var(--gold-up);
  animation:feelin .28s ease-out}
/* already up when the page was rebuilt: no second entrance */
.keypad.still,.feelbar.still{animation:none}
@keyframes feelin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
html:has(.page.scoring) .feelbar{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.fb-h{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.fb-n{font-size:28px;font-weight:700;line-height:1;color:#E2C277;min-width:26px;letter-spacing:-.02em}
.fb-w{flex:1;min-width:0}
.fb-w b{display:block;font-size:16px;line-height:1.2}
.fb-w span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-up);margin-top:3px}
.fb-skip{background:none;border:0;color:var(--sage-up);font-family:inherit;font-size:13px;padding:8px 0 8px 10px}
.fb-chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fb-chip{border:1px solid rgba(238,232,213,.28);border-radius:12px;padding:8px 11px;background:rgba(238,232,213,.07);
  text-align:left;font-family:inherit;color:var(--onpine);min-height:50px;-webkit-tap-highlight-color:transparent}
.fb-chip b{display:block;font-size:14px;font-weight:600}
.fb-chip span{display:block;font-size:11px;color:var(--sage-up);margin-top:1px}
.fb-chip.on{background:var(--page);border-color:var(--onpine)}
.fb-chip.on b{color:var(--ink)}.fb-chip.on span{color:var(--turf)}
.fb-chip.good.on{background:var(--gold-up);border-color:var(--gold-up)}
.fb-row{display:flex;gap:8px;margin-top:9px}
.fb-word{flex:1;min-width:0;border-radius:12px;background:rgba(238,232,213,.08);color:var(--onpine);
  border-color:rgba(238,232,213,.28);font-size:15px}
.fb-word::placeholder{color:rgba(238,232,213,.5)}
.fb-done{background:var(--gold-up);color:var(--ink);border-color:var(--gold-up);border-radius:12px;padding:0 18px;font-weight:600}
@media (min-width:700px){
  .feelbar{left:auto;right:22px;width:380px;bottom:22px}
  html:has(.page.scoring) .feelbar{bottom:22px}
}

/* ---- your round so far, on My Round: what has been kept, counted ---- */
.feelstrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 0 14px;padding:10px 14px;
  border:1px solid var(--rule);border-radius:12px;background:var(--sunk)}
.feelstrip .fs-n{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--turf);margin-right:auto}
.feelstrip .fs-t{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink)}
.feelstrip .fs-t i{font-style:normal;display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;
  background:var(--pine);color:var(--onpine);font-size:11.5px;padding:0 5px}
.feelstrip .fs-t.good i{background:var(--gold-up);color:var(--ink)}
.feelstrip .fs-q{flex-basis:100%;font-style:italic;color:var(--turf);font-size:13.5px}

/* ---- the end of the round, in the golfer's own words ----
   One mood, mutually exclusive, so it reads as a single answer rather than a
   set of switches. The confessions beside it reuse the My Round chip. */
.moodrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mdchip{flex:1 1 140px;min-height:52px;padding:12px 14px;border:1px solid var(--rule);
  background:var(--page);color:var(--ink);border-radius:9px;font-size:16px;
  -webkit-tap-highlight-color:transparent;transition:background .15s ease,border-color .15s ease}
@media (hover:hover) and (pointer:fine){.mdchip:not(.on):hover{border-color:var(--pine)}}
.mdchip.on{color:#FBFAF7;font-weight:700}
.mdchip.good.on{background:var(--green);border-color:var(--green)}
.mdchip.mid.on{background:var(--gold);border-color:var(--gold)}
.mdchip.bad.on{background:var(--flag);border-color:var(--flag)}
.ownsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.ownsrow .sublede{flex:1 1 100%;margin:0}
@media (max-width:560px){.mdchip{flex:1 1 calc(50% - 4px)}}

/* ---- the recap, as a sports page ----
   The newsprint underneath is the right instinct; what it was missing is the
   furniture every sports page has and every dialog does not. A banded
   nameplate, a kicker, a byline between rules, and the paper's own name at
   the foot. Between them they say what you are looking at before you have
   read a word, which is the whole job of the top of a page. */

/* The nameplate. Pine band, crest, letterspaced caps — a masthead on a
   broadsheet and a lower-third on a broadcast are the same object. */
.artplate{display:flex;align-items:center;gap:12px;margin-top:16px;
  background:var(--pine);color:var(--onpine);padding:10px clamp(12px,2vw,18px);
  border-bottom:3px solid var(--gold-up)}
/* The crest on a dark band, with its drawing intact.
   `brightness(0) invert(1)` forces EVERY opaque pixel to the same white, so
   the linework and the panels it encloses come out identical and the whole
   thing collapses to a silhouette. The art is 57% transparent, 33% dark
   linework and a few per cent of light interiors — inverting it instead
   sends the linework to near-white and those interiors to near-black, which
   on a #1D2E21 band reads as the green showing through the drawing. And it
   is given enough size to be worth looking at: detail at thirty pixels is
   detail nobody sees. */
.artplate .ap-crest{width:42px;height:auto;flex:0 0 auto;filter:invert(1);opacity:.96}
.artplate .ap-name{flex:1;min-width:0;font-size:clamp(15px,2.3vw,20px);font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.artplate .ap-ed{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--rule);white-space:nowrap}

/* The kicker: the line above the headline that says which contest this is.
   Red, small, letterspaced — the one place the flag colour earns a shout. */
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--flag);margin:16px 0 8px}
.kicker span{color:var(--rule);padding:0 4px}

/* The byline, ruled top and bottom the way a paper rules one. */
.byline{display:flex;flex-wrap:wrap;gap:0;align-items:baseline;margin:12px 0 0;
  padding:7px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);
  font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--turf)}
.byline b{color:var(--ink);font-weight:700}
.byline span{padding-left:12px;margin-left:12px;border-left:1px solid var(--rule)}
.byline .draftflag{color:var(--flag);font-weight:700}

/* The foot of the page carries its own name, as a folio does. */
.folio{display:flex;align-items:center;gap:14px;margin-top:34px;padding:18px 0 26px;
  border-top:3px double var(--ink)}
.folio img{width:26px;height:auto;opacity:.5}
.folio .fl-t{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--turf);
  white-space:nowrap}
.folio .fl-r{flex:1 1 auto;height:1px;background:var(--rule)}

@media (max-width:700px){
  .artplate{gap:9px;padding:9px 11px}
  .artplate .ap-ed{display:none}
  .artplate .ap-crest{width:34px}
  .byline span{padding-left:9px;margin-left:9px}
  .folio .fl-t{white-space:normal;letter-spacing:.12em}
}

/* ---- the recap's scoreboard ----
   A figure pinned to the right-hand edge of a nine-hundred-pixel sheet has
   nothing to do with the name at the other end of the row — the eye has to
   cross the whole page to pair them up, and on a tablet that is a long way.
   Every scoreboard worth reading puts its numbers in COLUMNS of their own
   and centres them there. Tabular figures keep the digits lined up inside
   the column, so centring costs nothing in comparability. */
.rectable .rt-pos{width:30px;flex:0 0 auto;text-align:center}
.rectable .rt-who{flex:1 1 auto;min-width:0}
.rectable .rt-n,.rectable .rt-t{flex:0 0 auto;text-align:center;
  font-variant-numeric:tabular-nums}
.rectable .rt-n{width:96px}
.rectable .rt-t{width:104px;font-size:21px;font-weight:700}
.rectable .rowhead .rt-n,.rectable .rowhead .rt-t{font-size:13px}

/* The honours and the side games are the same shape of problem: a title at
   one end of the sheet and its answer at the other. A column, again. */
.recapbox .row .rt-v{flex:0 0 auto;width:176px;min-width:0;text-align:center;
  overflow-wrap:anywhere}
.recapbox .row .rt-v.win{font-weight:700}

/* Narrow, the columns give ground before the names do. */
@media (max-width:700px){
  .rectable .rt-pos{width:22px}
  .rectable .rt-n{width:62px}
  .rectable .rt-t{width:68px;font-size:19px}
  .recapbox .row .rt-v{width:auto;max-width:47%;text-align:right}
}

/* ---- the recap on a phone ----
 *
 * It was reading as squeezed because it was a card inside a frame inside a
 * frame: the scrim held eighteen pixels of padding, the sheet took 96vw of
 * what was left, and the sheet's own padding took another forty. On a 390px
 * screen that is a hundred pixels of margin around a column of type, and the
 * article never had a chance.
 *
 * A phone is not a desk with a sheet of paper on it. The page IS the screen,
 * so it goes full bleed — and the desk metaphor goes with it: no stacked
 * pages behind, no drop shadow, no rounded frame. The pine spine stays,
 * because it still marks the edge of the page and costs nothing.
 *
 * The rest is the chrome giving way to the article. Three full-size buttons
 * and a paragraph of status was four lines of furniture before a reader got
 * to the headline.
 */
@media (max-width:700px){
  .recapscrim{padding:env(safe-area-inset-top,0px) 0 0}
  .recapbox{width:100vw;max-width:100vw;border-left:0;border-right:0;
    padding:0 15px calc(env(safe-area-inset-bottom,0px) + 4px);
    box-shadow:inset 4px 0 0 var(--green),inset 5px 0 0 var(--paper)}

  .recaptop{padding:11px 0 7px}
  .recaptop b{font-size:18px;letter-spacing:.05em}

  /* status and actions, at the size of a thing you read past rather than a
     thing you stop at */
  .recapbar{padding:9px 11px;margin-top:12px;font-size:13.5px;gap:9px}
  .recapacts{gap:6px}
  .recapacts .btn{min-height:40px;padding:8px 12px;font-size:14px}
  .recaparch{margin-top:10px}

  .artplate{margin-top:12px;padding:8px 11px}
  .artplate .ap-name{font-size:15px;letter-spacing:.11em}

  .metarail{margin-top:11px;padding:8px 0 7px;font-size:10.5px;letter-spacing:.08em;line-height:1.8}
  .kicker{font-size:11px;letter-spacing:.13em;margin:15px 0 6px}
  .rechead{font-size:clamp(28px,7.6vw,36px);line-height:1.04}
  .byline{font-size:10.5px;letter-spacing:.08em;padding:6px 0}
  .byline span{padding-left:9px;margin-left:9px}
  .recpara{font-size:17px;line-height:1.6}
  .folio{margin-top:26px;padding:14px 0 20px}
}

/* ---- the crest on the Day's Recap button ----
   The same drawing as the nameplate's, on the right of the box. It is
   decoration, so it carries no alt text and no tap target of its own: the
   whole panel is one button. */
.recapbtn{display:flex;align-items:center;gap:14px}
.recapbtn .rb-w{flex:1 1 auto;min-width:0}
.recapbtn .rb-c{flex:0 0 auto;width:46px;height:auto;opacity:.22;
  transition:opacity .2s ease,filter .2s ease}
/* Lit, the panel is pine and the crest is inverted onto it — linework white,
   the panels it encloses reading as the green underneath, exactly as on the
   nameplate. */
.recapbtn.ready .rb-c{filter:invert(1);opacity:.9}
/* On a phone these two panels run the full width of the screen, and a 3px
   corner against the bezel reads as a slab. Round them properly there. */
@media (max-width:560px){
  .recapbtn .rb-c{width:38px}
  .recapwrap .recapbtn{border-radius:16px;padding:15px 18px}
}

/* ---------------- The Titanic ----------------

   The plate at the head of the guide. Set as a printed plate is set — the
   picture, then a line of type under it saying what you are looking at —
   rather than a heading dropped on top of a photograph. */

.rhero{margin:18px 0 22px}
.rhero img{display:block;width:100%;height:230px;object-fit:cover;object-position:center 34%}
.rhero figcaption{margin-top:7px;font-size:13px;color:var(--turf);max-width:74ch;line-height:1.5}
@media (max-width:820px){
  .rhero{margin:14px 0 18px}
  .rhero img{height:160px}
}

/* THE PLATE IS A BAND. The name is set on the photograph, the hotel's own
   name small above it, and the reading in the opposite corner — the way a
   guide's title page carries its date. What used to be a caption, a head,
   a paragraph and a box is one piece. */
.rhero.band{position:relative;margin:14px 0 0;border-radius:16px;overflow:hidden;
  background:var(--pine);color:var(--onpine);min-height:150px}
.rhero.band img{height:250px;object-position:center 58%}
.rhero.band::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(16,22,17,.92) 0,rgba(16,22,17,.32) 50%,rgba(16,22,17,0))}
.rhero.band .rt-words{position:absolute;left:18px;bottom:15px;z-index:2;max-width:58%}
.rhero.band figcaption{margin:0 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;color:var(--sage-up);max-width:none;line-height:1.3}
.rhero.band .head{margin:0;color:var(--onpine);font-size:30px;line-height:1;letter-spacing:-.01em}
.rhero.band .rt-wx{position:absolute;right:16px;bottom:13px;z-index:2;text-align:right}
.rhero.band .wx{margin:0;padding:0;background:none;border:0;color:var(--onpine);
  display:grid;justify-items:end;gap:2px}
.rhero.band .wx-now{display:flex;align-items:center;gap:8px}
.rhero.band .sky.big{width:30px;height:30px;color:#E2C277}
.rhero.band .wx-t{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.rhero.band .wx-s{display:flex;flex-direction:row;gap:6px;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;color:var(--sage-up)}
.rhero.band .wx-s b{color:var(--onpine);font-size:10.5px}
.rhero.band .units{margin:5px 0 0;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.rhero.band .ub{min-width:34px;min-height:24px;padding:0 8px;font-size:11px;
  background:none;color:var(--sage-up);border:0}
.rhero.band .ub.on{background:var(--page);color:var(--ink);font-weight:700}
.rhero.band .wx .tiny{margin:4px 0 0;color:var(--sage-up);font-size:10.5px;max-width:190px;line-height:1.35}
.rhero.band .wx.cold .wx-cold{text-align:right;max-width:170px}
.rhero.band + .gamesbar{margin-top:14px}
/* The index carries the long names where there is room and the short ones
   on a phone. Scoped to THIS strip: on the boards' own, `.lg` is the long
   name kept for anything that reads the page aloud, and stays hidden. */
.btabs.rt .btab .lg{display:inline}
.btabs.rt .btab .sm{display:none}

/* ---- the lists go dense ----
   One line a place: the name on the left, when it shuts on the right, a way
   in at the end. Seventeen snack bars as full cards were a page in
   themselves; as lines they are a column. */
.clock{margin:14px 0 0;font-size:14px;color:var(--turf)}
.clock b{color:var(--ink)}
h3.sub .subn{margin-left:auto;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--turf);font-weight:700}
h3.sub{display:flex;align-items:baseline;gap:12px}
h3.sub.minehead .rm{margin-left:auto;font-size:13px;font-weight:400}
.vmore{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--hair);padding:10px 2px;font:inherit;font-size:13.5px;
  color:var(--turf);cursor:pointer}
.vmore .ch{margin-left:auto;font-size:18px}
@media (hover:hover) and (pointer:fine){ .vmore:hover{color:var(--ink)} }


/* ---------------- The Titanic ----------------
   A guide, not a scorecard: the type is a little larger, the rows breathe,
   and nothing is set in the tabular figures the boards use. */

/* --- the weather ---
   Set the way a weather app sets it: the picture and the number, large, and
   an hour-by-hour run under it. Everything is drawn in the book's ink, so it
   holds up on a phone that has lost its signal. */

.wx{margin-top:18px;padding:14px 16px;background:var(--page);border:1px solid var(--rule)}

/* The head of the guide is one grid, so the same markup can put the weather
   beside the title on a wide screen and below the parts of the guide on a
   phone — where the title has no room to share. */
.resorttop{display:grid;grid-template-columns:minmax(0,1fr)}
.rt-words{order:1;min-width:0}
.btabs{order:2}
.rt-wx{order:3;min-width:0}
.rt-wx .wx{margin-top:0}
@media (min-width:760px){
  .resorttop{grid-template-columns:minmax(0,1fr) minmax(280px,340px);
    column-gap:30px;align-items:start}
  .rt-words{grid-column:1;grid-row:1}
  .rt-wx{grid-column:2;grid-row:1;align-self:center}
  .resorttop .btabs{grid-column:1 / -1;grid-row:2}
}
.wx-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;
  border-bottom:1px solid var(--hair);margin-bottom:13px}
.wx-lbl{font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-family:var(--mono);font-weight:700;color:var(--turf)}
.wx-cold{margin:0}
.wx-now{display:flex;align-items:center;gap:16px}
.sky{width:34px;height:34px;flex:0 0 auto;color:var(--green)}
.sky.big{width:56px;height:56px}
.sky .cl{fill:var(--page)}
.sky .ray{stroke-width:1.5}
.sky .bolt{fill:currentColor;stroke-width:1}
.wx-t{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em}
.wx-s{display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--turf);min-width:0}
.wx-s b{color:var(--ink);font-size:17px}

.units{margin-left:auto;display:flex;border:1px solid var(--rule);flex:0 0 auto}
.ub{min-width:48px;min-height:40px;padding:0 10px;font-size:15px;color:var(--turf);background:var(--page)}
.ub.on{background:var(--pine);color:var(--onpine);font-weight:700}
@media (hover:hover) and (pointer:fine){ .ub:not(.on):hover{color:var(--ink)} }

.wx .tiny{margin:10px 0 0}
@media (max-width:820px){
  .wx{padding:13px 14px}
  .wx-t{font-size:42px}
  .sky.big{width:48px;height:48px}
  .wx-now{gap:13px}
}

.seasonband{margin-top:16px;padding:14px 16px;background:var(--page);
  border:1px solid var(--rule);border-left:4px solid var(--gold)}
.seasonband .sbs{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{padding:8px 14px;min-height:44px;font-size:16px;color:var(--turf);
  background:var(--paper);border:1px solid var(--rule)}
.sbtn.on{background:var(--pine);color:var(--onpine);border-color:var(--pine);font-weight:700}
.sbtn:disabled{opacity:.55;cursor:default}
@media (hover:hover) and (pointer:fine){ .sbtn:not(.on):not(:disabled):hover{color:var(--ink);border-color:var(--pine)} }
.seasonband .tiny{margin:10px 0 0;max-width:72ch}

.tiny{font-size:13px;color:var(--turf);line-height:1.5}
.minihead{margin:18px 0 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--turf);font-family:var(--mono);font-weight:700}

/* --- eating and drinking, in three blocks ---
   The one distinction the page exists to make is which of these will put a
   charge on the room, so the blocks are drawn as blocks: a banded head, a
   rule down the side, air between them. The charged one is tinted the
   banner green — faintly, at eight per cent, so it reads as a different
   thing on the paper without the type having to fight it. */

.vgroup{margin-top:30px;border:1px solid var(--rule);background:var(--page)}
.vgroup:first-of-type{margin-top:18px}
.vghead{display:flex;align-items:baseline;gap:14px;padding:11px 16px;
  border-bottom:2px solid var(--ink);background:var(--paper)}
.vghead h3{margin:0;font-size:23px;font-weight:700;line-height:1.2}
.vgn{margin-left:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--mono);color:var(--turf);white-space:nowrap}
.vglead{margin:0;padding:12px 16px 0;font-size:15px;color:var(--turf);max-width:76ch;line-height:1.55}
.vglead b{color:var(--ink);font-weight:700}
.vgroup .vlist{margin:10px 0 0;padding:0 16px 4px;border-top:none}
.vgroup .vrow:last-child{border-bottom:none}

.vg-cover{background:rgba(62,92,67,.08);border-color:var(--green)}
.vg-cover .vghead{background:rgba(62,92,67,.14);border-bottom-color:var(--green)}
.vg-cover .vghead h3{color:var(--green)}
.vg-cover .vgn{color:var(--green)}
.vg-cover .vrow{border-bottom-color:rgba(62,92,67,.22)}

/* --- a venue, as a card (Right now) and as a row (the lists) --- */

.vgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-top:6px;border-top:1px solid var(--hair)}
.vgrid.dim .vcard{opacity:.68}
/* Every square is a way in to the place it names, so it has to look like
   one: a button, with a mark in the corner saying it can be pressed. */
.vcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;position:relative;
  padding:10px 2px;min-height:52px;background:none;border:0;border-bottom:1px solid var(--hair);
  font:inherit;color:var(--ink);cursor:pointer}
.vcard.cover{box-shadow:inset 3px 0 0 var(--gold);padding-left:11px}
.vcard .vtop{flex:1 1 auto;min-width:0;display:flex;gap:3px 8px;align-items:baseline;flex-wrap:wrap}
.vcard .vn{font-size:16px}
.vcard .vc{font-size:13px}
.vcard .vwhen{flex:0 0 auto;margin:0;font-size:13.5px;color:var(--turf);text-align:right;
  line-height:1.3;max-width:46%}
.vcard .vtag{display:inline-block;margin-top:0;white-space:normal;line-height:1.5;font-size:10px;padding:1px 6px}
.vcard .vgo{flex:0 0 auto;font-size:19px;line-height:1;color:var(--rule)}
.vcard:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){
  .vcard:hover{background:var(--sunk)}
  .vcard:hover .vgo{color:var(--ink)}
}
.vgroup .plink .vb{display:block;margin:4px 0 0}
@media (hover:hover) and (pointer:fine){ .vgroup .plink:hover .vn{text-decoration:underline} }

.vlist{margin-top:8px;border-top:1px solid var(--hair)}
.vrow{display:flex;gap:16px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--hair)}
.vrow.out{opacity:.5}
.vmain{flex:1 1 auto;min-width:0}
.vtop{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vn{font-size:17px;font-weight:700}
.vc{font-size:14px;color:var(--turf);font-style:italic}
.vtag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);
  color:var(--gold);border:1px solid var(--gold);padding:1px 6px;white-space:nowrap;
  max-width:100%;overflow-wrap:anywhere}
.vcard .vtag{white-space:normal;line-height:1.5}
.vtag.warmtag{color:var(--flag);border-color:var(--flag)}
.vb{margin:4px 0 0;font-size:15px;color:var(--turf);max-width:68ch;line-height:1.55}
.vb.warn{color:var(--flag)}

.hrs{flex:0 0 190px;text-align:right;font-size:15px}
.hrs .slot{display:block}
.hrs .slot i{display:block;font-size:12px;font-style:normal;letter-spacing:.06em;
  text-transform:uppercase;color:var(--turf);font-family:var(--mono)}
.hrs .shut{color:var(--flag);font-style:italic}
.hrs.two{display:flex;gap:16px;flex:0 0 300px;justify-content:flex-end}
.hrs.two > div{min-width:0}
.hrs.two b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--turf);font-family:var(--mono);font-weight:700}

/* --- the site plan --- */

.pkeys{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pkey{display:inline-flex;align-items:center;gap:9px;padding:7px 13px;min-height:40px;
  font-size:15px;color:var(--turf);background:var(--page);border:1px solid var(--rule)}
.pkey.on{background:var(--pine);color:var(--onpine);border-color:var(--pine);font-weight:700}
/* SVG text scales with the box it is drawn in, so a plan allowed to run the
   full width of a desktop window sets its labels at forty points. Capping the
   width is what keeps them readable, at every size. */
.planwrap{margin-top:12px;border:1px solid var(--rule);background:var(--page);max-width:660px}
.planstage{position:relative}
.plan{display:block;width:100%;height:100%}
.plan .pbg{fill:var(--page)}
.plan .pt .dot{fill:var(--rule)}

/* The tap targets sit over the drawing, not in it: a dot two units across is
   four pixels on a phone, and a button focuses and answers a keyboard where
   an SVG circle does not. Thirty-two pixels is the smallest honest target;
   they do overlap in the crowded middle, which is what the list below is
   for — picking from it is exact. */
/* With the hotel's artwork behind them the drawing has no shape of its own:
   the picture sets the height and everything else is laid over it.
   It is a panorama nearly four times as wide as it is tall, so on anything
   narrower than a laptop it has to be dragged sideways rather than shrunk to
   a hundred pixels of nothing — which is what the hotel's own map does too. */
.planwrap.art{max-width:none;background:var(--paper);overflow:auto;
  -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
/* `--z` is how far in we are. At one the whole plan is on the page and the
   wrapper takes whatever height the picture needs. Past that the wrapper
   becomes a window of fixed height and the plan is dragged about inside it,
   which is the only way to get close enough to read a single building. */
.planwrap.art .planstage{width:calc(100% * var(--z,1));min-width:calc(960px * var(--z,1))}
.planwrap.art.zoomed{height:clamp(320px,56vh,560px);border-color:var(--pine);cursor:grab}

.zoomrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.zoomrow .tiny{margin-left:4px}
.zb{min-width:44px;min-height:40px;padding:0 12px;font-size:19px;line-height:1;
  color:var(--turf);background:var(--page);border:1px solid var(--rule)}
.zb.wide{font-size:15px}
.zb:disabled{opacity:.4;cursor:default}
@media (hover:hover) and (pointer:fine){ .zb:not(:disabled):hover{color:var(--ink);border-color:var(--pine)} }
.zn{min-width:96px;font-size:15px;color:var(--ink);font-weight:700}
.zoomrow .tiny{margin-left:4px}
.planimg{display:block;width:100%;height:auto}
.pins{position:absolute;inset:0}
.pin{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;padding:0;
  border:none;background:none;border-radius:50%}
.pin::after{content:'';position:absolute;inset:8px;border-radius:50%}
.planwrap.art .pin::after{inset:10px;border:1.5px solid var(--page);
  box-shadow:0 1px 3px var(--shadow)}
.planwrap.art .pin.c-core::after{background:var(--pine)}
.planwrap.art .pin.c-stay::after{background:var(--turf)}
.planwrap.art .pin.c-eat::after{background:var(--gold)}
.planwrap.art .pin.c-play::after{background:var(--green)}
.planwrap.art .pin.c-shore::after{background:var(--flag)}
.planwrap.art .pin.on::after{inset:6px;box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--ink)}
/* The artwork carries no names of its own, so the point that was tapped says
   what it is right there — the card below the map is a scroll away on a
   phone, and a dot that answers with nothing reads as a dead map. */
/* With something chosen, the landmarks keep their names too. The question a
   tap asks is how far that is from here, and it cannot be answered without
   something known to measure against. */
.pin.mark::after{background:var(--page);border:2px solid var(--ink)}
.pin.mark .pinlabel{background:var(--page);color:var(--ink);border:1px solid var(--ink);
  font-weight:400;font-style:italic}
.pinlabel{position:absolute;left:30px;top:50%;transform:translateY(-50%);
  white-space:nowrap;font-size:14px;font-weight:700;line-height:1.2;
  padding:3px 7px;background:var(--pine);color:var(--onpine);pointer-events:none}
.pin.flip .pinlabel{left:auto;right:30px}
.pin.on::after{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--ink)}
.pin:focus-visible{outline:none}
.pin:focus-visible::after{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--flag)}
@media (hover:hover) and (pointer:fine){
  .pin:hover::after{box-shadow:0 0 0 2px var(--page),0 0 0 3px var(--turf)}
}
.plan .pt.sel .dot{stroke:var(--ink);stroke-width:.5px}
.plan .pt.sel text{font-weight:700}

/* the card the tap opens */
.pincard{margin-top:12px;padding:14px 16px;background:var(--page);
  border:1px solid var(--rule);border-left:4px solid var(--ink);max-width:660px}
.pincard .tiny{margin:2px 0 0}
.pincard .vb{margin-top:8px}
.pincard .hrs,.pincard .hrs.two{flex:none;text-align:left;justify-content:flex-start;margin-top:8px}
.pinacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pinacts .btn{text-decoration:none}

/* a row in the list is a way of picking a point, so it has to look like one */
.plink{display:block;width:100%;text-align:left;background:none;border:none;
  padding:0;min-height:32px}
.plink .vtop{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
@media (hover:hover) and (pointer:fine){ .plink:hover .vn{text-decoration:underline} }
.vrow.picked{background:var(--page);box-shadow:inset 3px 0 0 var(--ink);padding-left:10px}
.plan .pt text{font-family:var(--serif);fill:var(--ink);
  paint-order:stroke;stroke:var(--page);stroke-width:.9px;stroke-linejoin:round}
.plan .pt.on.c-core circle,.dotk.c-core{fill:var(--ink);background:var(--pine)}
.plan .pt.on.c-stay circle,.dotk.c-stay{fill:var(--turf);background:var(--turf)}
.plan .pt.on.c-eat  circle,.dotk.c-eat {fill:var(--gold);background:var(--gold)}
.plan .pt.on.c-play circle,.dotk.c-play{fill:var(--green);background:var(--green)}
.plan .pt.on.c-shore circle,.dotk.c-shore{fill:var(--flag);background:var(--flag)}
.dotk{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  position:relative;top:-1px}
.plist .vrow{padding:9px 2px}
.plist .vn{font-size:16px}

/* --- spa --- */

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
.ticks{margin:0;padding:0;list-style:none}
.ticks li{position:relative;padding:4px 0 4px 22px;font-size:16px;border-bottom:1px solid var(--hair)}
.ticks li::before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:700}
.ticks.paid li::before{content:'+';color:var(--gold);font-weight:700}

/* --- the window a place opens --- */

.venuemodal{max-width:520px;text-align:left}
.venuemodal h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:6px 0 0}
.venuemodal .minihead{margin:16px 0 4px}
.venuemodal .hrs,.venuemodal .hrs.two{flex:none;text-align:left;justify-content:flex-start}
.venuemodal .acts{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.venuemodal .acts .btn{text-decoration:none;display:inline-flex;align-items:center}
.hm-eye.cover{color:var(--green)}

/* --- the hotel's own details, and the group's notes --- */

.addr{margin-top:8px;padding:14px 16px;background:var(--page);border:1px solid var(--rule);
  max-width:420px;font-size:16px}
.addr p{margin:0 0 10px}
.addr p:last-child{margin-bottom:0}

.rnote{margin-top:28px;padding-top:4px;border-top:2px solid var(--ink)}
.rnote textarea{width:100%;max-width:70ch;resize:vertical;padding:10px 12px;
  background:var(--page);border:1px solid var(--rule);color:var(--ink);line-height:1.5}
.rnote .said{margin:6px 0 0;max-width:70ch;font-size:16px;white-space:pre-wrap}
.rnote .tiny{margin:6px 0 0;max-width:70ch}

@media (max-width:820px){
  /* the hours come out from beside the name and sit under it, where there is
     room for them — the two-season form is far too wide to keep in a column */
  .vrow{flex-wrap:wrap;gap:6px}
  .hrs,.hrs.two{flex:1 1 100%;text-align:left;justify-content:flex-start}
  .hrs.two{gap:22px}
  .twocol{grid-template-columns:1fr;gap:4px}
  .vgrid{grid-template-columns:1fr 1fr;gap:8px}
  .vcard{padding:10px 12px}
  .vn{font-size:17px}
}
@media (max-width:420px){
  .vgrid{grid-template-columns:1fr}
}

/* ---------------- which bar is seen ----------------

   Last word in the stylesheet on purpose. The phone rules further up this
   file were written for a strip of ten tabs and still set it to a grid at
   820px; at equal specificity the later rule wins, so this has to come after
   everything else or the strip reappears under the bar. */
@media (max-width:699px){
  .tabs{display:none}
  .tabbar{
    display:grid;grid-template-columns:repeat(6,1fr);
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    transform:translateY(var(--barshift,0px));
    background:var(--page);border-top:1px solid var(--rule);
    box-shadow:0 -6px 20px rgba(29,46,33,.07);
    padding:7px max(6px,env(safe-area-inset-left,0px)) calc(7px + env(safe-area-inset-bottom,0px))
            max(6px,env(safe-area-inset-right,0px));
  }
  /* ---- THE PAGE, AND THE BAR IT ENDS AT ----

     The page has to end ABOVE the bar, not behind it, and there are three
     separate ways it can fail to:

     1. The last line of the page lands under the bar. That is padding, and
        it was already here — but it was a hair under what the bar needs
        once the gold rule is counted, so the final line sat on the bar
        rather than clear of it.
     2. Something SCROLLED into view lands under the bar — a focused field, a
        hole brought into reach, an anchor. The browser only knows to stop
        short if it is told how much of the bottom is spoken for, which is
        what scroll-padding is for and what was missing entirely.
     3. Nothing says the page CONTINUES under the bar, so a row cut in half
        by the bar's edge reads as a row that has been chopped off rather
        than one that is scrolling past. A short fade of the paper, just
        above the ink, makes it dissolve instead. */
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  /* Both rails declared once, in the one place a browser reads when it has
     to put something on screen for you: the bar at the foot, and the strip
     that takes over from the nameplate at the head. */
  html{scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
       scroll-padding-top:calc(52px + env(safe-area-inset-top,0px))}
  /* Scoring parks a second bar above the first one, so the foot is worth
     twice as much there and anything scrolled into reach has to stop
     twice as early. */
  /* Scoring parks a second bar above the first one and a second band below
     the strip, so both rails are worth about twice as much there. */
  html:has(.page.scoring){scroll-padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));
       scroll-padding-top:calc(156px + env(safe-area-inset-top,0px))}
  /* The strip is only ever here, and only once the plate has gone. */
  .topstrip{display:flex}
  html.up .topstrip{transform:none}

  /* ---- the games, as a band of pine ----
     Edge to edge: it is furniture, and furniture that stops short of the
     glass is a panel. The negative margin is the page gutter, given back. */
  /* Air above it, or the masthead's rule — which stops at the page gutter —
     reads as a short underline lying on top of a band that does not. */
  .gamesbar{margin:14px calc(clamp(14px,3vw,26px) * -1) 0;border-bottom:0;
    background:var(--pine);box-shadow:0 4px 12px rgba(16,22,17,.14)}
  .gamesbar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:var(--gold-up)}
  /* The last name must not read as sliced off, so the band darkens into its
     own right edge. It sits on the WRAPPER, which does not scroll. */
  .gamesbar::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30px;
    pointer-events:none;background:linear-gradient(to right,rgba(29,46,33,0),var(--ink))}
  .btabs.games{gap:0;padding:0;scroll-padding-left:14px}
  /* A band a thumb lands on, not a caption: 44 points tall all in. */
  .btabs.games .btab{padding:15px 13px 14px;color:var(--sage-up);
    border-bottom:0;margin-bottom:0}
  .btabs.games .btab:first-child{padding-left:max(15px,env(safe-area-inset-left,0px))}
  .btabs.games .btab:last-child{padding-right:34px}
  .btabs.games .btab.home{color:var(--gold-up)}
  .btabs.games .btab.on{color:var(--onpine)}
  /* The live game's own mark, on the edge that faces the page. It has to beat
     the band's own gold rule, which it sits on top of — so it is taller than
     that rule and a shade brighter, or the two read as one line. */
  .btabs.games .btab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;
    height:4px;background:#E2C277;border-radius:3px 3px 0 0;z-index:1}
  .btabs.games .btab.home.on::after{left:max(15px,env(safe-area-inset-left,0px))}
  .btabs.games .btab:focus-visible{outline:2px solid var(--gold-up);outline-offset:-3px}

  /* ================= SCORING, ON A PHONE =================
   *
   * The screen was 3,738 points tall and the four golfers you came to score
   * were in the middle of it — under a title, a lede, two lanes, a full-page
   * diagram, four round cards, three group chips and eighteen hole cells —
   * with the Save button somewhere off the bottom of the glass.
   *
   * Both ends are nailed down now. The hole you are standing on and the
   * eighteen you can move to STICK to the top; Save is FIXED at the foot and
   * never leaves. Everything between them is the card.
   *
   * `display:contents` on the two wrappers is what makes the sticking work:
   * it takes their boxes out of the layout so the head is a child of the
   * page itself, and a sticky element can only stick inside its parent's
   * box. Left inside .entryleft it would stick to a box a hundred points
   * tall and then slide away with it.
   */
  .entrytop,.entryleft{display:contents}
  .entrytop .rcards,.entrytop .grouprow,.entrytop .cside{display:none}
  .holehead{display:none}                 /* the head above says all of it */

  /* A button sizes itself to its words however it is displayed, so the
     width is spelled out: the page, plus the gutter it is reaching past
     on either side. */
  /* The screen's job is the card. The paragraph under the title explains
     what gross and net mean, which is worth a phone's height once and not
     on every hole, and the wider screens keep it. */
  .page.scoring > .lede{display:none}
  /* the hole first, the rows, then the games — one column, in that order */
  /* stretch, spelled out: the base rule aligns the two columns to the start,
     and in a column flex box that means an item is as wide as its widest
     content — the scorecard table, 560 points, off the side of the page */
  .entrygrid{display:flex;flex-direction:column;align-items:stretch;gap:0;margin-top:0}
  .egl{width:100%;min-width:0}
  .egr{display:contents}
  /* A definite width, spelled out. As an item of a column flex box the
     plate's height is read off its aspect ratio BEFORE it is stretched,
     from a content width of nothing — every child is positioned — so it
     came out nought by nought. */
  .egr .holeplate{order:-1;aspect-ratio:7/5;margin:13px 0 0;width:100%;flex:0 0 auto}
  .side-b,.side-g{order:1}
  .side-b{margin-top:26px}
  .page.scoring > .setline{border-radius:0;border-left:0;border-right:0;background:var(--sunk);padding:11px 15px}
  /* the calendar's plate, tighter */
  .calplate{padding:14px 15px 15px}
  .calplate .cp-art{width:250px;right:-52px;top:-34px}
  .cp-dn{font-size:28px}
  /* The Titanic: the photograph runs edge to edge between the strip and
     the index, which is both pine, and the names on the index are short. */
  .rhero.band{margin:0 calc(clamp(14px,3vw,26px) * -1);border-radius:0}
  .rhero.band img{height:172px}
  .rhero.band .head{font-size:24px}
  .rhero.band .wx-t{font-size:26px}
  .rhero.band .sky.big{width:26px;height:26px}
  .rhero.band figcaption .pl{display:none}
  .rhero.band .rt-words{max-width:60%}
  .rhero.band .wx.cold .wx-cold{max-width:120px;font-size:10px}
  .rhero.band + .gamesbar{margin-top:0}
  .btabs.rt .btab .lg{display:none}
  .btabs.rt .btab .sm{display:inline}
  .vcard .vwhen{max-width:40%;font-size:13px}
  .setline{margin-left:calc(clamp(14px,3vw,26px) * -1);margin-right:calc(clamp(14px,3vw,26px) * -1);
    width:calc(100% + clamp(14px,3vw,26px) * 2)}

  /* Above the save bar, deliberately. Near the top of the page the band
     has not started sticking yet and still sits in the flow, which can put
     it behind a bar that is nailed to the foot. A header you cannot tap is
     not a header, so the band wins the stack and the bar slides under. */
  /* It stops under the strip, not behind it. Stuck at zero the hole number
     and the par went under the ink and the band became a bare row of
     numbers with nothing to say which hole was lit. */
  .entryhd{display:block;order:0;position:sticky;z-index:31;border-radius:0;
    top:calc(49px + env(safe-area-inset-top,0px));
    background:var(--pine);color:var(--onpine);padding:9px 15px 0;
    margin:0 calc(clamp(14px,3vw,26px) * -1);
    border-bottom:2px solid var(--gold-up);box-shadow:0 5px 14px rgba(16,22,17,.2)}
  .ehd-facts{display:flex;align-items:baseline;gap:10px}
  .ehd-n{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .ehd-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-up);
    font-weight:700;padding-bottom:2px}
  .ehd-m{margin-left:auto;text-align:right;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--sage-up);font-weight:700;line-height:1.5}
  .ehd-m b{display:block;color:var(--onpine)}
  /* The eighteen, as a ribbon on the band: one row, not two, and small
     enough that a dozen are on the glass at once. */
  .entryhd .scroller{margin:8px 0 0;overflow-x:auto}
  .entryhd .hstrip{display:flex;gap:4px;min-width:0;padding-bottom:9px}
  /* Forty points tall, because a thumb has to hit it on a moving buggy.
     Narrow is fine — it is a number — but short is not. */
  .entryhd .hstrip .hcell{flex:0 0 auto;width:34px;min-width:0;min-height:40px;padding:0;
    border-radius:7px;border:1px solid rgba(255,255,255,.2);background:none;
    color:var(--sage-up);display:grid;place-items:center}
  .entryhd .hstrip .hcell .p{display:none}
  .entryhd .hstrip .hcell .n{font-size:12px;font-weight:600}
  .entryhd .hstrip .hcell.saved{background:rgba(255,255,255,.14);border-color:transparent;color:var(--onpine)}
  .entryhd .hstrip .hcell.marked{position:relative}
  .entryhd .hstrip .hcell.marked::after{content:"";position:absolute;top:-2px;right:-2px;
    width:7px;height:7px;border-radius:50%;background:var(--flag)}
  .entryhd .hstrip .hcell.on{background:#E2C277;border-color:#E2C277;color:#1D2E21}
  .entryhd .hstrip .hcell.on .n{font-weight:700}

  /* ---- Save, nailed to the foot ----
     It was a banner in the middle of a very long page. It is the one control
     you need on every hole, so it never leaves the glass. */
  /* top:auto undoes the sticky `top:0` the wider rule above sets. Left in,
     a fixed box pinned top AND bottom stretches the whole glass and eats
     every tap on the page behind it. */
  .savebar{position:fixed;left:0;right:0;top:auto;transform:none;width:auto;z-index:30;margin:0;
    bottom:calc(64px + env(safe-area-inset-bottom,0px));
    padding:9px max(15px,env(safe-area-inset-left,0px)) 10px max(15px,env(safe-area-inset-right,0px));
    background:var(--page);border:0;border-top:1px solid var(--rule);border-radius:0;
    box-shadow:0 -5px 14px rgba(16,22,17,.12)}
  .savebar.dirty{background:#F3EBD6;border-top-color:var(--gold-up)}
  /* My round's bar walks the holes: back is a glyph, on is a word. */
  .savebar.mine .btn.ghost{min-width:44px;padding:9px 12px;font-size:18px}
  /* and the four round cards, which the line above stands for */
  .page.scoring > .rcards{display:none}
  /* One row, not three. A bar nailed to the foot of a phone spends the
     screen it covers, so it says the hole, offers the one button that
     matters and keeps the rest to a word. */
  .savebar .sv{flex:1 1 86px}
  .savebar .sv b{font-size:13.5px;line-height:1.25;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .savebar .sv span{display:block;font-size:11px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .savebar .btn{flex:0 0 auto;min-height:40px;padding:9px 13px;font-size:13px}
  /* "What happened?" is the full question the sheet answers and the label a
     screen reader still hears; on the glass it is one word and a count. */
  .savebar .markbtn{font-size:0}
  .savebar .markbtn::before{content:"Marks";font-size:13px}
  .savebar .markbtn .ct{font-size:11px}
  /* and the page keeps the room it stands in */
  .page.scoring{padding-bottom:78px}
  .tabbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:28px;
    pointer-events:none;background:linear-gradient(to top,var(--paper),rgba(227,219,203,0));
    opacity:1;transition:opacity .18s ease}
  /* At the foot of the page there is nothing left to pass under, so the fade
     and the lift go, and the bar sits flat on the end of the book. */
  html.docend .tabbar::before{opacity:0}
  html.docend .tabbar{box-shadow:0 -2px 8px rgba(29,46,33,.10)}
  /* A window is over everything, the bar included. */
  .scrim{z-index:60}
}

/* ---------------- the scoreboard ----------------

   The bar goes dark and the live tab lights up, the way a scoreboard marks
   the hole being played. The book itself stays cream: the bar is the frame
   around it, not a second surface competing with it.

   One rule throughout — the gold line always faces the page. Along the
   bottom of a phone that means on top of the bar; along the top of a tablet
   or a laptop it means underneath the strip. The live tab carries the same
   gold on the same edge, so the mark and the rule read as one thing. */
.tabs{
  background:var(--pine);
  border-bottom:3px solid var(--gold-up);
  padding:0;gap:0;align-items:stretch;
}
.tab{
  background:none;border:0;border-radius:0;color:var(--sage-up);
  padding:12px 18px;position:relative;
}
.tab[aria-current="page"]{background:none;border:0;color:var(--onpine);font-weight:700}
/* the live tab's own mark, on the edge that faces the page */
.tab[aria-current="page"]::after{
  content:"";position:absolute;left:14%;right:14%;bottom:0;height:3px;
  background:var(--gold-up);border-radius:3px 3px 0 0;
}
@media (hover:hover) and (pointer:fine){
  .tab:hover{color:var(--onpine);background:rgba(255,255,255,.06)}
  .tab[aria-current="page"]:hover{background:rgba(255,255,255,.06)}
}
.tab:focus-visible{outline:2px solid var(--gold-up);outline-offset:-3px}
/* The one tab that names a place keeps its capitals, in the gold that works
   on the ink rather than the one that works on paper. */
.tab.named{color:var(--gold-up)}
.tab.named[aria-current="page"]{color:var(--onpine)}
@media (hover:hover) and (pointer:fine){ .tab.named:hover{color:var(--onpine)} }

/* ---- the cover, on a phone ----
   The picture runs from the top of the glass, so the nameplate sits on it:
   cream, with the crest inverted as it is on the strip, and the rule under
   it gone. The words of the page follow lower down the same sheet. */
@media (max-width:699px){
  .wrap.cover .masthead,.wrap.cover .dateline,.wrap.cover .loadbar{position:relative;z-index:2}
  .wrap.cover .masthead h1{color:var(--onpine);text-shadow:0 1px 8px rgba(0,0,0,.45)}
  .wrap.cover .crestbtn img{filter:invert(1);opacity:.95}
  .wrap.cover .dial{color:var(--onpine)}
  .wrap.cover .dial.free{color:var(--gold-up)}
  .wrap.cover .dial.shut{color:var(--sage-up)}
  .wrap.cover .dial.in{color:var(--onpine)}
  .wrap.cover .dial-ct{box-shadow:0 0 0 2px var(--ink)}
  .wrap.cover .dateline{color:var(--sage-up)}
  .wrap.cover .dateline .hot{color:#E2C277}
  .wrap.cover .dateline span+span::before{color:rgba(238,232,213,.4)}
  .wrap.cover .rule-heavy{border-color:transparent}
  .coverin{min-height:214px;padding:6px 0 16px}
  .coverin .today-title{font-size:34px;max-width:none}
  .coverbg{left:calc(clamp(14px,3vw,26px) * -1);right:calc(clamp(14px,3vw,26px) * -1)}
  .nowplate{margin:0 calc(clamp(14px,3vw,26px) * -1)}
  /* dark enough at the head for the nameplate and the dateline to read on
     a sky, light through the middle, pine at the foot for the words */
  .coverbg::after{background:linear-gradient(to bottom,rgba(16,22,17,.74) 0,rgba(16,22,17,.5) 20%,
    rgba(16,22,17,.14) 40%,rgba(16,22,17,.5) 64%,rgba(16,22,17,.97) 100%)}
  .nowplate{padding:16px clamp(14px,3vw,26px) 18px;gap:16px}
  .ring{width:108px;height:108px}
  .np-big{font-size:22px}
  .tsec{margin-top:20px}

/* ---------------- the pickers ----------------

.pk{position:relative;display:block;min-width:0}

/* ---- the window, the sheet and the tiles ---- */

/* B: the sheet */

/* ---------------- the bar, on an iPad ----------------

   A tablet is held like a big phone, and a thumb finds the foot of the glass
   long before it reaches a strip at the top. So on a tablet the five tabs
   move to the same dark bar a phone has, along the bottom, and the strip at
   the head goes. The page above them is the tablet's own layout, unchanged.

   The device decides it, not the pointer: app.js marks the page `tablet` on
   an iPad (with or without a trackpad or keyboard attached, and in the
   "desktop site" mode where it calls itself a Mac) and on an Android tablet.
   A laptop window the same size keeps the strip, where a mouse goes looking.
   Everything that sits at the foot of a tablet's screen — Save, the keypad,
   the how'd-it-feel card — stands on the bar rather than behind it. */
@media (min-width:700px) and (max-width:1400px){
  html.tablet{--barh:calc(70px + env(safe-area-inset-bottom,0px))}
  html.tablet .tabs{display:none}
  html.tablet .tabbar{
    display:grid;grid-template-columns:repeat(6,1fr);
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--pine);border-top:3px solid var(--gold-up);
    box-shadow:0 -8px 24px rgba(29,46,33,.22);
    /* six tabs across a phone's width, centred, not spread over a tablet's */
    padding:8px max(12px,env(safe-area-inset-right,0px),calc(50% - 330px)) calc(8px + env(safe-area-inset-bottom,0px))
            max(12px,env(safe-area-inset-left,0px),calc(50% - 330px));
  }
  html.tablet .navbtn{min-height:52px}
  html.tablet .navbtn .ic{width:26px;height:26px}
  html.tablet .navbtn .lb{font-size:12.5px}
  html.tablet .tabbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:28px;
    pointer-events:none;background:linear-gradient(to top,var(--paper),rgba(227,219,203,0));
    opacity:1;transition:opacity .18s ease}
  html.tablet.docend .tabbar::before{opacity:0}
  html.tablet.docend .tabbar{box-shadow:0 -2px 8px rgba(29,46,33,.10)}
  /* the page ends above the bar, and nothing scrolled into reach stops under it */
  html.tablet .wrap{padding-bottom:calc(var(--barh) + 30px)}
  html.tablet{scroll-padding-bottom:calc(var(--barh) + 16px)}
  html.tablet:has(.page.scoring){scroll-padding-bottom:calc(var(--barh) + 110px)}
  /* standing on the bar */
  html.tablet .savebar{bottom:var(--barh)}
  html.tablet .keypad{bottom:calc(var(--barh) + 118px)}
  html.tablet .feelbar{bottom:calc(var(--barh) + 22px)}
  html.tablet:has(.page.scoring) .feelbar{bottom:calc(var(--barh) + 96px)}
}

/* ---------------- the photos of the week ----------------
   Two albums on one switch, a photo of the day over them, square tiles that
   carry their hole, and the photo itself full screen with its hearts. */
.pg-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--page);border-radius:12px;padding:3px;margin:14px 0 4px;
  box-shadow:inset 0 0 0 1px var(--rule);max-width:560px}
.pg-seg button{border:0;background:none;font:inherit;color:var(--ink);border-radius:9px;padding:9px 6px;text-align:center;font-weight:600;
  font-size:15px;display:grid;gap:1px;cursor:pointer;min-height:48px}
.pg-seg button small{font-weight:400;font-size:12px;color:var(--turf)}
.pg-seg button.on{background:var(--pine);color:var(--onpine)}
.pg-seg button.on small{color:var(--sage-up)}
.pg-sec{display:grid;gap:8px;margin-top:18px}
.pg-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:5px}
.pg-h b{font-size:18px}
.pg-h span{font-size:12.5px;color:var(--turf);text-align:right}
.pg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.pg-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pg-grid.two.odd > .pg-t:first-child{grid-column:1/-1;aspect-ratio:2/1}
@media (min-width:700px){ .pg-grid{grid-template-columns:repeat(5,minmax(0,1fr))} .pg-grid.two{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pg-grid.two.odd > .pg-t:first-child{grid-column:span 2;aspect-ratio:auto} }
.pg-t{position:relative;display:block;aspect-ratio:1;border:0;padding:0;border-radius:9px;overflow:hidden;background:var(--sunk);cursor:pointer;width:100%}
.pg-t img{width:100%;height:100%;object-fit:cover;display:block}
.pg-t.broken img{opacity:0}
.pg-hb{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;background:rgba(16,22,17,.8);color:#E2C277;border-radius:999px;padding:2px 7px}
.pg-hc{position:absolute;right:6px;top:6px;font-size:11.5px;font-weight:700;background:rgba(16,22,17,.75);color:#fff;border-radius:999px;padding:2px 7px}
.pg-hc.mine{color:#E2C277}
.pg-by{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 5px;font-size:11.5px;color:#fff;text-align:left;
  background:linear-gradient(transparent,rgba(10,14,11,.78));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-empty{margin:18px 0 0;color:var(--turf);font-style:italic}
.pg-note{margin:22px 0 80px;font-size:13.5px;color:var(--turf)}
.pg-potd{position:relative;display:block;width:100%;margin:12px 0 0;padding:0;border:0;border-radius:16px;overflow:hidden;height:clamp(230px,42vw,380px);
  background:var(--pine);cursor:pointer;text-align:left}
.pg-potd img{width:100%;height:100%;object-fit:cover;display:block}
.pg-potd::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(10,14,11,.85))}
.pg-pw{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;display:grid;gap:3px}
.pg-pw .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#E2C277;font-weight:700}
.pg-pw b{font-size:22px;line-height:1.15}
.pg-pw small{font-size:13px;color:#E8E1C9}
.pg-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:35;
  display:flex;align-items:center;gap:8px;background:var(--pine);color:var(--onpine);border:1.5px solid var(--gold-up);border-radius:999px;
  padding:12px 17px 12px 14px;font:inherit;font-weight:600;font-size:15px;box-shadow:0 8px 22px rgba(16,22,17,.35);cursor:pointer;min-height:48px}

@media (min-width:700px){ .pg-fab{bottom:28px} }
@media (min-width:700px) and (max-width:1400px){ html.tablet .pg-fab{bottom:calc(var(--barh) + 22px)} }
/* full screen */

/* ---------------- the chat ----------------
   One room per round and one for the trip, the score pinned over it, the
   box to post with straight under the score, newest first. The book's own
   moments are cards; people are speech bubbles. */
.ch-rooms{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 4px;padding-bottom:2px}
.ch-rooms::-webkit-scrollbar{display:none}
.ch-rooms button{flex:0 0 auto;display:grid;gap:1px;text-align:left;font:inherit;font-weight:600;font-size:15px;color:var(--ink);
  background:var(--page);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:12px;padding:8px 13px;min-height:48px;cursor:pointer}
.ch-rooms button small{font-weight:400;font-size:12px;color:var(--turf)}
.ch-rooms button.on{background:var(--pine);color:var(--onpine);box-shadow:none}
.ch-rooms button.on small{color:var(--sage-up)}
.ch-plate{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--pine);color:var(--onpine);border-radius:14px;
  padding:12px 15px;margin-top:10px;border-bottom:3px solid var(--gold-up)}
.ch-plate span{display:grid;gap:2px;font-size:14px;color:#D9DFD3}
.ch-plate b{font-size:16px;color:var(--onpine)}
.ch-plate em{font-style:normal;font-size:30px;font-weight:700;color:#E2C277;line-height:1}
.ch-post{display:grid;gap:6px;margin:12px 0 4px}
.ch-box{min-width:0;display:flex;align-items:center;gap:8px;background:var(--page);border-radius:999px;padding:5px 5px 5px 6px;box-shadow:inset 0 0 0 1px var(--rule)}
.ch-box input{flex:1;min-width:0;width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:8px 4px;outline:none}
.ch-box .btn{border-radius:999px}
.ch-as{justify-self:start;background:none;border:0;font:inherit;font-size:13px;color:var(--turf);padding:4px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ch-re{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#F3E6CF;border-radius:10px;padding:7px 8px 7px 12px;font-size:13.5px;color:var(--gold)}
.ch-re b{color:var(--ink);font-weight:600}
.ch-re button{background:none;border:0;font-size:16px;color:var(--gold);width:36px;height:36px;cursor:pointer}
.ch-feed{display:grid;gap:10px;margin-top:10px}
.ch-av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--sunk);color:var(--ink);letter-spacing:.02em}
.ch-av.g{background:var(--pine);color:#E2C277}
.ch-msg{display:flex;gap:9px;align-items:flex-start}
.ch-bub{flex:1;min-width:0;background:var(--page);border-radius:4px 14px 14px 14px;padding:8px 12px 9px;box-shadow:0 0 0 .5px var(--shadow)}
.ch-n{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-weight:700;font-size:14.5px}
.ch-who{white-space:nowrap}
.ch-n small{font-weight:400;font-size:12px;color:var(--turf);white-space:nowrap}
.ch-rm{margin-left:auto;background:none;border:0;font:inherit;font-size:12px;color:var(--flag);cursor:pointer;padding:2px 0}
.ch-bub p{margin:2px 0 0;font-size:15.5px;line-height:1.4;overflow-wrap:anywhere}
.ch-rx{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ch-rx button{font:inherit;font-size:14px;background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:999px;
  padding:4px 10px;min-height:34px;cursor:pointer;color:var(--ink)}
.ch-rx button b{font-size:12.5px}
.ch-rx button.on{background:var(--pine);color:#E2C277;box-shadow:none}
.ch-ev{background:var(--page);border-radius:14px;padding:12px 13px;box-shadow:0 0 0 .5px var(--shadow);border-left:4px solid var(--rule)}
.ch-ev.good{border-left-color:#2F7A4A} .ch-ev.bad{border-left-color:var(--flag)} .ch-ev.mid{border-left-color:var(--gold-up)}
.ch-evt{display:flex;gap:11px;align-items:center}

.ch-big.water,.ch-big.ob,.ch-big.putt3{background:#F2DDD6;color:var(--flag)}
.ch-big.shot{background:#F3E6CF;color:var(--gold)}
.ch-big.turn,.ch-big.done{background:var(--pine);color:#E2C277;font-size:16px}
.ch-evw{display:grid;gap:1px;min-width:0}
.ch-k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--turf);font-weight:700}
.ch-evw b{font-size:16px;line-height:1.25}
.ch-evw > span:last-child{font-size:13px;color:var(--turf)}
.ch-hks{display:grid;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--hair)}
.ch-msg.hk .ch-av{width:26px;height:26px;font-size:10px}
.ch-msg.hk .ch-bub{background:var(--paper);box-shadow:none;padding:6px 10px}
.ch-msg.hk .ch-bub p{font-size:14.5px}
.ch-hb{margin-top:8px;background:none;border:0;font:inherit;font-size:13.5px;font-weight:600;color:var(--green);cursor:pointer;padding:6px 0;min-height:34px}

/* who are you */
.who-g{display:grid;gap:6px;margin-top:12px}

   Kalshi's screens in the book's own colours: a chance in big type, Yes in
   green and No in brick, the price in cents of a beer. */
.xm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}

.xm-st span{color:var(--turf)} .xm-st em{font-style:normal;font-weight:700}
.xm-back{display:inline-flex;align-items:center;gap:6px;background:var(--page);border:1px solid var(--rule);border-radius:999px;font:inherit;font-size:15.5px;font-weight:700;
  color:var(--ink);padding:9px 16px 9px 12px;margin:12px 0 4px;cursor:pointer;min-height:44px}
.xm-page{display:grid;gap:12px;padding-bottom:30px}
.xm-eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--turf);font-weight:700}
.xm-h{margin:0;font-size:23px;line-height:1.2}
.xm-h3{margin:0;font-size:17px}
