  padding:12px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.turnmodal .cupbar .pts{font-size:34px}
.turnmodal .cupbar .vs{font-size:16px}
.tn-cupnote{margin:8px 0 0;font-size:13px;color:var(--turf);text-align:center}

.tn-h{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--turf);
  font-weight:700;margin:18px 0 0;border-top:1px solid var(--rule);padding-top:10px}
.tn-rows{margin-top:4px}
.tn-row{display:flex;align-items:baseline;gap:10px;padding:7px 8px;border-bottom:1px solid var(--hair)}
.tn-row:last-child{border-bottom:none}
.tn-row .p{width:20px;color:var(--turf);font-size:13px;flex:0 0 auto}
.tn-row .w{flex:1 1 auto;min-width:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.tn-row .w small{display:block;font-size:12px;font-weight:400;color:var(--turf)}
.tn-row .w em{font-style:normal;font-size:12px;font-weight:400;color:var(--turf)}
.tn-row .n{flex:0 0 auto;text-align:right;font-size:17px;font-weight:700}
.tn-row .n small{display:block;font-size:11px;font-weight:400;color:var(--turf)}
/* your own group, found without reading a name */
.tn-row.me{background:var(--sunk);box-shadow:inset 3px 0 0 var(--green);border-radius:2px}
.tn-field{border-bottom:1px solid var(--rule)}
.turnmodal .acts{justify-content:center;margin-top:16px}

/* ---- the three that get forgotten ----
   Gold-topped rather than red: nothing has gone wrong, the hole is saved,
   and a red rule over a saved hole reads as a refusal. */
.bbbmodal{}
.bbbmodal .hm-eye{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--turf)}
.bbbmodal h3{color:var(--green)}

/* ---- the finish window ----
   The crest, glowing, and one question. Ported straight from the rendition
   that was approved: a gold wash behind the crest breathing on a 2.6s cycle,
   the crest lifting 3.5% with it. It is the only window in the book that
   celebrates anything.

   prefers-reduced-motion stops all of it: the halo simply sits there. A
   pulsing window is exactly the thing that setting exists to turn off. */
.finishmodal{--mpad-x:26px;--mpad-y:30px;text-align:center;justify-items:center;gap:0;
  padding:30px 26px 22px;max-width:380px}
.finishmodal .fm-eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--turf);font-weight:700}
.fm-crest{position:relative;width:150px;max-width:54vw;aspect-ratio:1;margin:16px auto 6px;
  display:grid;place-items:center}
.fm-crest img{position:relative;z-index:2;width:100%;height:auto;display:block;
  animation:finishLift 2600ms ease-in-out 8}
/* The swing is the intensity. Both curves travel further in the same 2.6s,
   so the breath is deeper AND moves quicker without the tempo changing —
   a faster cycle at the old amplitude would have read as a flicker. */
.fm-crest .halo{position:absolute;inset:-26%;border-radius:50%;z-index:1;
  background:radial-gradient(circle,rgba(140,107,47,.56) 0%,rgba(140,107,47,.26) 42%,transparent 74%);
  animation:finishBreath 2600ms ease-in-out 8}
/* The trough is what the eye reads as "how gold is it" — it is where the
   wash sits for most of the cycle. Lifted with the peak so the glow stays
   present all the way round rather than only at the top of the breath. */
@keyframes finishBreath{0%,100%{transform:scale(.82);opacity:.66}50%{transform:scale(1.18);opacity:1}}
@keyframes finishLift{0%,100%{transform:scale(.975)}50%{transform:scale(1.065)}}
.finishmodal .fm-q{font-size:29px;margin:6px 0 0;letter-spacing:.01em;color:var(--ink)}
.finishmodal .fm-sub{margin:7px 0 0;font-size:14.5px}
.finishmodal .fm-last{margin:9px 0 0;font-size:14px;color:var(--gold);font-weight:600}
.finishmodal .acts{justify-content:center;margin-top:20px;width:100%}
@media (prefers-reduced-motion:reduce){
  .fm-crest img{animation:none}
  .fm-crest .halo{animation:none;opacity:.8;transform:none}
}

/* The bar's own way in, and the bar after a group has walked off. */
.finishbtn{background:var(--gold);border-color:var(--gold);color:var(--onpine);font-weight:600}
.savebar.done{border-left:3px solid var(--gold);background:var(--sunk)}

/* ---- status foot ---- */
.statusbar{margin-top:44px;border-top:1px solid var(--rule);padding:12px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  font-size:12px;color:var(--turf);line-height:1.4}
.statusbar .dot{width:8px;height:8px;border-radius:50%;background:var(--turf);flex:0 0 auto}
.statusbar .dot.live{background:var(--under)}
.statusbar .dot.err{background:var(--flag)}
.statusbar .dot.wait{background:var(--gold);animation:waitpulse 2s ease-in-out infinite}
@keyframes waitpulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.statusbar .dot.wait{animation:none}}
.statusbar .who::before,.statusbar .build::before{content:"\00B7";padding-right:10px;color:var(--rule)}
.statusbar .build{margin-left:auto}
/* on a phone the foot is two deliberate lines: the connection, then who you are and the build */
@media (max-width:699px){
  .statusbar .st{flex-basis:100%}
  .statusbar .who::before{content:none}
}

/* ---- today ---- */
/* ================= TODAY: THE COVER =================
 *
 * The front page opens on the photograph, with the day and the round set
 * over it the way the recap's front is. The picture is a measured sheet
 * laid UNDER the page (see measureCover): on a phone it runs from the top
 * of the glass, behind the nameplate, and on anything wider from the top
 * of the page, under the index — down to the foot of the words. Then a
 * pine plate carries the one number that matters, the clock to the next
 * tee. The leaders are the Boards' own cards, the day is the Calendar's
 * rows, the privilege is a tap-line.
 */
.page{position:relative}
/* Under the index the picture keeps to the page's width, as the index does;
   on a phone (below) it runs to the glass. */
.coverbg{position:absolute;left:0;right:0;
  top:0;height:0;margin:0;background:var(--pine);overflow:hidden;z-index:0;pointer-events:none}
.coverbg img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block;opacity:.95}
.coverbg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(16,22,17,.97) 0,rgba(16,22,17,.55) 42%,rgba(16,22,17,.1) 78%)}
.coverin{position:relative;z-index:1;min-height:clamp(250px,30vw,380px);display:flex;flex-direction:column;
  justify-content:flex-end;padding:24px 0 18px;color:var(--onpine)}
.today-day{font-size:15px;color:var(--turf)}
.cv-k.today-day{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#E2C277}
.today-title{font-size:clamp(30px,4.6vw,46px);font-weight:700;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.coverin .today-title{color:var(--onpine);margin:6px 0 0;font-size:clamp(32px,4.8vw,54px);line-height:1;
  letter-spacing:-.025em;font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.4);max-width:20ch}
.cv-s{margin:8px 0 0;font-size:15px;color:var(--sage-up)}
.cv-s b{color:var(--onpine);font-weight:600}
/* the clock */
.nowplate{position:relative;z-index:1;margin:0;
  padding:18px clamp(18px,3.4vw,30px) 20px;background:var(--pine);color:var(--onpine);
  display:flex;align-items:center;gap:20px;border-bottom:3px solid var(--gold-up)}
/* The ring fills, in gold, as the gap to the next fixture closes; the clock
   sits inside it. The disc is pine again, so the ring is a line of light. */
.ring{--pct:0%;flex:0 0 auto;width:118px;height:118px;border-radius:50%;position:relative;
  display:grid;place-items:center;
  background:conic-gradient(from 0deg,#E2C277 0%,#E2C277 var(--pct),rgba(159,179,163,.22) var(--pct),rgba(159,179,163,.22) 100%)}
/* Spelled out one stop at a time, with every position carrying a unit: Chrome
   forgives a bare 0 and a doubled stop, Safari throws the whole gradient
   away and the ring comes up blank. */
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--pine)}
.rn{position:relative;text-align:center;line-height:1;padding:0 6px}
.np-big{display:block;font-size:24px;font-weight:900;line-height:1;letter-spacing:-.03em;
  color:#E2C277;white-space:nowrap}
.rn span{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  color:var(--sage-up);margin-top:5px}
.np-w{flex:1 1 auto;min-width:0;padding:2px 0}
.np-k{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  color:var(--sage-up);white-space:nowrap}
.np-t{font-size:17px;font-weight:600;margin-top:6px;line-height:1.25}
.np-w small{display:block;font-size:13px;color:var(--sage-up);margin-top:4px}
/* the two columns */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:start;margin-top:4px}
@media (min-width:900px){
  .today-grid{grid-template-columns:minmax(0,1fr) 360px;gap:44px;margin-top:18px}
  .tg-l{grid-column:1;grid-row:1;min-width:0}
  .tg-r{grid-column:2;grid-row:1;position:sticky;top:16px}
  .today-club{margin-top:0}
  .tg-l .tsec:first-child{margin-top:4px}
}
.today-club{margin-top:16px}
.tg-r .recapwrap{margin-top:8px}

/* ---- the cover on a tablet and a laptop ----
   One rounded sheet under the index: the photograph at two to one with
   the words inset from its edge, the plate under it with a ring and type
   sized for the room, and the columns below held to the same margins. The
   phone keeps its own measures in its own block. */
@media (min-width:700px){
  .coverin{margin-top:14px;min-height:clamp(320px,38vw,500px);
    padding:28px clamp(24px,3vw,40px) 26px}
  .coverbg{border-radius:20px 20px 0 0}
  .cv-k.today-day{font-size:12px}
  .coverin .today-title{font-size:clamp(38px,5vw,60px)}
  .cv-s{font-size:17px;margin-top:10px}
  .nowplate{border-radius:0 0 20px 20px;padding:26px clamp(24px,3vw,40px) 28px;gap:28px}
  .ring{width:148px;height:148px}
  .ring::before{inset:9px}
  .np-big{font-size:30px}
  .rn span{font-size:10px;margin-top:7px}
  .np-k{font-size:11.5px}
  .np-t{font-size:22px;margin-top:8px}
  .np-w small{font-size:15px;margin-top:5px}
  .today-grid{padding:0 clamp(20px,2.6vw,36px);margin-top:26px}
  .tsec{font-size:12px;margin-top:26px}
  .tn{font-size:17px;padding:12px 4px}
  .tn .tn-t{flex-basis:80px;font-size:14px}
  .tn .tn-w small{font-size:14px}
  .priv .setline{font-size:12px;padding:13px 16px}
  .today-club .cc{padding-top:12px;padding-bottom:13px}
  .today-club .cc-t{font-size:11.5px}
  .today-club .cc-n{font-size:19px}
  .today-club .cc-f{font-size:30px}
  .today-club .cc-b,.today-club .cc-none{font-size:13px}
  .today-club .cc-sc{font-size:30px}
  .recapbtn .rb-t{font-size:19px}
  .recapbtn .rb-s{font-size:15px}
}
@media (min-width:1200px){
  .today-grid{grid-template-columns:minmax(0,1fr) 380px;gap:52px}
}
.tsec{display:flex;align-items:baseline;gap:8px;margin:22px 0 6px;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;color:var(--turf)}
.tsec .r{margin-left:auto;font-weight:600;letter-spacing:.06em}
/* the day's lines, as the Calendar draws a day */
.tnlist{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--hair)}
.tn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--hair);padding:10px 2px;font-family:inherit;color:var(--ink);
  font-size:15px;line-height:1.25;cursor:pointer;border-radius:0}
.tn .tn-t{flex:0 0 68px;font-size:12.5px;font-weight:600;color:var(--turf)}
.tn .tn-w{flex:1 1 auto;min-width:0}
.tn .tn-w small{display:block;font-size:12.5px;color:var(--turf);margin-top:2px}
.tn.golf .tn-w{font-weight:700}
.tn.golf .tn-w::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--gold-up);margin-right:7px;vertical-align:1px}
.tn .tn-ch{color:var(--turf);font-size:18px}
.tn:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){ .tn:hover{background:var(--sunk)} }
.tn.none{cursor:default;color:var(--turf);font-style:italic}
/* the privilege, as tap-lines */
.priv .setline{margin-top:0;border-top:0;cursor:default}
.priv .setline:first-of-type{border-top:1px solid var(--rule)}
.priv .setline:hover{background:var(--sunk)}
.priv .pv-by{color:var(--turf);font-weight:600;letter-spacing:.06em}
.priv .pv-sel{margin:10px 0 4px;width:100%}
.priv .pv-note{font-size:13px;color:var(--turf);margin:8px 0 0}

/* ---- course setup ---- */
.ctabs{display:flex;gap:2px;margin-top:18px;flex-wrap:wrap}
.ctab{padding:13px 22px;border:1px solid var(--rule);background:var(--page);color:var(--ink);
  font-size:20px;font-weight:700;min-height:44px;text-align:left}
.ctab span{display:block;font-size:14px;font-weight:400;color:var(--turf);margin-top:2px}
.ctab.on{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.ctab.on span{color:var(--rule)}
.unverified{margin-top:14px;padding:16px;background:var(--flag);color:#FBFAF7;max-width:720px;border-radius:2px}
.unverified .t{font-size:19px;font-weight:700}
.unverified p{font-size:16px;margin:6px 0 0}
.cphoto{margin:16px 0 0;max-width:720px}
.cphoto img{display:block;width:100%;height:220px;object-fit:cover}
.rating{font-size:16px;margin:14px 0 0}
.cgrid{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;margin-top:10px}
.cgrid .scroller{flex:1 1 560px;min-width:0;margin-top:0}
.cside{flex:1 1 320px;max-width:380px;align-self:center}
/* Every hole diagram is 520x736. Saying so reserves the space before the
   image decodes: without it the box collapses to nothing for a frame on each
   redraw, everything below jumps up and then back, and walking hole to hole
   reads as a glitch rather than a step. */
.cside>img{display:block;width:78%;height:auto;margin:0 auto;aspect-ratio:520/736}
.diagram img{aspect-ratio:520/736}
.cfacts{display:flex;gap:18px;align-items:baseline;justify-content:center;margin-top:12px;flex-wrap:wrap}
.cfacts .hn{font-size:22px;font-weight:700}
.cfacts span{font-size:15px}
.cfacts .m{color:var(--turf)}
.cstrip{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:14px}
table.scard{border-collapse:collapse;min-width:560px;width:100%}
table.scard th{text-align:left;font-size:16px;font-weight:400;color:var(--turf);padding:0 18px 8px 0;
  border-bottom:2px solid var(--ink);white-space:nowrap}
table.scard td{padding:9px 18px 9px 0;border-bottom:1px solid var(--hair);vertical-align:middle}
table.scard .holen{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
table.scard .cardval{font-size:17px;font-variant-numeric:tabular-nums}
.cardin{width:74px;padding:5px 4px;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink);
  background:none;border:none;border-bottom:1px dashed var(--rule);border-radius:0;min-height:34px}
.cardin:focus{outline:none;border-bottom:1px solid var(--flag)}
.cardsel{padding:6px 8px;font-size:17px;border:1px solid var(--rule);background:var(--page);
  color:var(--ink);border-radius:2px;min-height:38px}
.cfoot{display:flex;gap:14px;align-items:center;margin-top:14px;padding-bottom:28px;flex-wrap:wrap}
.cfoot span.num{font-size:15px;color:var(--turf)}

/* ---- setup dialog ---- */
.modal.wide{max-width:520px}
.setup-list{display:grid;gap:0;border-top:1px solid var(--rule)}
.setup-item{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--hair)}
.setup-item .tx{flex:1;font-size:15px;line-height:1.45}
.btn.sm{min-height:38px;padding:7px 13px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.setup-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:3px;
  font-size:15px;font-weight:600;min-height:40px;white-space:nowrap;border:1px solid transparent}
.setup-chip.open{background:var(--flag);border-color:var(--flag);color:#FBFAF7}
.setup-chip.open:hover{filter:brightness(1.08)}
.setup-chip .mk{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.24);
  display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.setup-chip .ct{padding:0 7px;border-radius:999px;background:rgba(255,255,255,.24);
  font-variant-numeric:tabular-nums;font-size:14px}
.setup-chip.done{background:var(--page);border-color:var(--rule);color:var(--turf);font-weight:400}
.setup-chip.done .mk{background:none;color:var(--green);font-size:15px}
.setup-chip.done:hover{background:var(--sunk);color:var(--ink)}

/* ================= THE BOARDS =================
 *
 * Three things, in the order a reader wants them: a front page that answers
 * all six games at once, a plate at the head of each board that answers that
 * one, and a table with the gap to the leader in it.
 */

/* ---- the front page ---- */
.bh{margin-top:16px}
.bh-s{font-size:14px;font-weight:400;color:var(--turf);font-style:italic}
.club{display:grid;gap:8px;margin-top:12px}

/* The state words are prefixed on purpose: a bare `.empty` on a card picked
   up the paragraph rule of the same name further up this file, and the three
   games with nothing in them came out two thirds the width of the rest. */
.cc{display:block;width:100%;max-width:none;text-align:left;position:relative;
  background:var(--page);border:1px solid var(--rule);border-radius:14px;
  padding:9px 34px 10px 13px;color:var(--ink);font-family:inherit}
@media (hover:hover) and (pointer:fine){ .cc:hover{background:var(--sunk);border-color:var(--turf)} }
.cc:active{background:var(--sunk)}
.cc:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
/* A game with a round in it carries the gold on its leading edge — the same
   mark the bar and the strip use for the thing that is live. */
.cc--live{border-left:4px solid var(--gold-up);padding-left:11px}
.cc--closed,.cc--empty{opacity:.8}
.cc-t{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--turf);font-weight:700}
.cc-st{margin-left:auto;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.cc-w{display:flex;align-items:flex-end;gap:12px;margin-top:3px}
.cc-n{flex:1 1 auto;min-width:0;font-size:17px;font-weight:700;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-f{flex:0 0 auto;font-size:26px;font-weight:700;line-height:1;letter-spacing:-.01em}
.cc-b{display:block;font-size:11.5px;color:var(--turf);margin-top:2px}
.cc-none{display:block;font-size:14px;color:var(--turf);font-style:italic;margin-top:3px;
  line-height:1.4}
.cc-go{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  color:var(--rule);font-size:21px;font-weight:700;line-height:1}
@media (hover:hover) and (pointer:fine){ .cc:hover .cc-go{color:var(--turf)} }

/* The Cup is the only one of the six with a clock on it, so it leads and it
   is drawn in the pine. */
.cc--cup{background:var(--pine);border-color:var(--pine);color:var(--onpine);padding-top:10px;padding-bottom:12px}
.cc--cup .cc-t{color:var(--sage-up)}
.cc--cup .cc-st{color:var(--gold-up)}
.cc--cup .cc-go{color:var(--sage-up)}
@media (hover:hover) and (pointer:fine){ .cc--cup:hover{background:#243a29;border-color:#243a29} }
/* the Cup on the paper, as the front page draws it */
.cc--cupq .cc-cup svg{border-color:var(--rule)}
.cc--cupq .cc-win{color:var(--gold)}
.cc--cupq .cc-win small{color:var(--turf)}
/* The main event, in pine, at the head of the front page. After the base
   card on purpose: same specificity, and the later rule wins. */
.cc--main{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.cc--main .cc-t{color:var(--sage-up)}
.cc--main .cc-st{color:var(--gold-up)}
.cc--main .cc-b,.cc--main .cc-none{color:var(--sage-up)}
.cc--main .cc-f{color:#E2C277}
.cc-f.pts{color:var(--green)}
.cc--main .cc-f.pts{color:#E2C277}
.cc--main .cc-go{color:var(--sage-up)}
.cc--main.cc--closed,.cc--main.cc--empty{opacity:1}
@media (hover:hover) and (pointer:fine){ .cc--main:hover{background:#243a29;border-color:#243a29} }
.cc-cup{display:flex;align-items:center;gap:9px;margin-top:5px}
.cc-cup svg{flex:0 0 auto;border:1px solid rgba(255,255,255,.26);border-radius:2px}
.cc-sc{font-size:27px;font-weight:700;line-height:1}
.cc-v{color:var(--sage-up);font-size:15px}
.cc-win{margin-left:auto;text-align:right;font-size:19px;font-weight:700;color:var(--gold-up);
  line-height:1.05}
.cc-win small{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--sage-up)}

/* ---- the plate at the head of a board ---- */
.plate{display:block;margin-top:13px;background:var(--pine);color:var(--onpine);
  border-radius:16px;padding:10px 15px 13px;
  box-shadow:0 1px 3px rgba(16,22,17,.12),0 8px 20px rgba(16,22,17,.14)}
.plate.flat{box-shadow:none;background:var(--page);color:var(--ink);border:1px solid var(--rule)}
.pl-t{display:flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--sage-up);font-weight:700}
.plate.flat .pl-t{color:var(--turf)}
.pl-live{margin-left:auto;color:var(--gold-up);letter-spacing:.09em}
.pl-n{display:block;font-size:21px;font-weight:700;line-height:1.18;margin-top:2px}
.pl-n small{font-size:15px;font-weight:400;color:var(--sage-up);padding-left:6px}
.pl-f{display:flex;align-items:flex-end;gap:15px;margin-top:6px}
.pl-big{font-size:42px;font-weight:700;line-height:.95;letter-spacing:-.02em;color:var(--gold-up)}
.plate.flat .pl-big{color:var(--ink)}
.pl-big small{font-size:15px;font-weight:400;color:var(--turf);padding-left:5px;letter-spacing:0}
.pl-sep{width:1px;align-self:stretch;background:rgba(255,255,255,.18);margin:3px 0 4px}
.plate.flat .pl-sep{background:var(--rule)}
.pl-c{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-up);
  padding-bottom:4px;font-weight:700}
.plate.flat .pl-c{color:var(--turf)}
.pl-c b{display:block;font-size:19px;letter-spacing:0;text-transform:none;color:var(--onpine);
  font-weight:700;margin-top:1px}
.plate.flat .pl-c b{color:var(--ink)}
/* The plate carries the under/over colours too, but on pine the gold has to
   do the work the ochre does on paper. */
.plate .pl-big.under{color:var(--gold-up)}
.plate .pl-big.over{color:#D98A7C}
.plate .pl-big.level{color:var(--onpine)}
@media (max-width:420px){
  .pl-n{font-size:19px}
  .pl-big{font-size:36px}
  .pl-f{gap:11px}
}

/* ---- a board that reads like a board ---- */
.bd{margin-top:14px}
.bd.narrow{max-width:520px}
.bdh,.bdr{display:grid;gap:8px;align-items:center;padding:9px 2px}
.bdh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--turf);
  font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bdr{border-bottom:1px solid var(--hair);font-size:16px}
.bdh span:nth-child(n+3),.bdr .n,.bdr .t,.bdr .g{text-align:right}
.bdr .p{color:var(--turf);font-size:13px}
.bdr .w{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdr .n{font-size:14.5px;color:var(--turf)}
.bdr .t{font-size:20px;font-weight:700}
/* The gap is quieter than the total on purpose: the total is the score, the
   gap is the context for it. */
.bdr .g{font-size:13.5px;color:var(--turf)}
/* The leader is marked by a bar and a tint, not by a gradient: a wash that
   fades out over seventy per cent of the row is a stub on a phone and a
   smudge on a laptop. */
.bdr.lead{background:rgba(201,162,83,.13);border-radius:9px;
  margin:0 -8px;padding-left:12px;padding-right:8px;
  box-shadow:inset 3px 0 0 var(--gold-up)}
.bdr.lead .w{font-weight:700}

.bdh.pairs,.bdr.pairs{grid-template-columns:20px minmax(0,1fr) 38px 44px 54px 40px}
.bdh.mvp,.bdr.mvp{grid-template-columns:20px minmax(0,1fr) 36px 36px 42px 52px 38px}
.bdh.bbb,.bdr.bbb{grid-template-columns:20px minmax(0,1fr) 56px 56px}
.bdh.oh,.bdr.oh{grid-template-columns:18px minmax(0,1fr) 34px 40px 52px}
.bd.oh{margin-top:8px}
.bdr.oh{font-size:15px}
.bdr.oh .t{font-size:17px}
@media (max-width:420px){
  .bdh,.bdr{gap:5px}
  .bdr{font-size:15px}
  .bdr .t{font-size:18px}
  .bdh.pairs,.bdr.pairs{grid-template-columns:17px minmax(0,1fr) 30px 38px 46px 34px}
  .bdh.mvp,.bdr.mvp{grid-template-columns:17px minmax(0,1fr) 28px 28px 36px 44px 32px}
  .bdh.oh,.bdr.oh{grid-template-columns:15px minmax(0,1fr) 28px 34px 44px}
  .bdh{font-size:9.5px;letter-spacing:.04em}
}
/* The older .legend sits further down this file and reads right, which is
   right for the caption under a hole's table and wrong under a board. */
.bd + .legend,.hf-body .legend{font-size:13px;color:var(--turf);font-style:italic;margin:10px 0 0;
  max-width:62ch;text-align:left}

/* ---- the hole, which is reference ----
   All of it is still here. It is a page you turn to rather than a page you
   scroll past to reach the answer. */
.holefold{margin-top:22px;border:1px solid var(--rule);border-radius:14px;
  background:var(--page);overflow:hidden}
.holefold summary{display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;
  list-style:none;font-size:15px;color:var(--turf)}
.holefold summary::-webkit-details-marker{display:none}
.holefold summary b{color:var(--ink);font-size:17px;font-weight:700}
.hf-l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:var(--turf)}
.hf-m{font-size:13px;color:var(--turf);min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.hf-ch{margin-left:auto;font-size:19px;font-weight:700;color:var(--turf);
  transition:transform .16s ease}
.holefold[open] .hf-ch{transform:rotate(90deg)}
@media (hover:hover) and (pointer:fine){ .holefold summary:hover{background:var(--sunk)} }
.hf-body{padding:2px 14px 14px;border-top:1px solid var(--hair)}
.hf-body .spread{border-top:0;margin-top:4px}
.hf-body .leaf-l{padding-top:6px}

/* ---- leaderboards ---- */
/* SEVEN NAMES ACROSS A PHONE. "Longest Drive & Closest to the Pin" is a
   sentence, not a tab — so the strip carries the short name on the glass and
   the long one for anything that reads the page, exactly as the bar at the
   foot does. The first is the way back to the front page. */
.btabs{display:flex;gap:7px;overflow-x:auto;align-items:center;margin-top:16px;
  padding-bottom:2px}
.btab{padding:7px 14px;font-size:14.5px;color:var(--turf);white-space:nowrap;
  border:1px solid var(--rule);background:var(--page);border-radius:999px;flex:0 0 auto}
.btab .lg{display:none}
.btab.home{font-weight:700}
@media (hover:hover) and (pointer:fine){ .btab:hover{background:var(--sunk);color:var(--ink)} }
/* A finger has no hover: on a touch screen the state sticks to whatever was
   last tapped, so hover belongs to devices that have one — see above. */
.btab.on{background:var(--pine);border-color:var(--pine);color:var(--onpine);font-weight:700}
@media (hover:hover) and (pointer:fine){ .btab.on:hover{background:var(--pine);color:var(--onpine)} }
.btab:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

/* ================= SWITCHING BETWEEN THE GAMES =================
 *
 * This strip used to be a row of outlined lozenges — a shape the book uses
 * nowhere else, floating on cream paper between a tracked-caps dateline
 * above and a serif headline below, with the seventh name sliced in half at
 * the right edge. Nothing anchored it.
 *
 * It is the same control in two materials, because it is doing the same job
 * in two different places:
 *
 *   On a phone it sits directly under the pine strip at the head, so it is
 *   PINE: a band of the same material as the strip above it and the bar at
 *   the foot, edge to edge, with the live game struck in paper white under
 *   a gold mark. The book is framed in one material, top, middle and foot.
 *
 *   On a tablet or a laptop there is no strip above it and room for all
 *   seven names at once, so it is an INDEX: the names in the small tracked
 *   capitals the dateline and the recap's metarail already use, one hairline
 *   under the lot, a pine mark under the live one. Which is exactly how the
 *   tab strip along the top of a laptop already works.
 *
 * The WRAPPER carries the chrome and the INNER div scrolls, so the thing
 * that stops the last name reading as cut off — a fade, or a rule that
 * carries on — never moves with the names.
 *
 * The resort's own sub-tabs are left as they are on purpose: those are an
 * in-page section switcher under a heading, not a competition switcher at
 * the top of the screen. Different job, different place, different weight.
 */
.gamesbar{position:relative;margin-top:16px}
.btabs.games{gap:0;margin-top:0;padding:0;align-items:stretch}
.btabs.games .btab{border:0;background:none;border-radius:0;flex:0 0 auto;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  position:relative;padding:11px 13px 10px}

/* ---- the index, for anything with room: tablet and laptop ---- */
.gamesbar{border-bottom:1px solid var(--rule)}
.btabs.games{gap:20px;padding:4px 0 0}
.btabs.games .btab{padding:0 0 9px;color:var(--turf);
  border-bottom:2.5px solid transparent;margin-bottom:-1px}
.btabs.games .btab.home{color:var(--gold)}
.btabs.games .btab.on{background:none;color:var(--ink);border-bottom-color:var(--ink)}
@media (hover:hover) and (pointer:fine){
  .btabs.games .btab:hover{background:none;color:var(--ink)}
  .btabs.games .btab.on:hover{background:none;color:var(--ink)}
}
.btabs.games .btab:focus-visible{outline:2px solid var(--flag);outline-offset:3px}
.titlerow{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.titlerow .head{margin-top:22px}

/* Which round the board is reading: a segmented control, not a column of
   slabs. It is a filter on what is already on the screen, so it sits under
   the answer and takes a line, not a panel. */
.roundband{margin-top:14px}
.rounds{display:flex;gap:6px}
.roundpick{flex:1 1 0;min-width:0;padding:7px 8px;border-radius:10px;color:var(--ink);
  border:1px solid var(--rule);background:var(--page);text-align:center;position:relative}
.roundpick b{display:block;font-size:15px;font-weight:700;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roundpick span{display:block;font-size:11.5px;color:var(--turf);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover) and (pointer:fine){ .roundpick:hover{background:var(--sunk)} }
.roundpick.on{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.roundpick.on span{color:var(--sage-up)}
.roundpick.live:not(.on)::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;
  border-radius:50%;background:var(--flag)}
.tt-head{font-size:16px;color:var(--turf)}
.tt-row{display:flex;gap:14px;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--hair);padding:7px 0;max-width:440px;font-size:17px}
.tt-in{width:124px;padding:8px 10px;border:1px solid var(--rule);background:var(--page);color:var(--ink);
  text-align:right;border-radius:2px;min-height:44px;flex:0 0 auto}
.tt-in.read{display:flex;align-items:center;justify-content:flex-end;border-color:transparent;background:none;color:var(--turf)}

/* hour : minute AM/PM — three wheels, one control */
.timepick{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}
.timepick .tsel{width:auto;min-width:0;padding:8px 4px 8px 8px;font-variant-numeric:tabular-nums;
  text-align:center;border-radius:2px}
.timepick .ampm{padding-right:4px}
.timepick .tcolon{color:var(--turf);font-weight:600}
.fx .timepick{flex:0 0 auto}

.rows.tight{border-top:none}
.rows.tight .row{padding:15px 0}
.rows.tight .rowhead{border-bottom:2px solid var(--ink)}
.row .who.plain{font-weight:400;font-size:17px}
.legend{font-size:15px;color:var(--turf);font-style:italic;margin:10px 0 0;text-align:right}
/* The week is the calendar. A day that can be edited holds its fixtures as
   controls rather than as text, so the card grows a little and its rows stop
   being one line. */
.de.edit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 0;
  border-top:1px solid var(--hair)}
.de.edit .fxtitle{flex:1 1 130px;min-width:0;font-size:15px}
.de.edit .field.small{flex:0 0 auto}
.daddb{margin-top:8px;width:100%;font-size:15px;padding:8px 12px}
.teehead{font-size:17px;font-weight:700;margin:22px 0 4px}

.turn{font-size:15px;color:var(--turf);font-style:italic;margin:14px 0 0}

/* ---- save-per-hole ---- */
.savebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:13px 15px;
  border:1px solid var(--rule);background:var(--page);border-radius:3px}
.savebar.dirty{border-left:3px solid var(--flag);background:var(--sunk)}
.savebar .sv{flex:1 1 240px;min-width:0}
.savebar .sv b{display:block;font-size:16px}
.savebar .sv span{font-size:14px;color:var(--turf)}
.padrow.pending{border-color:var(--flag);box-shadow:inset 3px 0 0 var(--flag)}
.padrow .nm .tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;
  background:var(--flag);color:#FBFAF7;vertical-align:2px}
.cell.saved{border-color:var(--pine)}

/* ---- inline name editing ---- */
.nameedit{width:100%;max-width:250px;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);
  background:none;border:none;border-bottom:1px dashed transparent;border-radius:0;padding:2px 0;min-height:32px}
.nameedit:hover{border-bottom-color:var(--rule)}
.nameedit:focus{outline:none;border-bottom-color:var(--flag)}

/* ================= mobile and tablet =================
   Two rules drive everything below: nothing the thumb needs may hide behind a
   sideways scroll, and no form control may be under 16px, which is what makes
   iOS zoom the page on focus and leaves it panned. */

.tab .sm{display:none}

@media (max-width:820px){
  /* the nav wraps instead of scrolling, using the short labels */
  /* Four tabs share the width evenly. Below 700px there is no strip at all —
     the bar is along the bottom — so this is the tablet-and-narrow-laptop
     shape only. */
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;
    overflow-x:visible;touch-action:auto}
  .tab{padding:9px 10px;font-size:16px;min-height:44px;text-align:center}
  .tab .lg{display:none}
  .tab .sm{display:inline}

  /* all eighteen holes on one screen: nine across, two rows */
  .scroller > .hstrip{min-width:0}
  .hstrip{grid-template-columns:repeat(9,1fr);min-width:0;gap:4px}
  .hcell{min-height:48px;padding:6px 2px}
  .hcell .n{font-size:17px}

  /* the stepper row stacks its figures rather than squeezing them */
  .pmain{gap:10px;flex-wrap:nowrap}
  .pwho{flex:1 1 auto;min-width:0}
  .ptile{width:66px;height:56px}

  /* saving stays in reach however long the hole list runs */
  .savebar{position:sticky;top:0;z-index:30;box-shadow:0 6px 16px -10px var(--shadow)}

  /* THE NAMEPLATE, ON A PHONE. Crest, name and the dial on one line — the
     three things that identify the book and the one control that is not a
     destination — then the next tee time on its own line under them. The
     dial is on the far right of the top line, which is the corner a thumb
     reaches last and the eye looks at for a setting on every phone made. */
  .masthead{gap:10px;padding:12px 0 8px;align-items:center}
  .masthead img{width:44px}
  .masthead .crestbtn{order:1}
  /* flex-basis 0, not auto: on auto the name claims the width it wants, the
     dial is pushed onto a line of its own and lands on the left, which is
     the one corner a setting never sits in. */
  .mast-mid{flex:1 1 0;min-width:0;order:2}
  .masthead h1{font-size:20px}
  /* flex-start, not centre: the venue line runs to three lines on a 390pt
     screen, and a dial centred against the block lands beside the DATES
     rather than beside the name it belongs to. */
  .moonbtn{order:3;margin-left:auto;align-self:flex-start}
  .dial{order:4;margin-left:0;align-self:flex-start;width:42px;height:42px}
  .dial-g{width:40px;height:40px}
  /* THE VENUE LINE AND THE TEE-TIME CAPTION BOTH GO. One says where you are
     — which you know, and which The Titanic tab says in full — on three
     lines of a 390-point screen. The other is a caption over a value that
     reads perfectly well on its own. The dateline says what is left of both
     in one line, and says the part that changes. */
  .masthead .sub{display:none}
  .mast-right{display:none}
  .dateline{display:flex;flex-wrap:wrap;align-items:center;
    padding:0 0 9px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--turf);font-weight:700}
  .daystrip{flex-wrap:wrap}
  .dayb{flex:1 1 auto;min-width:56px}
  .rcards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pairgrid{grid-template-columns:1fr;gap:20px}
  .pmem select{flex:0 1 150px}
  .rcard{min-height:56px;padding:9px 14px}
  .rcard b{font-size:17px}
  .cgrid{gap:20px}
  .cside{max-width:none;align-self:auto}
  .btabs{gap:20px}
  .btab{font-size:17px}
  .legend{text-align:left}
}

/* Every tappable thing clears 44px, and every control clears the 16px that
   stops iOS zooming — a zoom is what leaves the page panned sideways. */
@media (max-width:1024px){
  input,select,textarea{font-size:16px}
  .field.small,.fieldset label,.tt-in,.cardin,.cardsel,.nameedit,.fxtime,.fxtitle{font-size:16px}
  /* a square cell plus a 44px floor makes the cell 44 WIDE too, which pushed
     the nine-column strips past the viewport. Height floors, width flexes. */
  .cell{min-height:44px;font-size:16px;aspect-ratio:auto}
  .strip,.cstrip{grid-template-columns:repeat(9,minmax(0,1fr));max-width:none}
  .cside{max-width:none}
  .chip,.mchip,.pchip,.gchip,.tg{min-height:44px;padding:10px 14px;font-size:15px}
  .cardin,.cardsel,.nameedit,.cellin,.pname,.tbtn,.ibtn,.navbtn{min-height:44px}
  .cellin{font-size:16px;width:150px}
  .clearh,.rm,.setup-item .btn{min-height:44px}
  .rule-item summary{padding:18px 0}
  .row a,.lede a,.legend a,.titlerow a,.rule-body a,.sublede a{display:inline-flex;align-items:center;
    min-height:44px;padding:0 2px}
  .chip{gap:8px}
  .chip button{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;
    margin:-8px -6px -8px 0;font-size:18px}
  table.scard td,table.card td{padding-top:12px;padding-bottom:12px}
}

/* A container that still scrolls sideways says so, and snaps as you swipe. */
/* A strip that scrolls sideways should only scroll sideways. Without this a
   swipe across the sub-tabs that drifts a few degrees off level drags the
   whole page up and down under your thumb, which reads as the row being
   loose. pan-x tells the browser: this one pans across, nothing else. */
.scroller,.tabs,.daystrip,.btabs{overscroll-behavior:contain}
.scroller,.daystrip{-webkit-overflow-scrolling:touch}

/* pan-x belongs to the THIN TAB STRIP and nowhere else.
   Applying it to every horizontal scroller was a mistake: the roster table
   sits in one, so a vertical drag anywhere over the roster was refused and
   the page simply would not move — it read as the scrolling sticking at the
   band column, which is where a thumb happens to land. A wide table must let
   the page past; only a row of tabs, which has no vertical meaning at all,
   may keep a gesture to itself.
   -webkit-overflow-scrolling is left off the tabs on purpose: it hands the
   element to WebKit's legacy momentum scroller, one of the places
   touch-action stops being honoured. */
.btabs{touch-action:pan-x}
.scroller{scroll-snap-type:x proximity}
.scroller table{scroll-snap-align:start}

.pnote{font-size:14px;color:var(--turf);margin:8px 0 0;max-width:34ch;line-height:1.5}
.pnote.bad{color:var(--flag);max-width:none}
.mp-id{font-size:17px;letter-spacing:.06em;padding:0 6px;align-self:center}
.mplist b{letter-spacing:.05em}
.mpanel .field.small{min-height:38px;padding:6px 10px;font-size:14px;max-width:150px}



/* ---- pairings & roster ---- */
.pairgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;margin-top:18px}
.paircol{border-left:3px solid var(--green);padding-left:16px}
.paircol.un{border-left:3px dashed var(--gold)}
.paircol.drop-on{background:var(--sunk)}
.phead{display:flex;align-items:center;gap:8px}
.pname{flex:1;min-width:0;min-height:44px;padding:4px 6px;border:none;border-bottom:1px dashed var(--rule);
  background:none;color:var(--ink);font-family:var(--serif);font-size:19px;font-weight:600;border-radius:0}
.pname:focus{outline:none;border-bottom-color:var(--flag)}
.pname.read{display:flex;align-items:center;font-size:19px;font-weight:600;border-bottom:none}
.ibtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--rule);
  background:var(--page);color:var(--ink);border-radius:2px;font-size:16px;flex:0 0 auto}
.ibtn:hover{border-color:var(--pine)}
.pmem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);
  flex-wrap:nowrap}
.pmem[draggable="true"]{cursor:grab}
.pmem .grip{color:var(--turf);flex:0 0 auto}
/* the name holds one line and truncates rather than dropping its surname to a
   second row; the Move to menu gives up width first. */
.pmem .mn{flex:1 1 auto;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmem .ml{font-size:14px;color:var(--turf);flex:0 0 auto;white-space:nowrap}
.pmem .mb{font-size:14px;color:var(--turf);flex:0 0 auto;text-align:right;white-space:nowrap}
.pmem select{flex:0 1 128px;min-width:56px}
.pdrop{padding:10px 0;font-size:14px;color:var(--turf)}
.rnote{font-size:14px;color:var(--turf);flex:1 1 260px}

table.rtable{border-collapse:collapse;width:100%;min-width:820px}
table.rtable th{text-align:left;font-size:14px;font-weight:400;color:var(--turf);padding:0 14px 8px 0;
  border-bottom:2px solid var(--ink);white-space:nowrap}
table.rtable td{padding:8px 14px 8px 0;border-bottom:1px solid var(--hair);vertical-align:middle}
.cellin{width:170px;padding:6px 4px;font-family:var(--serif);font-size:16px;color:var(--ink);background:none;
  border:none;border-bottom:1px dashed var(--rule);border-radius:0;min-height:40px}
.cellin.sm{width:120px}
.cellin:focus{outline:none;border-bottom-color:var(--flag)}
/* The book, fading up THROUGH the crest as it goes back. Slightly quicker
   than the crest's journey, so the page is readable before the movement
   behind it has quite finished. */
#app.behind{opacity:0}
#app.arrived{opacity:1;transition:opacity 1.1s cubic-bezier(.3,0,.35,1)}

/* Reduced motion takes the MOVEMENT away, not the opening. Shortening it
   instead would leave the book still held back by a clock that had not moved
   with it, staring at a watermark. */
@media (prefers-reduced-motion:reduce){
  @keyframes crestZoom{0%,100%{transform:none}}
  #app.arrived{transition:opacity .3s ease}
}

/* ---- the playing band, as a crest ----
   Faint and hollow until it is chosen, then filled in the pine green of the
   crest with the number struck through it. The whole thing is one button:
   the drawing carries no text, so the number stays real text. */
.bandrow{display:flex;gap:7px;flex-wrap:wrap}
.bandcrest{position:relative;width:42px;height:48px;padding:0;background:none;border:0;
  line-height:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bandcrest svg{width:100%;height:100%;display:block;overflow:visible}
.bandcrest .sh{fill:var(--sunk);stroke:var(--rule);stroke-width:1.6;
  transition:fill .22s ease,stroke .22s ease}
.bandcrest .in{fill:none;stroke:var(--rule);stroke-width:.9;opacity:.65;
  transition:stroke .22s ease,opacity .22s ease}
.bandcrest .bn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-bottom:5px;font-size:15px;font-weight:600;color:var(--turf);line-height:1;
  transition:color .22s ease}
.bandcrest{opacity:.62;transition:opacity .22s ease,transform .18s ease}

/* chosen: the ink goes on, and the crest lifts off the page a little */
.bandcrest.on{opacity:1;filter:drop-shadow(0 2px 3px var(--shadow))}
.bandcrest.on .sh{fill:var(--green);stroke:var(--ink)}
.bandcrest.on .in{stroke:var(--paper);opacity:.5}
.bandcrest.on .bn{color:var(--onpine);font-weight:700;font-size:16px}

@media (hover:hover) and (pointer:fine){
  .bandcrest:not(:disabled):hover{opacity:1;transform:translateY(-1px)}
  .bandcrest:not(:disabled):hover .sh{stroke:var(--ink)}
}
.bandcrest:disabled{cursor:not-allowed;opacity:.4}
.bandcrest.on:disabled{opacity:.75}
.bandcrest:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  .bandcrest,.bandcrest .sh,.bandcrest .in,.bandcrest .bn{transition:none}
}

.tog{display:flex;gap:4px}
.tbtn{padding:7px 11px;border:1px solid var(--rule);background:var(--page);color:var(--turf);
  font-size:15px;border-radius:2px;min-height:40px;font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine) {
  .tbtn:hover:not(:disabled){border-color:var(--pine);color:var(--ink)} }
.tbtn.on{background:var(--pine);border-color:var(--pine);color:var(--onpine);font-weight:600}
.tbtn:disabled{opacity:.55}
.cfoot-note{font-size:14px;color:var(--turf);flex:1 1 240px;min-width:0}
.saverow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:11px 14px;
  border:1px solid var(--rule);background:var(--page);border-radius:3px}
.saverow.bad{border-left:3px solid var(--flag);background:var(--sunk)}
.saverow .sm{font-size:15px;color:var(--turf)}
.saverow .tick{color:var(--green);font-weight:700;margin-right:6px}
.loadbar{margin-top:10px;padding:11px 15px;border:1px solid var(--rule);border-left:3px solid var(--gold);
  background:var(--page);border-radius:3px;font-size:15px;color:var(--turf)}
.loadbar.bad{border-left-color:var(--flag);color:var(--ink)}
.loadbar.off{border-left-color:var(--gold)}
/* the watch: refusals, in a list the master can read at a glance */
.secpanel .sec-sum{margin:8px 0 0;font-size:14px;color:var(--turf)}
.secpanel .sec-sum.new{color:var(--flag);font-weight:700}
.seclog{list-style:none;margin:10px 0 0;padding:0;font-size:12.5px;line-height:1.45;color:var(--turf);font-family:var(--mono,ui-monospace,monospace)}
.seclog li{padding:5px 0;border-top:1px solid var(--rule);word-break:break-word}
.seclog li.new{color:var(--ink)}
.seclog li.ev-direct,.seclog li.ev-blocked,.seclog li.ev-denied{color:var(--flag)}
.seclog li.ev-signin{opacity:.7}
/* on a phone the watch's words and its buttons stack: side by side the words were a column four letters wide */
@media (max-width:699px){ .secpanel > .kv,.mpanel > .kv{grid-template-columns:1fr} .secpanel > .kv .chiprow,.mpanel > .kv .chiprow{justify-self:start} }
/* a card's history: when, who, what moved, and the way back */
.histlist{list-style:none;margin:10px 0 0;padding:0}
.histlist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--rule);align-items:center}
.histlist .hl-when{font-size:12px;color:var(--turf);grid-column:1}
.histlist .hl-what{font-size:14px;color:var(--ink);grid-column:1}
.histlist .btn{grid-column:2;grid-row:1/3}
.histmodal .lede{font-size:14px}
/* the camera or the photos: two big ways in, for a phone whose file box asks nothing */
.ps-ways{display:grid;gap:10px;margin:14px 0 4px}
.ps-way{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:14px 16px;min-height:64px;border-radius:16px}
.ps-way .ps-ic{grid-row:1/3;font-size:26px;line-height:1}
.ps-way b{font-size:16px}
.ps-way small{font-size:12.5px;opacity:.8;font-weight:400}
/* moving a photo: the round, the hole */
.pv-own{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pv-mv{background:none;border:0;color:var(--onpine);opacity:.85;font-size:13px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.pm-pic{display:flex;align-items:center;gap:12px;margin:12px 0 4px;font-size:13px;color:var(--turf)}
.pm-pic img{width:64px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--rule)}
.calc-chips.holes .chip{min-width:34px;padding:4px 0;text-align:center}
/* cashed: who hit, and what it paid */
.xm-cash .xc-q{font-weight:600;font-size:15.5px;line-height:1.35}
.xm-cash .xc-res{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:6px 0 8px}
.xm-cash .xc-res b{color:var(--green)}
.xm-cash .xc-res small{font-size:12px;color:var(--turf)}
.xm-cash.hit .xc-res b{color:#8C6B2F}
.xc-lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.xc-lines li{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.xc-lines .w{font-weight:600}
.xc-lines .n{font-weight:700;text-align:right}
.xc-lines small{grid-column:1/3;font-size:12px;color:var(--turf)}
.xc-lines li.won .n{color:#2F7A4A}
.xc-lines li.lost .n{color:var(--flag)}

/* On a phone the roster was a 900px table on a 390px screen: you had to drag
   it sideways to reach Band and Remove, and the drag fought the page. Each
   person becomes a card instead, so nothing scrolls sideways at all. */
@media (max-width:720px){
  .rosterwrap{overflow-x:visible;scroll-snap-type:none}
  /* table.rtable carries min-width:820px — that floor is the whole reason
     the page panned, and it only lifts at matching specificity. */
  table.rtable{display:block;width:auto;min-width:0}
  .rtable tbody,.rtable tr,table.rtable td{display:block;width:auto;min-width:0}
  .rtable thead{display:none}
  .rtable tr{border:1px solid var(--rule);border-radius:3px;background:var(--page);
    padding:12px 14px;margin-bottom:12px}
  table.rtable td{border:0;padding:5px 0;display:grid;grid-template-columns:74px minmax(0,1fr);
    align-items:center;gap:12px}
  .rtable td::before{content:attr(data-l);font-family:var(--mono);font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--turf)}
  /* the name leads the card, full width, no label */
  table.rtable td:first-child{display:block;padding:0 0 6px}
  .rtable td:first-child::before{display:none}
  .rtable td:first-child .cellin{width:100%;font-size:18px;font-weight:700}
  .rtable td .cellin{width:100%}
  .rtable td .field.small{width:100%}
  .rtable td .tog{justify-content:flex-start}
}
@media (max-width:720px){
  /* the picker sits on its own line rather than squeezing the title beside it */
  .fx .timepick{flex:1 1 100%;justify-content:flex-start}
  /* three wheels plus a label do not fit one 390px line — the label leads,
     the wheels take the full width beneath it */
  .tt-row{flex-wrap:wrap;gap:6px}
  .tt-row > span:first-child{flex:1 1 100%}
  .tt-row .timepick,.teerow .timepick{flex:1 1 100%}
  .teerow{flex-wrap:wrap}
  .timepick{width:100%;max-width:100%}
  .timepick .tsel{flex:1 1 0;min-width:0}
  /* a band cell is empty for anyone who is not a golfer — hide the label too */
  table.rtable td:empty{display:none}
  .rtable td[data-l=""]{grid-template-columns:1fr;justify-items:start}
  .rtable td[data-l=""]::before{display:none}
}

/* Score Entry: the round picker, and beside it the hole being played —
   the same panel Course Setup uses, so the diagram and its numbers read
   identically in both places. */
.entrytop{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:32px;align-items:start;margin-top:16px}
/* One rhythm down the whole screen: the same 16px that sits between the
   standfirst and the round buttons separates every block under them. Nothing
   is spread to fill a taller neighbour — that is what opened a hole in the
   middle of the column. */
.entryleft{display:flex;flex-direction:column;gap:16px;min-width:0}
.entrytop .rcards{margin-top:0;align-content:start}
.entrytop .rcards .note-it,.entrytop .rcards .note-red{grid-column:1/-1;margin:0}
.entrytop .grouprow{margin-top:0}
/* front nine over back nine, the way a card reads — and it fills the column
   beside the diagram instead of leaving it bare */
.entrytop .scroller{margin-top:0;overflow-x:visible}
.entrytop .hstrip{grid-template-columns:repeat(9,minmax(0,1fr));min-width:0;gap:4px}
/* taller cells fill the column beside the diagram, and are a better thing to
   hit with a thumb halfway down a fairway */
.entrytop .hstrip .hcell{min-height:74px}
.entrytop .cside{flex:none;max-width:none;align-self:start}
/* the diagrams are tall portraits, so they are bounded — otherwise one sets
   the height of the whole screen. Same treatment as Course Setup. */
.entrytop .cside>img{width:auto;max-width:100%;max-height:500px;margin:0 auto}

/* ================= THE CALENDAR =================
 *
 * Eight identical cards, stacked, with a dashed button under every one and
 * the three days with golf on them drawn exactly like the five without.
 * Nothing brought you to the day you were in.
 *
 * The day you are in is a PLATE: pine, the course on it when there is a
 * round, the first tee in gold. What else is on that day sits under it as
 * lines. The other seven days are one line each, and open in full. On a
 * phone that stacks; on anything wider the plate and the week sit side by
 * side, so the whole week is still one screen. */
.calgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 36px;margin-top:14px}
@media (min-width:700px){ .calgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start} }
.calplate{position:relative;overflow:hidden;border-radius:16px;background:var(--pine);color:var(--onpine);
  padding:16px 18px 17px;min-height:150px;box-shadow:0 2px 10px rgba(16,22,17,.18)}
.calplate .cp-art{position:absolute;right:-64px;top:-44px;width:310px;height:auto;z-index:0;
  opacity:.88;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45)) saturate(1.1);pointer-events:none}
.calplate::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to right,var(--pine) 44%,rgba(29,46,33,.55))}
.calplate > *:not(.cp-art){position:relative;z-index:2}
.cp-ey{display:flex;gap:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;color:var(--sage-up)}
.cp-ey .tt{color:#E2C277}
.cp-dn{font-size:32px;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:4px 0 12px}
.cp-dn small{font-size:15px;font-weight:400;color:var(--sage-up);margin-left:9px;letter-spacing:0}
.cp-ti{font-size:18px;font-weight:700;line-height:1.2}
.cp-tm{font-size:13.5px;margin-top:3px;opacity:.92}
.cp-tm b{color:#E2C277}
.cp-go{display:inline-block;margin-top:12px;padding:8px 13px;border:0;border-radius:999px;
  background:#E2C277;color:var(--ink);font-family:inherit;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;cursor:pointer}
.cp-go:focus-visible{outline:2px solid var(--page);outline-offset:2px}
@media (hover:hover) and (pointer:fine){ .cp-go:hover{background:var(--page)} }

.calsec{display:flex;align-items:center;gap:10px;margin:20px 0 4px;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--turf)}
.calsec .add{margin-left:auto;background:none;border:1px dashed var(--gold);color:var(--turf);
  font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:5px 11px;border-radius:999px;cursor:pointer}
@media (hover:hover) and (pointer:fine){ .calsec .add:hover{color:var(--ink);border-color:var(--pine)} }

.callist{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--hair)}
.callist .de{display:flex;gap:10px;align-items:center;padding:10px 2px;
  border-bottom:1px solid var(--hair);font-size:15.5px;min-height:46px}
.callist .de.tap{width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--hair);font:inherit;color:var(--ink);cursor:pointer}
.callist .de .t{flex:0 0 74px;font-size:13px;font-weight:600;color:var(--turf);
  font-variant-numeric:tabular-nums}
.callist .de .ti{color:var(--ink);font-weight:600}
.callist .de .ti.ceremony{color:var(--gold)}
.callist .de .ti.travel{font-weight:400}
.callist .de .dpen{margin-left:auto;color:var(--turf);font-size:18px;padding-left:8px}
.callist .de.tap:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
/* The crest beside a ceremony. A mark on the line, not a thing of its own. */
.dcrest{width:18px;height:auto;flex:0 0 auto;margin-left:7px;opacity:.75;align-self:center}
.cal-none{margin:8px 0 0;font-size:14px;color:var(--turf);font-style:italic}

/* minmax(0,1fr), not 1fr: a `1fr` track's minimum is auto, which is the
   min-content width of the row's no-wrap small line — 386 points on a
   360-point phone. The column may be as narrow as the page. */
.wklist{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--hair)}
.wk{min-width:0;max-width:100%}
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--hair);padding:9px 4px 9px 2px;font:inherit;
  color:var(--ink);cursor:pointer;min-height:58px}
.wk.golf{background:rgba(29,46,33,.045)}
.wk .d{flex:0 0 42px;text-align:center;line-height:1}
.wk .d i{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--turf);margin-bottom:3px}
.wk .d b{font-size:20px;font-weight:700}
.wk .w{flex:1 1 auto;min-width:0;font-size:15px;line-height:1.25}
.wk .wh{display:block;min-width:0}
.wk .wh .dcrest{vertical-align:-4px}
.wk .w small{display:block;font-size:12.5px;color:var(--turf);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .ch{color:var(--turf);font-size:18px}
.wk:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){ .wk:hover,.callist .de.tap:hover{background:var(--sunk)} }

.lockline{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 0 0;
  border-top:1px solid var(--hair);font-size:13px;color:var(--turf);line-height:1.4}
.lockline b{color:var(--ink)}
.lockline .btn.sm{margin-left:auto;flex:0 0 auto;padding:6px 13px;min-height:34px;font-size:13px}

/* ---- a day, in full ---- */
.dsmodal{gap:0}
.ds-golf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;
  width:100%;text-align:left;margin:6px 0 0;padding:12px 13px;border:0;border-radius:12px;
  background:var(--pine);color:var(--onpine);font:inherit;cursor:pointer}
.ds-golf .t{grid-column:1;font-size:13px;color:#E2C277;font-weight:700;font-variant-numeric:tabular-nums}
.ds-golf .ti{grid-column:2;font-size:16px;font-weight:700;line-height:1.2}
.ds-golf .sub{grid-column:1 / span 2;font-size:12.5px;color:var(--sage-up)}
.ds-golf .dpen{grid-column:3;grid-row:1 / span 2;font-size:20px;color:var(--sage-up)}
.ds-golf:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.ds-rest{margin:12px 0 0;font-size:14px;color:var(--turf);font-style:italic}
.dsmodal .callist{margin-top:8px}
.dsmodal .acts{margin-top:16px}

/* ================= BEHIND MANAGE =================
 * Five screens that were built as forms. Each opens on a band of pine that
 * says what it is and the one or two numbers that matter, before anything
 * scrolls; the boxed notices are lines; the panels are cards; the tables
 * are the dense rows the rest of the book uses. */
.mhead{margin:14px 0 0;padding:15px 18px 14px;border-radius:14px;background:var(--pine);color:var(--onpine);
  border-bottom:2px solid var(--gold-up);box-shadow:0 6px 18px rgba(16,22,17,.16)}
.mh-ey{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sage-up)}
.mh-t{display:block;font-size:28px;font-weight:700;line-height:1.05;margin-top:4px;letter-spacing:-.01em}
.mh-st{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.mh-st b{display:block;font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mh-st span{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-up);font-weight:700;margin-top:4px}
.mh-st .warn b{color:#E2C277}
.mhead + .lede{margin-top:14px}
/* the notices and panels, in the book's materials */
.notice{border:0;border-left:3px solid var(--gold-up);background:var(--sunk);border-radius:12px;padding:12px 14px}
.notice b{font-size:15.5px}
.panel{border:1px solid var(--rule);background:var(--page);border-radius:12px;padding:4px 16px;gap:0}
.kv{padding:12px 0}
.kv .k{font-size:15.5px}
.kv .k small{font-size:12.5px}
.setline.still{cursor:default}
.setline.warn{border-left:3px solid var(--flag)}
.setline.warn b{color:var(--flag)}
/* a course on the index that is not yet verified carries a red mark */
.btab .unv{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--flag);margin-left:6px;vertical-align:2px}
/* the facts of a hole, as tiles */
.facttiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.fact{background:var(--page);border:1px solid var(--rule);border-radius:12px;padding:10px 8px;text-align:center}
.fact b{display:block;font-size:21px;font-weight:700;line-height:1}
.fact span{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--turf);font-weight:700;margin-top:4px}
.scard tr.on td{background:var(--sunk)}
.rating{font-size:13px;color:var(--turf);margin:12px 0 0}
/* tee times: each group a card, the names under the wheel */
.teegroup{padding:12px 14px;border:1px solid var(--rule);background:var(--page);border-radius:12px;margin-top:10px}
.teegroup + .teegroup{margin-top:10px}
.teerow .gl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--turf)}
.teehead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--turf);margin:22px 0 2px}
.gmem{font-size:13.5px}
/* the roster, a little denser */
.rtable td,.rtable th{padding-top:8px;padding-bottom:8px}

/* ---- the hole head ----
   A tablet and a laptop are not changing: the hole strip keeps its place at
   the foot of the left column, which `order` puts it back to, and the facts
   it carries on a phone stay hidden because the heading below already says
   them. */
/* ================= SCORING, ON ANYTHING WIDER =================
 *
 * The same furniture a thumb learned on a phone, fitted to a screen that
 * has room: the line that says where you are standing, a band of pine
 * with the hole and the eighteen on it that stays at the head of the glass,
 * the hole itself — whole, in a card beside the rows that keeps its place
 * while they scroll — and Save, held at the foot of the glass, inset to the
 * page. The four round cards, the group chips, the loose strip and the
 * diagram they stood beside are all said by those four things now. */
.page.scoring .entrytop,.page.scoring .entryleft{display:contents}
.page.scoring > .rcards,.page.scoring .entrytop .rcards,.page.scoring .grouprow,
.page.scoring .cside,.page.scoring .holehead{display:none}
.page.scoring > .setline{border:1px solid var(--rule);border-radius:12px;background:var(--page);
  margin-top:16px;padding:12px 16px}
.entryhd{display:block;position:sticky;top:0;z-index:31;margin:14px 0 0;
  background:var(--pine);color:var(--onpine);border-radius:14px;padding:12px 18px 0;
  border-bottom:2px solid var(--gold-up);box-shadow:0 6px 18px rgba(16,22,17,.18)}
.ehd-facts{display:flex;align-items:baseline;gap:10px}
.ehd-n{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.ehd-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-up);
  font-weight:700;padding-bottom:2px}
.ehd-m{margin-left:auto;text-align:right;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--sage-up);font-weight:700;line-height:1.5}
.ehd-m b{display:block;color:var(--onpine)}
.entryhd .scroller{margin:10px 0 0;overflow-x:auto}
.entryhd .hstrip{display:flex;gap:5px;min-width:0;padding-bottom:12px}
.entryhd .hstrip .hcell{flex:1 1 0;min-width:40px;min-height:46px;padding:4px 0;
  border-radius:8px;border:1px solid rgba(255,255,255,.2);background:none;
  color:var(--sage-up);display:grid;place-items:center;gap:0}
.entryhd .hstrip .hcell .n{font-size:14px;font-weight:600;line-height:1.1}
.entryhd .hstrip .hcell .p{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;opacity:.8}
.entryhd .hstrip .hcell.saved{background:rgba(255,255,255,.14);border-color:transparent;color:var(--onpine)}
.entryhd .hstrip .hcell.marked{position:relative}
.entryhd .hstrip .hcell.marked::after{content:"";position:absolute;top:-2px;right:-2px;
  width:7px;height:7px;border-radius:50%;background:var(--flag)}
.entryhd .hstrip .hcell.on{background:#E2C277;border-color:#E2C277;color:#1D2E21}
.entryhd .hstrip .hcell.on .n{font-weight:700}
@media (hover:hover) and (pointer:fine){ .entryhd .hstrip .hcell:not(.on):hover{border-color:rgba(255,255,255,.5);color:var(--onpine)} }

/* the two columns: the rows take the page, the hole stands beside them */
.entrygrid{grid-template-columns:minmax(0,1fr) 340px;gap:34px;margin-top:22px}
@media (min-width:1000px){ .entrygrid{grid-template-columns:minmax(0,1fr) 380px} }
.egl{min-width:0}
/* clear of the band above it, which is 116 tall with its rule */
.egr{position:sticky;top:134px;min-width:0}
.egr .holeplate{aspect-ratio:4/5;margin:0 0 22px}
.egr .side-b{margin-top:0}

/* Save, held at the foot of the glass and inset to the page: the one
   control you need on every hole, never more than a glance away. */
/* top:auto, spelled out: the rule for narrower tablets below makes this bar
   sticky to the top, and a fixed box pinned top AND bottom is the whole
   glass — it swallowed every press on an iPad mini. */
.savebar{position:fixed;left:50%;top:auto;bottom:0;transform:translateX(-50%);z-index:30;margin:0;
  width:min(calc(100% - 2 * clamp(14px,3vw,26px)),calc(1180px - 2 * clamp(14px,3vw,26px)));
  border-radius:14px 14px 0 0;border:1px solid var(--rule);border-bottom:0;
  padding:12px 18px;box-shadow:0 -8px 24px rgba(16,22,17,.14)}
.page.scoring{padding-bottom:96px}
html:has(.page.scoring){scroll-padding-top:136px;scroll-padding-bottom:110px}

/* ---- the hole, lit, and carrying what the group has done ---- */
.holeplate{display:block;position:relative;margin:13px 0 0;border-radius:16px;
  overflow:hidden;aspect-ratio:7/5;background:var(--pine);
  box-shadow:0 2px 10px rgba(16,22,17,.2)}
/* THE SHEET LAID BACK INTO THE PLATE. The stage is the window, with its
   vanishing point a third of the way down; the sheet is the drawing,
   centred on the stage and tilted fifty-two degrees away from the glass,
   then scaled and slid by the script to land the hole whole. The tilt is
   fixed here so every hole lies at the same angle; the sheet's half-height
   as a margin (736/520, halved) is what centres it before the slide. */
.hp-stage{position:absolute;inset:0;z-index:1;overflow:hidden;cursor:zoom-in}
/* THE SHADOW AND THE COLOUR ARE PUT ON THE FLAT PLATE, NOT ON THE TILTED
   SHEET. On the sheet, a phone's browser drew the filter at the sheet's own
   size — scaled up to fit a short hole, times the screen's density, a
   picture many times the size of the plate — and a phone short of memory
   simply did not draw it: the plate came up dark, with no hole on it. Here
   it is drawn once, at the size of the plate. */
.hp-lift{position:absolute;inset:0;perspective:760px;perspective-origin:50% 35%;
  filter:drop-shadow(0 14px 14px rgba(0,0,0,.5)) saturate(1.12) contrast(1.05)}
.hp-sheet{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:520/736;margin:-70.77% 0 0 -50%;
  transform:translate(var(--tx,0px),var(--ty,0px)) rotateX(52deg) scale(var(--s,1));
  transform-origin:50% 50%;backface-visibility:hidden}
.hp-sheet img{display:block;width:100%;height:auto}
/* the outline's points, read back off the glass by the fit */
.hp-k{position:absolute;width:1px;height:1px}
/* the far end into shade: the ground going away */
.hp-stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(16,22,17,.5),rgba(16,22,17,0) 40%)}
.hp-course,.hp-ghost,.hp-tee,.hp-pick,.hp-in,.hp-foot{pointer-events:none}
.hp-open{position:absolute;right:9px;bottom:30px;z-index:4;width:34px;height:34px;padding:0;
  border:0;border-radius:50%;background:rgba(238,232,213,.92);color:var(--ink);
  font-size:17px;line-height:1;display:grid;place-items:center;
  box-shadow:0 2px 7px rgba(0,0,0,.3)}
.hp-open:focus-visible{outline:2px solid #E2C277;outline-offset:2px}
.holeplate::before{content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(60% 55% at 68% 26%,rgba(226,194,119,.26),rgba(226,194,119,0) 70%),
             radial-gradient(90% 80% at 40% 80%,rgba(0,0,0,.32),rgba(0,0,0,0) 70%)}
/* Lettering over a photograph of a fairway is lettering over whatever
   the fairway happens to be doing: bright sky in one render, water in
   the next. Every mark on the plate sits on its own ground. */
.hp-course{position:absolute;right:9px;top:9px;z-index:3;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:700;color:var(--sage-up);
  background:rgba(16,22,17,.62);padding:4px 9px;border-radius:999px}
.hp-ghost{position:absolute;left:11px;bottom:2px;z-index:2;font-size:84px;font-weight:700;
  line-height:.82;color:rgba(255,255,255,.085);letter-spacing:-.04em}
.hp-tee{position:absolute;left:9px;top:9px;z-index:3;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:700;color:var(--sage-up);background:rgba(16,22,17,.62);
  padding:4px 9px;border-radius:999px}
.hp-tee b{color:var(--onpine)}
/* The plate carries the pick-up, so the band above does not say it twice.
   Where a hole has no art and no plate, the band keeps it. */
.page.scoring:has(.holeplate) .ehd-m b{display:none}
.hp-pick{position:absolute;right:9px;top:36px;z-index:3;background:var(--flag);color:#fff;
  padding:4px 10px;border-radius:999px;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700}
.hp-in{position:absolute;left:9px;bottom:30px;z-index:3;display:grid;gap:5px;justify-items:start}
.hp-pill{display:flex;align-items:center;gap:6px;background:rgba(238,232,213,.95);
  border-radius:999px;padding:3px 9px 3px 4px;font-size:12px;font-weight:700;color:var(--ink);
  box-shadow:0 2px 7px rgba(0,0,0,.3);max-width:62vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hp-pill .n{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--pine);
  color:var(--onpine);display:grid;place-items:center;font-size:11.5px}
.hp-pill .n.u{background:var(--gold-up);color:var(--ink)}
.hp-pill .n.o{background:var(--flag);color:#fff}
.hp-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:7px 12px;
  background:linear-gradient(to top,rgba(16,22,17,.9),rgba(16,22,17,0));
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:var(--sage-up);display:flex;gap:8px}
.hp-foot b{color:var(--onpine)}
.hp-foot .r{margin-left:auto}



/* ---- the one line that stands for a choice you set once ----
   Round and group on Score Entry; which timetable the hotel is on, on The
   Titanic. The sheet behind it is where the choice is actually made. */
.setline{display:flex;align-items:center;gap:7px;width:100%;margin-top:14px;
  padding:11px 15px;background:var(--sunk);border:0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-family:inherit;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;color:var(--turf);text-align:left;cursor:pointer}
.setline b{color:var(--ink)}
.setline .dot{color:var(--rule)}
.setline .ch{margin-left:auto;font-size:17px;color:var(--turf)}
.setline:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){ .setline:hover{background:var(--rule)} }
/* under the index it needs no rule of its own above it */
.gamesbar + .setline{margin-top:0;border-top:0}

@media (max-width:900px){
  /* on a phone the hole leads, then the round picker under it */
  .entrytop{grid-template-columns:1fr;gap:18px}
  .entrytop .cside{order:-1}
  /* a phone scrolls: too tall a diagram pushes the scoring off the screen,
     so it keeps the size it had while the desktop gets the big one */
  .entrytop .cside>img{max-height:340px}
  .entryleft{gap:14px}
}
}

.statusbar .build{font-size:12px;color:var(--turf);opacity:.75;letter-spacing:.04em}
.statusbar .build.phone{background:none;border:0;font:inherit;font-size:12px;padding:0;margin-left:10px;cursor:pointer;opacity:.9}
.statusbar .build.phone b{letter-spacing:.08em;font-weight:700;color:var(--ink)}

.gnote{max-width:52ch;line-height:1.5}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--flag);text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;min-height:44px}
.lnk:hover{color:var(--ink)}

/* the roster's squad cell: the same flag button the Ryder Cup uses */
.sqcell{display:inline-flex;align-items:center;gap:10px}
.sqcell .sqbox{min-height:44px;min-width:44px}
.sqcell .sqlabel{font-size:14px;color:var(--turf)}
.sqcell.uk .sqlabel,.sqcell.usa .sqlabel{color:var(--ink);font-weight:600}

.gmem{font-size:14px;color:var(--turf);margin-top:6px}

.gmem-names{display:block;color:var(--turf);opacity:.85}

/* ---- the crest asks, the day reports ---- */
.crestbtn{display:block;padding:0;border:0;background:none;border-radius:4px;line-height:0}
.crestbtn img{display:block;width:62px;height:auto;transition:transform .12s ease}
.crestbtn:hover img{transform:scale(1.06)}
.crestbtn:focus-visible{outline:2px solid var(--flag);outline-offset:3px}

.recapwrap{margin-top:16px}
.recapbtn{display:block;width:100%;text-align:left;padding:13px 16px;border:1px solid var(--rule);
  background:var(--page);border-radius:14px;min-height:60px}
.recapbtn .rb-t{display:block;font-size:18px;font-weight:700;color:var(--turf)}
.recapbtn .rb-s{display:block;font-size:14px;color:var(--turf);margin-top:2px}
.recapbtn:disabled{opacity:.55;cursor:not-allowed}
/* it lights up only when every card for the day is in */
/* It lights in the pine every band is drawn in, with the glow in gold. */
.recapbtn.ready{background:var(--pine);border-color:var(--pine);border-radius:14px}
.recapbtn.ready .rb-t{color:var(--onpine)}
.recapbtn.ready .rb-s{color:var(--onpine);opacity:.85}
.recapbtn.ready:hover{filter:brightness(1.08)}
/* A finished round has something to read. The panel breathes until someone
   opens it — a slow glow, not a strobe, and nothing at all for anyone who
   has asked their device to stop moving things. */
@keyframes recappulse{
  0%,100%{box-shadow:0 0 0 0 rgba(226,194,119,0);filter:brightness(1)}
  50%{box-shadow:0 0 26px 6px rgba(226,194,119,.55);filter:brightness(1.12)}
}
.recapbtn.ready{animation:recappulse 2.2s ease-in-out 4}   /* four breaths, then still: it sits on Today all evening */
@media (prefers-reduced-motion:reduce){.recapbtn.ready{animation:none}}

/* The same card as every other window, and it CENTRES — it had no auto
   margin, so it hung from the top of the scrim and ended up tucked under the
   phone's own clock and battery. */
.askbox{--mpad-x:20px;--mpad-y:18px;
  background:var(--page);border:0;border-radius:20px;margin:auto;
  width:min(680px,100%);max-height:min(76vh,640px);overflow-y:auto;
  padding:var(--mpad-y) var(--mpad-x) 20px;
  box-shadow:0 0 0 .5px rgba(29,46,33,.16),
             0 2px 8px rgba(16,22,17,.10),
             0 16px 34px rgba(16,22,17,.20),
             0 40px 80px rgba(16,22,17,.22);
  overflow-x:hidden}
/* The banner stays put while the conversation scrolls under it. */
.askbox .mbanner{position:sticky;top:calc(var(--mpad-y) * -1);z-index:2;margin-bottom:12px}
.asknote{font-size:14px;color:var(--turf);margin:2px 0 13px;max-width:56ch;line-height:1.5}
.askrow{display:flex;gap:8px;align-items:flex-start}
.askin{flex:1;min-height:56px;resize:vertical;font-family:var(--serif);border-radius:12px;
  padding:12px 13px;font-size:16px}
.askrow .btn{border-radius:999px;min-height:46px;padding:11px 24px;font-weight:600}
.askbox .acts{display:flex;justify-content:flex-end;margin-top:16px}
.asklist{margin-top:16px}
.askitem{border-top:1px solid var(--hair);padding:12px 0}
.askitem:first-child{border-top:2px solid var(--ink)}
/* the one you just asked, so you know where the answer is */
.askitem.current{background:var(--pine);color:var(--onpine);border-radius:12px;
  padding:13px 15px;border-top:0;margin-top:4px}
.askitem.current .askq{color:var(--onpine)}
.askq{font-weight:700;font-size:16px}
.aska{margin-top:5px;font-size:16px;line-height:1.55;white-space:pre-wrap}
.askerr{color:var(--flag)}
.askitem.current .askerr{color:var(--onpine);text-decoration:underline}
.thinking{color:var(--turf);font-style:italic}
.askitem.current .thinking{color:var(--onpine);opacity:.85}
.cursor{opacity:.6}

.recaptext{margin-top:14px;font-size:17px;line-height:1.6}
.recaptext h4{font-size:24px;font-weight:700;margin:0 0 10px;line-height:1.15}
.recaptext p{margin:0 0 12px}

@media (max-width:720px){
  /* It used to go full-bleed and square-cornered, which is what a web page
     does when it gives up, not what a window does. It stays a card. */
  .askbox{--mpad-x:18px;width:100%;max-width:100%;max-height:min(74vh,620px);border-radius:20px}
  .askrow{flex-direction:column;align-items:stretch}
  .askin{width:100%}
  .askrow .btn{width:100%}
}

/* ---- the recap, built from the tokens already in use ---- */
/* The recap is a window over the book, not a place you navigate to: whatever
   screen you were on is still behind it, and closing it puts you back there. */
.recapscrim{align-items:flex-start;padding:min(4vh,28px) 14px}
/* One scrollbar, on the window itself: the box is capped by the padded scrim
   rather than by a vh guess, which mobile browser chrome gets wrong. */
/* ---- the recap, set as a page of newsprint ----
   Same content, same order. What changes is that it stops looking like a
   dialog and starts looking like something printed: square corners, a rule
   across the top the width of the sheet, and the faintest grain so the paper
   is not a flat fill. */
/* THE BROADCAST. The window every other door in the book opens — pine at
   the head, twenty-point corners, the layered shadow — with the picture of
   the round on the front and the headline set over it, three tiles for the
   numbers of the day, then the report. The spine, the hairlines behind the
   sheet and the mid green are gone. */
/* Up and down only. The strip and the picture bleed past the padding to the
   window's edges, and a scrollbar's worth of difference is enough to let the
   window be dragged sideways; the one thing that scrolls across is the hole
   ribbon, which keeps its own scroller. */
.recapbox{background:var(--page);border:0;
  border-radius:20px;width:min(1120px,96vw);
  max-height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
  overscroll-behavior:contain;padding:0 clamp(16px,3.4vw,40px) 0;
  /* EDGES. A sheet lifted off a stack, not a panel floating in the middle of
     a screen: two hairlines offset behind it read as the pages underneath,
     and the pine rule down the left is the spine. Both are shadows rather
     than elements, so nothing is added to the page to carry them. */
  box-shadow:0 0 0 .5px rgba(29,46,33,.16),0 2px 8px rgba(16,22,17,.10),
             0 16px 34px rgba(16,22,17,.20),0 40px 80px rgba(16,22,17,.22)}
/* The strip at the head: pine, slim, and it stays while the page scrolls so
   Close is never far. Bleeds to the window's edges. */
.recaptop{position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:center;
  margin:0 calc(clamp(16px,3.4vw,40px) * -1);padding:11px clamp(16px,3.4vw,40px);
  background:var(--pine);color:var(--onpine);border-bottom:2px solid var(--gold-up)}
.recaptop b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.recaptop .rt-s{flex:1;font-size:12px;color:var(--sage-up);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recaptop .rm{color:var(--onpine);font-size:14px;min-height:36px}
/* the picture on the front, the headline over it */
.recapbox .scroller{touch-action:pan-x pan-y}
